{% extends "base.html" %}

{% block content %}
<div class="chat-container">
    <div class="sessions-sidebar">
        <div class="sessions-header">
            <h2>{{ _('Sessions') }} (<span id="sessions-count">{{ sessions|length }}</span>)</h2>
            <button id="new-session-button" class="new-session-button" title="{{ _('New session') }}">➕</button>
        </div>
        <div class="sessions-list" id="sessions-list">
            {% for s in sessions %}
            <div class="session-item {% if s.id == current_session %}active{% endif %}" data-session-id="{{ s.id }}">
                <div class="session-content">
                    <div class="session-info">
                        <div class="session-title">{{ s.title }}</div>
                        <div class="session-date">{{ s.updated_at[:19].replace('T', ' ') }}</div>
                    </div>
                    <button class="delete-session-button" title="{{ _('Delete session') }}">🗑️</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    <div class="chat-main">
        <div class="chat-header">
            <h2>{{ _('Chat') }} <span id="status-counter" class="status-counter" title="{{ _('Your requests in queue / Total in queue') }}">📊 0/0</span></h2>
            <div class="context-info-container">
                <div id="context-info" class="context-info">{{ _('Messages') }}: 0</div>
                <button id="save-chat-button" class="save-chat-button" title="{{ _('Save as HTML') }}">💾</button>
            </div>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div id="file-preview-container" style="display: none;">
            <div>
                <span id="file-preview-name"></span>
                <span id="file-preview-size"></span>
                <button id="remove-file-button">✕</button>
            </div>
        </div>
        <div id="image-modal" class="image-modal" onclick="closeImageModal()">
            <span class="image-modal-close">&times;</span>
            <img class="image-modal-content" id="modal-image">
            <div id="modal-caption"></div>
        </div>
        <div class="message-input">
            <input type="text" id="message-input" placeholder="{{ _('Enter message...') }}" autocomplete="off">
            <button id="voice-record-button" class="voice-record-button" title="{{ _('Record voice message') }}">🎤</button>
            <input type="file" id="file-input" accept="image/*,audio/*,.pdf,.doc,.docx,.txt" style="display: none;">
            <button id="attach-file-button">📎</button>
            <button id="send-button">{{ _('Send') }}</button>
            <span id="recording-indicator" style="display:none; margin-left: 10px; color: #e74c3c; font-weight: bold;">🔴 {{ _('Recording...') }}</span>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/marked.min.js') }}"></script>
<script>
    window.initialSessionId = "{{ current_session }}";
    window.TRANSLATIONS = {
        'send': {{ _("Send")|tojson }},
        'sending': {{ _("Sending...")|tojson }},
        'recording': {{ _("Recording...")|tojson }},
        'error_not_authorized': {{ _("Not authorized")|tojson }},
        'empty_message': {{ _("Empty message")|tojson }},
        'failed_recognize_speech': {{ _("Failed to recognize speech")|tojson }},
        'voice_request': {{ _("Voice request")|tojson }},
        'audio_transcribed': {{ _("Audio transcribed")|tojson }},
        'request_queued': {{ _("Request queued (position {pos})")|tojson }},
        'speech_recognized_queued': {{ _("Speech recognized, request queued (position {pos})")|tojson }},
        'transcribed': {{ _("Transcribed")|tojson }},
        'image_generated_from': {{ _("Image generated from request")|tojson }},
        'camera_snapshot': {{ _("Camera snapshot")|tojson }},
        'unknown_session': {{ _("Unknown session")|tojson }},
        'new_session': {{ _("New session")|tojson }},
        'delete_session': {{ _("Delete session")|tojson }},
        'permission_denied': {{ _("Permission denied")|tojson }},
        'session_not_found': {{ _("Session not found")|tojson }},
        'no_active_session': {{ _("No active session")|tojson }},
        'save_as_html': {{ _("Save as HTML")|tojson }},
        'chat': {{ _("Chat")|tojson }},
        'sessions': {{ _("Sessions")|tojson }},
        'messages': {{ _("Messages")|tojson }},
        'your_requests': {{ _("Your requests in queue / Total in queue")|tojson }},
        'error': {{ _("Error")|tojson }},
        'warning': {{ _("Warning")|tojson }},
        'info': {{ _("Info")|tojson }},
        'delete_session_confirm': {{ _("Delete session {title} from {date}?")|tojson }},
        'user': {{ _("user")|tojson }},
        'session': {{ _("session")|tojson }},
        'saved_on': {{ _("saved_on")|tojson }},
        'total_messages': {{ _("total_messages")|tojson }},
        'speak': {{ _("speak")|tojson }},
        'stop': {{ _("stop")|tojson }},
        'download_image': {{ _("download_image")|tojson }},
        'download_audio': {{ _("download_audio")|tojson }}
    };
    window.CURRENT_LANG = '{{ session.get("language", "ru") }}';
    function t(key) {
        return window.TRANSLATIONS[key] || key;
    }
</script>
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
{% endblock %}
