# docker-compose.gpu.yml
# GPU stack, NVIDIA by default. The file is an include so the shared services
# live in one place; AMD and Intel have their own entry files:
#   docker-compose.gpu-amd.yml     (Vulkan, experimental)
#   docker-compose.gpu-intel.yml   (Vulkan, experimental)
#   docker-compose.cpu.yml         (no GPU)
include:
  - docker-compose.gpu.base.yml
  - docker-compose.gpu.nvidia.yml
