# Whisper on the GPU — optional compose override.
#
# The default stack runs Whisper on the CPU: 12 s of speech takes ~5 s on six
# cores, and the model needs no VRAM. Enable this override when transcriptions
# are frequent or long and the card has room next to the chat model:
#
#   docker compose -f docker-compose.gpu.yml -f docker-compose.whisper-gpu.yml \
#     --profile with-voice-piper up -d
#
# and set WHISPER_GPU=true in .env, then restart the web container. The app then
# routes every transcription through the GPU queue (`_gpu_lock` + ensure_vram_for)
# and budgets WHISPER_VRAM_MB for the ASR container's CUDA context.
#
# Measured on the CPU stack: RTF ~0.42 (12 s audio → 5.2 s). A GPU build is
# expected at RTF ~0.05–0.1, i.e. a one-minute message in 3–6 s.

services:
  whisper:
    runtime: nvidia
    environment:
      - ASR_DEVICE=cuda
      - ASR_MODEL=medium
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
