services:
  redis:
    image: redis:8.0.6-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - app-network

  web:
    build: .
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - redis
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    env_file:
      - .env  
    environment:
      FLASK_ENV: production
      OLLAMA_URL: http://host.docker.internal:11434
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: 1
      TZ: ${TIMEZONE}
      PIPER_URL: ${PIPER_URL}
      # FIX: Disable eventlet green DNS to fix Redis connection issues
      EVENTLET_NO_GREENDNS: 1
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "redis:127.0.0.1"
    user: "1000:1000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    # ------------------------------------------------------------
    # Gunicorn worker configuration for WebSocket (eventlet)
    # ------------------------------------------------------------
    # Option 1: All services on the same machine (single GPU, sequential tasks)
    command: gunicorn --bind 0.0.0.0:5000 --workers 1 --threads 1 --worker-class eventlet --timeout 120 wsgi:app
    # Option 2: External services on separate machines (parallel processing possible)
    # command: gunicorn --bind 0.0.0.0:5000 --workers 2 --threads 1 --worker-class eventlet --timeout 120 wsgi:app
    # ------------------------------------------------------------
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

networks:
  app-network:
    driver: bridge

volumes:
  redis-data: