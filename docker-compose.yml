services:
  redis:
    image: redis:8.0.6-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # FIX: Bind to all interfaces and disable protected mode for Docker networking
    command: redis-server --appendonly yes --bind 0.0.0.0 --protected-mode no
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      OLLAMA_URL: http://host.docker.internal:11434
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: 1
      TZ: ${TIMEZONE}
      PIPER_URL: ${PIPER_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: "1000:1000"
    # Gunicorn with eventlet for WebSocket support
    command: gunicorn --bind 0.0.0.0:5000 --workers 1 --threads 1 --worker-class eventlet --timeout 120 wsgi:app
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

networks:
  app-network:
    driver: bridge

volumes:
  redis-data: