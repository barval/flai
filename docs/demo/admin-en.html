<script>// app/static/js/admin-monitoring.js
// Monitoring tab: one payload, eight hand-made SVG charts (no chart library).
(function () {
    'use strict';

    const SERIES_OF = {
        storage: 'storage_bytes',
        sessions: 'sessions',
        messages: 'messages',
        tasks: 'tasks',
        outgoing_tokens: 'outgoing_tokens',
        incoming_tokens: 'incoming_tokens',
        files: 'files',
        documents: 'documents',
        web_requests: 'web_requests',
        cpu: 'cpu_pct',
        ram: 'ram_pct',
        gpu: 'gpu_pct',
        vram: 'vram_pct'
    };
    const METRICS = Object.keys(SERIES_OF);
    const POLL_MS = 60000;
    const NS = 'http://www.w3.org/2000/svg';
    const W = 360;
    const H = 150;
    const PAD = { left: 46, right: 8, top: 12, bottom: 22 };
    const Y_INTERVALS = 5;
    const X_TICKS = 6;

    const select = document.getElementById('monitoring-user');
    const rangeBox = document.getElementById('monitoring-range');
    const errorBox = document.getElementById('monitoring-error');
    if (!select || !rangeBox || !document.getElementById('monitoring-cards')) return;

    const t = (key) => (window.TRANSLATIONS && window.TRANSLATIONS[key]) || key;
    let currentRange = '24h';
    let currentUser = 'all';

    function isActive() {
        const tab = document.getElementById('monitoring-tab');
        return !!tab && tab.classList.contains('active');
    }

    function el(name, attrs) {
        const node = document.createElementNS(NS, name);
        Object.keys(attrs || {}).forEach((key) => node.setAttribute(key, attrs[key]));
        return node;
    }

    function formatMb(bytes) {
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function formatInt(value) {
        return Number(value || 0).toLocaleString();
    }

    // Axis ticks must read as round numbers (0, 20 000, 40 000 …), never as the
    // raw maximum (67 304). The browser locale of the page keeps grouping and
    // the compact suffix ("k" or the localized thousands marker) consistent
    // with the active profile.
    function axisLabel(value) {
        const abs = Math.abs(value);
        if (abs >= 10000) {
            return new Intl.NumberFormat(document.documentElement.lang || undefined, {
                notation: 'compact',
                maximumFractionDigits: 1
            }).format(value);
        }
        if (Number.isInteger(value)) return formatInt(value);
        return value.toFixed(1);
    }

    function niceStep(rawStep) {
        if (!(rawStep > 0)) return 1;
        const power = Math.pow(10, Math.floor(Math.log10(rawStep)));
        const candidates = [1, 2, 2.5, 5, 10];
        for (let index = 0; index < candidates.length; index += 1) {
            if (candidates[index] * power >= rawStep) return candidates[index] * power;
        }
        return 10 * power;
    }

    function niceScale(maxValue) {
        const step = niceStep(maxValue / Y_INTERVALS);
        return { top: Math.ceil(maxValue / step) * step, step };
    }

    function formatTooltipLabel(iso) {
        return new Date(iso).toLocaleString();
    }

    function formatTickLabel(iso) {
        const date = new Date(iso);
        if (currentRange === '7d' || currentRange === '30d') {
            return date.toLocaleDateString([], { day: '2-digit', month: '2-digit' });
        }
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function seriesValues(metric, data) {
        const key = SERIES_OF[metric];
        const raw = (data.series && data.series[key]) || [];
        return raw.slice(0, data.buckets.length);
    }

    function renderChart(svg, buckets, values, options) {
        while (svg.firstChild) svg.removeChild(svg.firstChild);
        if (!buckets.length) return;

        const known = values.filter((value) => value !== null && value !== undefined);
        if (!known.some((value) => value > 0)) return;

        const scale = options.scale || 1;
        const display = values.map((value) =>
            value === null || value === undefined ? null : value * scale
        );
        const max = Math.max.apply(null, display.filter((value) => value !== null));
        const { top, step: valueStep } = niceScale(max);
        const plotW = W - PAD.left - PAD.right;
        const plotH = H - PAD.top - PAD.bottom;
        const slot = plotW / buckets.length;
        const barW = Math.max(1, slot * 0.7);
        const baseline = PAD.top + plotH;

        const y = (value) => PAD.top + plotH - (value / top) * plotH;

        // Horizontal grid: round values only, one line per tick.
        const tickCount = Math.round(top / valueStep);
        for (let index = 0; index <= tickCount; index += 1) {
            const value = index * valueStep;
            const lineY = y(value);
            svg.appendChild(el('line', {
                x1: PAD.left, y1: lineY.toFixed(1), x2: W - PAD.right, y2: lineY.toFixed(1),
                class: 'monitoring-grid'
            }));
            const label = el('text', {
                x: PAD.left - 8, y: (lineY + 3).toFixed(1), class: 'monitoring-axis', 'text-anchor': 'end'
            });
            label.textContent = options.format(value);
            svg.appendChild(label);
        }

        // Vertical grid, one line per time label under the bars.
        const tickIndexes = [];
        const tickTotal = Math.min(X_TICKS, buckets.length);
        for (let index = 0; index < tickTotal; index += 1) {
            const bucketIndex = tickTotal === 1
                ? 0
                : Math.round((index * (buckets.length - 1)) / (tickTotal - 1));
            if (tickIndexes.indexOf(bucketIndex) === -1) tickIndexes.push(bucketIndex);
        }
        tickIndexes.forEach((bucketIndex) => {
            const centerX = PAD.left + bucketIndex * slot + slot / 2;
            svg.appendChild(el('line', {
                x1: centerX.toFixed(1), y1: PAD.top, x2: centerX.toFixed(1), y2: baseline,
                class: 'monitoring-grid-v'
            }));
            const label = el('text', {
                x: centerX.toFixed(1), y: H - 6, class: 'monitoring-axis', 'text-anchor': 'middle'
            });
            label.textContent = formatTickLabel(buckets[bucketIndex]);
            svg.appendChild(label);
        });

        display.forEach((value, index) => {
            if (value === null || value === undefined || value <= 0) return;
            const bar = el('rect', {
                x: (PAD.left + index * slot + (slot - barW) / 2).toFixed(1),
                y: y(value).toFixed(1),
                width: barW.toFixed(1),
                height: Math.max(1, baseline - y(value)).toFixed(1),
                class: 'monitoring-bar'
            });
            const title = el('title');
            title.textContent = formatTooltipLabel(buckets[index]) + ' — ' + options.tooltip(values[index]);
            bar.appendChild(title);
            svg.appendChild(bar);
        });
    }

    function renderCard(metric, data) {
        const svg = document.getElementById('monitoring-chart-' + metric);
        const valueBox = document.getElementById('monitoring-value-' + metric);
        if (!svg || !valueBox) return;

        const values = seriesValues(metric, data);
        const buckets = data.buckets || [];
        const hasData = values.some((value) => value !== null && value !== undefined && value > 0);

        if (metric === 'storage') {
            const storage = data.storage || {};
            const limit = storage.limit_bytes || 0;
            const used = storage.current_bytes || 0;
            const percent = limit ? ((used / limit) * 100).toFixed(1) : '0.0';
            valueBox.textContent = hasData || storage.since
                ? formatMb(used) + ' / ' + formatMb(limit) + ' (' + percent + '%)'
                : t('monitoring_no_data');

            const sinceBox = document.getElementById('monitoring-since-storage');
            if (sinceBox) {
                if (storage.since) {
                    sinceBox.textContent = t('monitoring_since').replace(
                        '{date}',
                        new Date(storage.since).toLocaleString()
                    );
                    sinceBox.hidden = false;
                } else {
                    sinceBox.hidden = true;
                }
            }

            renderChart(svg, buckets, values, {
                scale: 1 / (1024 * 1024),
                format: (value) => axisLabel(value) + ' MB',
                tooltip: (value) => formatMb(value)
            });
            return;
        }

        if (metric === 'cpu' || metric === 'gpu') {
            const samples = values.filter((value) => value !== null && value !== undefined);
            const last = samples.length ? samples[samples.length - 1] : null;
            valueBox.textContent = last === null ? t('monitoring_no_data') : last.toFixed(1) + '%';
            renderChart(svg, buckets, values, {
                scale: 1,
                format: (value) => value + '%',
                tooltip: (value) => value.toFixed(1) + '%'
            });
            return;
        }

        if (metric === 'ram' || metric === 'vram') {
            const system = data.system || {};
            const usedKey = metric === 'ram' ? 'ram_used_mb' : 'vram_used_mb';
            const totalKey = metric === 'ram' ? 'ram_total_mb' : 'vram_total_mb';
            const used = system[usedKey] || 0;
            const total = system[totalKey] || 0;
            valueBox.textContent = total
                ? formatMb(used * 1024 * 1024) + ' / ' + formatMb(total * 1024 * 1024) +
                  ' (' + ((used / total) * 100).toFixed(1) + '%)'
                : t('monitoring_no_data');
            renderChart(svg, buckets, values, {
                scale: 1,
                format: (value) => value + '%',
                tooltip: (value) => value.toFixed(1) + '%'
            });
            return;
        }

        const total = values.reduce((acc, value) => acc + (value || 0), 0);
        valueBox.textContent = hasData ? formatInt(total) : t('monitoring_no_data');
        renderChart(svg, buckets, values, {
            scale: 1,
            format: axisLabel,
            tooltip: (value) => formatInt(Math.round(value))
        });
    }

    function render(data) {
        METRICS.forEach((metric) => renderCard(metric, data));
    }

    function populateUsers(users) {
        const wanted = currentUser;
        select.innerHTML = '';
        const all = document.createElement('option');
        all.value = 'all';
        all.textContent = t('monitoring_all_users');
        select.appendChild(all);
        (users || []).forEach((user) => {
            const option = document.createElement('option');
            option.value = user.login;
            option.textContent = user.login;
            select.appendChild(option);
        });
        if (wanted !== 'all' && !users.some((user) => user.login === wanted)) {
            currentUser = 'all';
        }
        select.value = currentUser;
    }

    function showError(message) {
        if (!errorBox) return;
        errorBox.textContent = message;
        errorBox.hidden = false;
    }

    function hideError() {
        if (errorBox) errorBox.hidden = true;
    }

    async function loadMonitoring() {
        hideError();
        try {
            const url = '/admin/api/monitoring?user=' + encodeURIComponent(currentUser) +
                '&range=' + encodeURIComponent(currentRange);
            const resp = await fetch(url, { credentials: 'same-origin' });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const data = await resp.json();
            populateUsers(data.users || []);
            render(data);
        } catch (err) {
            showError(t('monitoring_load_error'));
        }
    }

    rangeBox.querySelectorAll('.monitoring-range-btn').forEach((button) => {
        button.addEventListener('click', () => {
            rangeBox.querySelectorAll('.monitoring-range-btn').forEach((other) => other.classList.remove('active'));
            button.classList.add('active');
            currentRange = button.dataset.range;
            loadMonitoring();
        });
    });

    select.addEventListener('change', () => {
        currentUser = select.value;
        loadMonitoring();
    });

    const tabButton = document.querySelector('.admin-tab[data-tab="monitoring"]');
    if (tabButton) tabButton.addEventListener('click', loadMonitoring);

    document.addEventListener('DOMContentLoaded', () => {
        if (isActive()) loadMonitoring();
    });

    setInterval(() => {
        if (isActive()) loadMonitoring();
    }, POLL_MS);

    window.Monitoring = { init: loadMonitoring };
})();
<\/script>
<script>// app/static/js/admin-settings.js
// Settings tab: renders every admin-editable parameter from the server schema.
// A saved value lives in the database and overrides .env; "reset" drops it.
(function () {
    'use strict';

    const searchInput = document.getElementById('settings-search');
    const saveButton = document.getElementById('settings-save');
    const statusBox = document.getElementById('settings-status');
    const groupsBox = document.getElementById('settings-groups');
    if (!searchInput || !saveButton || !groupsBox) return;

    const t = (key) => (window.TRANSLATIONS && window.TRANSLATIONS[key]) || key;
    const dirty = new Map();
    let schema = [];

    function humanize(key) {
        return key.toLowerCase().replace(/_/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
    }

    function setStatus(text, isError) {
        statusBox.textContent = text || '';
        statusBox.classList.toggle('is-error', !!isError);
    }

    function markDirty() {
        saveButton.disabled = dirty.size === 0;
    }

    function buildField(field) {
        const row = document.createElement('tr');
        row.className = 'settings-field';
        row.dataset.key = field.key;

        const nameCell = document.createElement('td');
        nameCell.className = 'settings-name';
        const label = document.createElement('label');
        label.className = 'settings-field-label';
        label.textContent = humanize(field.key);
        label.title = field.key;
        label.htmlFor = 'setting-' + field.key;
        nameCell.appendChild(label);
        row.appendChild(nameCell);

        const descriptionCell = document.createElement('td');
        descriptionCell.className = 'settings-description';
        descriptionCell.textContent = field.description ? t(field.description) : '';
        descriptionCell.title = field.description || '';
        row.appendChild(descriptionCell);

        const valueCell = document.createElement('td');
        valueCell.className = 'settings-value';

        let input;
        if (field.kind === 'bool') {
            input = document.createElement('input');
            input.type = 'checkbox';
            input.checked = field.value === true;
        } else {
            input = document.createElement('input');
            input.type = field.secret ? 'password' : (field.kind === 'int' || field.kind === 'float' ? 'number' : 'text');
            if (field.kind === 'int') input.step = '1';
            if (field.kind === 'float') input.step = 'any';
            if (field.secret) {
                input.placeholder = field.has_value ? '••••••' : '';
                input.autocomplete = 'new-password';
            } else {
                input.value = field.value === null || field.value === undefined ? '' : String(field.value);
            }
        }
        input.id = 'setting-' + field.key;
        input.className = 'settings-input';
        input.dataset.kind = field.kind;
        input.addEventListener('change', () => {
            if (field.secret) {
                if (!input.value) return; // an empty secret field means "leave unchanged"
                dirty.set(field.key, input.value);
            } else if (field.kind === 'bool') {
                dirty.set(field.key, input.checked);
            } else {
                dirty.set(field.key, input.value);
            }
            markDirty();
        });
        valueCell.appendChild(input);
        row.appendChild(valueCell);

        const defaultCell = document.createElement('td');
        defaultCell.className = 'settings-default';
        const meta = document.createElement('span');
        meta.className = 'settings-default-value';
        if (field.secret) {
            meta.textContent = field.has_value ? t('settings_secret_set') : t('settings_secret_empty');
        } else {
            meta.textContent = String(field.default);
        }
        defaultCell.appendChild(meta);

        const reset = document.createElement('button');
        reset.type = 'button';
        reset.className = 'settings-reset';
        reset.textContent = '↺';
        reset.title = t('settings_reset');
        reset.addEventListener('click', () => resetField(field.key));
        defaultCell.appendChild(reset);
        row.appendChild(defaultCell);

        return row;
    }

    function render() {
        groupsBox.innerHTML = '';
        schema.forEach((group) => {
            const details = document.createElement('details');
            details.className = 'settings-group';
            details.open = false;
            details.dataset.group = group.id;

            const summary = document.createElement('summary');
            summary.textContent = t(group.label) || group.label;
            const count = document.createElement('span');
            count.className = 'settings-count';
            count.textContent = group.fields.length;
            summary.appendChild(count);
            details.appendChild(summary);

            const table = document.createElement('table');
            table.className = 'settings-table';
            const head = document.createElement('thead');
            const headRow = document.createElement('tr');
            [t('Variable'), t('Description'), t('Value'), t('Default value')].forEach(
                (title) => {
                    const th = document.createElement('th');
                    th.textContent = title;
                    headRow.appendChild(th);
                }
            );
            head.appendChild(headRow);
            table.appendChild(head);
            const body = document.createElement('tbody');
            group.fields.forEach((field) => body.appendChild(buildField(field)));
            table.appendChild(body);
            details.appendChild(table);
            groupsBox.appendChild(details);
        });
        applyFilter();
    }

    function applyFilter() {
        const needle = searchInput.value.trim().toLowerCase();
        groupsBox.querySelectorAll('.settings-group').forEach((group) => {
            let visible = 0;
            group.querySelectorAll('.settings-field').forEach((field) => {
                const key = field.dataset.key.toLowerCase();
                const description = (field.querySelector('.settings-description') || {}).textContent || '';
                const match = !needle
                    || key.includes(needle)
                    || humanize(field.dataset.key).toLowerCase().includes(needle)
                    || description.toLowerCase().includes(needle);
                field.hidden = !match;
                if (match) visible += 1;
            });
            group.hidden = visible === 0;
            if (needle) group.open = true;
        });
    }

    function load() {
        return fetch('/admin/api/settings', { credentials: 'same-origin' })
            .then((response) => response.json())
            .then((payload) => {
                schema = payload.groups || [];
                dirty.clear();
                markDirty();
                render();
            })
            .catch(() => setStatus(t('settings_load_error'), true));
    }

    function save() {
        if (!dirty.size) return;
        const values = {};
        dirty.forEach((value, key) => { values[key] = value; });
        setStatus(t('settings_saving'));
        fetchWithCSRF('/admin/api/settings', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ values: values })
        }).then((response) => response.json()).then((result) => {
            if (result.status === 'ok') {
                setStatus(t('settings_saved'));
                load();
            } else {
                setStatus(result.error || t('settings_invalid'), true);
            }
        }).catch(() => setStatus(t('settings_invalid'), true));
    }

    function resetField(key) {
        fetchWithCSRF('/admin/api/settings/reset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ keys: [key] })
        }).then((response) => response.json()).then((result) => {
            if (result.status === 'ok') {
                setStatus(t('settings_reset_done'));
                load();
            }
        }).catch(() => setStatus(t('settings_invalid'), true));
    }

    saveButton.addEventListener('click', save);
    searchInput.addEventListener('input', applyFilter);

    const tabButton = document.querySelector('.admin-tab[data-tab="settings"]');
    if (tabButton) tabButton.addEventListener('click', load);

    document.addEventListener('DOMContentLoaded', () => {
        const tab = document.getElementById('settings-tab');
        if (tab && tab.classList.contains('active')) load();
    });

    window.AdminSettings = { load: load };
})();
<\/script>

<script>// app/static/js/admin-cameras.js
// Camera rooms — sync from room-snapshot-api + preview thumbnails

const CAM_CACHE_PREFIX = 'cam_preview_';

document.addEventListener('DOMContentLoaded', function() {
    loadCameras(false);
    setupSyncButton();
    setupPreviewModal();
});

function setupSyncButton() {
    const btn = document.getElementById('sync-cameras-btn');
    if (btn) {
        btn.addEventListener('click', syncCameras);
    }
}

function setSyncing(btn, active) {
    if (!btn) return;
    btn.disabled = active;
    if (active) {
        btn.classList.add('btn-syncing');
        btn.textContent = '🔄 ' + t('Loading...');
    } else {
        btn.classList.remove('btn-syncing');
        btn.textContent = '🔄 ' + t('Update camera list');
    }
}

function syncCameras() {
    const btn = document.getElementById('sync-cameras-btn');
    setSyncing(btn, true);

    clearImageCache();

    fetchWithCSRF('/admin/api/cameras/sync', { method: 'POST' })
    .then(r => r.json())
    .then(result => {
        if (result.status === 'ok') {
            loadCameras(true);
        } else {
            setSyncing(btn, false);
            alert(t('error') + ': ' + (result.error || t('unknown_error')));
        }
    })
    .catch(err => {
        console.error('Error syncing cameras:', err);
        setSyncing(btn, false);
        alert(t('Sync error'));
    });
}

function loadCameras(syncing) {
    const btn = document.getElementById('sync-cameras-btn');
    let pendingLoads = 0;

    function onPreviewDone() {
        pendingLoads--;
        if (syncing && pendingLoads <= 0) {
            setSyncing(btn, false);
        }
    }

    fetch('/admin/api/cameras')
    .then(response => response.json())
    .then(rooms => {
        const tbody = document.getElementById('cameras-tbody');
        const noMsg = document.getElementById('no-cameras-msg');
        if (!rooms || rooms.length === 0) {
            tbody.innerHTML = '';
            if (noMsg) noMsg.style.display = 'block';
            if (syncing) setSyncing(btn, false);
            return;
        }
        if (noMsg) noMsg.style.display = 'none';
        tbody.innerHTML = '';

        rooms.forEach((room, index) => {
            const row = document.createElement('tr');
            row.dataset.code = room.code;

            // Row number
            const numCell = document.createElement('td');
            numCell.textContent = index + 1;
            numCell.className = 'cam-num';
            row.appendChild(numCell);

            // Status checkbox
            const statusCell = document.createElement('td');
            const statusCheck = document.createElement('input');
            statusCheck.type = 'checkbox';
            statusCheck.checked = room.enabled;
            statusCheck.addEventListener('change', async function() {
                const checkbox = this;
                try {
                    const resp = await fetchWithCSRF('/admin/api/cameras/' + room.code + '/toggle', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ enabled: checkbox.checked })
                    });
                    const result = await resp.json();
                    if (result.status !== 'ok') {
                        checkbox.checked = !checkbox.checked;
                        alert(t('error') + ': ' + (result.error || t('unknown_error')));
                    }
                } catch (err) {
                    checkbox.checked = !checkbox.checked;
                    alert(t('error') + ': ' + err.message);
                }
            });
            statusCell.appendChild(statusCheck);
            row.appendChild(statusCell);

            // Code
            const codeCell = document.createElement('td');
            codeCell.textContent = room.code;
            codeCell.className = 'cam-code';
            row.appendChild(codeCell);

            // Room (name)
            const roomCell = document.createElement('td');
            const forms = room.name_forms || [];
            const bold = document.createElement('b');
            bold.textContent = forms[0] || room.code;
            roomCell.appendChild(bold);
            if (forms.length > 1) {
                const rest = document.createElement('span');
                rest.textContent = ` (${forms.slice(1).join(', ')})`;
                roomCell.appendChild(rest);
            }
            row.appendChild(roomCell);

            // Preview thumbnail
            const previewCell = document.createElement('td');
            previewCell.className = 'cam-preview-cell';
            const img = document.createElement('img');
            img.className = 'cam-preview';
            img.alt = room.code;
            img.width = 192;
            img.height = 108;

            const proxyUrl = '/admin/api/cameras/' + room.code + '/proxy';

            // Spinner shown while image loads
            const spinner = document.createElement('div');
            spinner.className = 'cam-spinner';

            const cached = getCachedImage(room.code);
            if (cached) {
                img.src = cached;
                previewCell.classList.add('cam-online');
            } else if (syncing) {
                // Only fetch from proxy when user clicked "Update" button
                img.src = proxyUrl;
                previewCell.appendChild(spinner);
                pendingLoads++;
            } else {
                // Initial page load — no cache, show placeholder
                img.style.display = 'none';
                const placeholder = document.createElement('span');
                placeholder.className = 'cam-preview-error';
                placeholder.textContent = '—';
                previewCell.appendChild(placeholder);
            }

            img.onload = function() {
                const s = previewCell.querySelector('.cam-spinner');
                if (s) s.remove();
                previewCell.classList.add('cam-online');
                previewCell.classList.remove('cam-offline');
                if (!cached && this.src.includes('/proxy') && !this.src.startsWith('data:')) {
                    cacheImage(room.code, this);
                }
                if (cached) return;
                onPreviewDone();
            };
            img.onerror = function() {
                const s = previewCell.querySelector('.cam-spinner');
                if (s) s.remove();
                if (this.dataset.retried !== 'true') {
                    this.dataset.retried = 'true';
                    setTimeout(() => {
                        this.src = proxyUrl + '?t=' + Date.now();
                    }, 1000);
                    return;
                }
                previewCell.classList.add('cam-offline');
                previewCell.classList.remove('cam-online');
                this.style.display = 'none';
                const placeholder = document.createElement('span');
                placeholder.className = 'cam-preview-error';
                placeholder.textContent = '—';
                previewCell.appendChild(placeholder);
                onPreviewDone();
            };

            img.onclick = function() {
                openPreviewModal(this.src, room.code);
            };

            previewCell.appendChild(img);
            row.appendChild(previewCell);

            tbody.appendChild(row);
        });

        // If all images were cached, no pending loads — stop syncing immediately
        if (syncing && pendingLoads <= 0) {
            setSyncing(btn, false);
        }
    })
    .catch(err => {
        console.error('Error loading cameras:', err);
        if (syncing) setSyncing(btn, false);
    });
}

function getCachedImage(code) {
    try {
        const raw = localStorage.getItem(CAM_CACHE_PREFIX + code);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return parsed.data;
    } catch {
        return null;
    }
}

function cacheImage(code, imgElement) {
    try {
        const canvas = document.createElement('canvas');
        canvas.width = imgElement.naturalWidth || imgElement.width;
        canvas.height = imgElement.naturalHeight || imgElement.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(imgElement, 0, 0);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        localStorage.setItem(CAM_CACHE_PREFIX + code, JSON.stringify({
            data: dataUrl,
            ts: Date.now()
        }));
    } catch (e) {
        clearImageCache();
    }
}

function clearImageCache() {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith(CAM_CACHE_PREFIX)) {
            keys.push(key);
        }
    }
    keys.forEach(k => localStorage.removeItem(k));
}

function setupPreviewModal() {
    if (!document.getElementById('preview-modal')) {
        const modal = document.createElement('div');
        modal.id = 'preview-modal';
        modal.className = 'preview-modal';
        modal.innerHTML = '<span class="preview-modal-close">&times;</span><img id="preview-modal-img" src="" alt="">';
        document.body.appendChild(modal);

        modal.querySelector('.preview-modal-close').onclick = () => {
            modal.style.display = 'none';
        };
        modal.onclick = (e) => {
            if (e.target === modal) modal.style.display = 'none';
        };
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') modal.style.display = 'none';
        });
    }
}

function openPreviewModal(src, code) {
    const modal = document.getElementById('preview-modal');
    const img = document.getElementById('preview-modal-img');
    if (modal && img) {
        img.src = src;
        img.alt = code;
        modal.style.display = 'flex';
    }
}
<\/script>

    <script>// static/js/header.js
// Handles language, voice gender, and theme switching in the header

// CSRF token helper
function getCSRFToken() {
    const meta = document.querySelector('meta[name="csrf-token"]');
    return meta ? meta.content : '';
}

function fetchWithCSRF(url, options = {}) {
    const method = (options.method || 'GET').toUpperCase();
    if (['POST', 'PUT', 'DELETE', 'PATCH'].includes(method)) {
        const headers = options.headers || {};
        if (!headers['X-CSRFToken'] && !headers['X-CSRF-TOKEN']) {
            headers['X-CSRFToken'] = getCSRFToken();
        }
        options.headers = headers;
    }
    options.credentials = 'same-origin';
    return fetch(url, options);
}

function t(key) {
    if (!(key in window.TRANSLATIONS)) {
        dwarn('Missing translation key:', key);
        return key;
    }
    return window.TRANSLATIONS[key];
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Mobile layout: the language dropdown shows only the native short labels
// and the voice
// gender / theme buttons live in the footer row (left / right corner).
function isMobileLayout() {
    return window.matchMedia('(max-width: 768px)').matches;
}

// Mobile: hide the native select, show the custom dropdown (short toggle +
// a menu listing the full names). Desktop: the select alone. The menu always
// starts closed; [hidden] is honoured via CSS rules, not UA defaults.
function applyCompactLangOptions(compact) {
    document.querySelectorAll('.language-switcher').forEach(box => {
        const toggle = box.querySelector('.lang-toggle');
        const menu = box.querySelector('.lang-menu');
        const select = box.querySelector('select');
        if (toggle) toggle.hidden = !compact;
        if (menu) menu.hidden = true; // never open on layout switch
        if (select) select.hidden = compact;
    });
}

// Short label for the closed toggle, taken from the select's
// data-short attributes (authoritative, matches the option language).
function langShortLabel(box) {
    const select = box.querySelector('select');
    if (!select) return 'Ру';
    const selected = select.querySelector('option:checked') || select.querySelector('option');
    return (selected && selected.dataset.short) || 'Ру';
}

// Wire the custom mobile language dropdown: the toggle shows the short label,
// the menu lists each language under its native full name.
function initLangDropdown() {
    document.querySelectorAll('.language-switcher').forEach(box => {
        const toggle = box.querySelector('.lang-toggle');
        const menu = box.querySelector('.lang-menu');
        if (!toggle || !menu || toggle.dataset.bound) return;
        toggle.dataset.bound = '1';

        const syncToggleLabel = () => {
            toggle.textContent = langShortLabel(box) + ' ▾';
        };
        syncToggleLabel();
        // Re-sync after the session language changes (full page reload) and
        // whenever the select value changes while the dropdown is hidden.
        box.querySelector('select').addEventListener('change', syncToggleLabel);

        toggle.addEventListener('click', function(e) {
            e.stopPropagation();
            menu.hidden = !menu.hidden;
        });
        menu.querySelectorAll('.lang-option').forEach(btn => {
            btn.addEventListener('click', function() {
                menu.hidden = true;
                switchLanguage(this.dataset.lang);
            });
        });
        // Close on outside click
        document.addEventListener('click', function(e) {
            if (!menu.hidden && !box.contains(e.target)) menu.hidden = true;
        });
    });
}

// Move the voice-gender and theme switchers between the header rows and the
// footer bar. The elements keep their event handlers — only the parent node
// changes. Mobile: voice goes to the footer left corner, theme to the right.
// Desktop: both sit in row1 BEFORE the user name, so the logout form stays
// the rightmost control. The guest (login) page has no voice switcher and no
// rows — the theme switcher returns directly into <header>.
function relocateHeaderControls() {
    const theme = document.querySelector('.theme-switcher');
    if (!theme) return;
    const voice = document.querySelector('.voice-gender-switcher');
    if (isMobileLayout()) {
        const footer = document.querySelector('footer');
        if (!footer || theme.dataset.location === 'footer') return;
        theme.dataset.location = 'footer';
        if (voice) {
            voice.dataset.location = 'footer';
            footer.insertBefore(voice, footer.firstChild); // left corner
        }
        footer.appendChild(theme); // right corner
    } else {
        if (theme.dataset.location !== 'footer') return;
        delete theme.dataset.location;
        if (voice) delete voice.dataset.location;
        const anchor = document.getElementById('api-keys-btn');
        const row1 = document.querySelector('.header-row.row1');
        if (row1 && anchor) {
            // Voice, then theme, then the user name — logout stays rightmost.
            if (voice) row1.insertBefore(voice, anchor);
            row1.insertBefore(theme, voice ? voice : anchor);
        } else {
            const header = document.querySelector('header');
            if (!header) return;
            if (voice) header.appendChild(voice);
            header.appendChild(theme);
        }
    }
}

document.addEventListener('DOMContentLoaded', function() {
    // Language switcher
    const langSelect = document.getElementById('language-select');
    if (langSelect) {
        langSelect.addEventListener('change', function() {
            switchLanguage(this.value);
        });
    }

    // Compact language options + footer relocation on mobile
    applyCompactLangOptions(isMobileLayout());
    initLangDropdown();
    relocateHeaderControls();
    window.addEventListener('resize', function() {
        applyCompactLangOptions(isMobileLayout());
        relocateHeaderControls();
    });

    // Voice gender toggle
    const voiceBtn = document.getElementById('voice-gender-toggle');
    if (voiceBtn) {
        voiceBtn.addEventListener('click', function() {
            const currentIcon = document.getElementById('voice-gender-icon').textContent;
            const newGender = currentIcon === '👨' ? 'female' : 'male';
            switchVoiceGender(newGender);
        });
    }

    // Theme toggle
    const themeBtn = document.getElementById('theme-toggle') || document.getElementById('theme-toggle-guest');
    if (themeBtn) {
        themeBtn.addEventListener('click', function() {
            const currentTheme = document.body.classList.contains('dark-theme') ? 'dark' : 'light';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            switchTheme(newTheme);
        });
    }
});

function switchLanguage(lang) {
    fetchWithCSRF('/set-language/' + lang, {
        method: 'POST',
        headers: { 'Cache-Control': 'no-cache' }
    }).then(() => {
        window.location.reload();
    }).catch(() => {
        window.location.reload();
    });
}

// Login page theme setup
function setupLoginTheme() {
    const themeInput = document.getElementById('login-theme');
    if (themeInput) {
        themeInput.value = localStorage.getItem('guest_theme') || 'light';
    }
}

document.addEventListener('DOMContentLoaded', function() {
    setupLoginTheme();
    
    // Initialize global flags
    window.IS_RELOADING = false;
});

function switchVoiceGender(gender) {
    // Stop current TTS playback if any (will restart with new voice)
    if (window.resetTtsState) {
        window.resetTtsState();
    }

    fetchWithCSRF('/set-voice-gender/' + gender, {
        method: 'POST',
        headers: { 'Cache-Control': 'no-cache' }
    }).then(() => {
        const icon = document.getElementById('voice-gender-icon');
        icon.textContent = gender === 'female' ? '👩' : '👨';
        // Update button class and title
        const btn = document.getElementById('voice-gender-toggle');
        btn.className = 'voice-gender-button ' + gender;
        btn.title = gender === 'female'
            ? window.TRANSLATIONS['female_voice']
            : window.TRANSLATIONS['male_voice'];
    }).catch(() => {
        window.location.reload();
    });
}

function switchTheme(theme) {
    // Do NOT stop TTS playback when switching theme
    fetchWithCSRF('/set-theme/' + theme, {
        method: 'POST',
        headers: { 'Cache-Control': 'no-cache' }
    }).then(() => {
        // Update body class
        document.body.classList.toggle('dark-theme', theme === 'dark');
        // Update button icon
        const btn = document.getElementById('theme-toggle');
        btn.textContent = theme === 'dark' ? '☀️' : '🌙';
    }).catch(() => {
        window.location.reload();
    });
}<\/script>
    
    <script>const API_KEYS_ENDPOINT = '/api-keys/tokens';

function apiKeysPanel() {
    return document.getElementById('api-keys-panel');
}

function apiKeysFormatDate(value) {
    if (!value) return '—';
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? value : date.toLocaleString();
}

function apiKeysRequest(url, options = {}) {
    if (typeof fetchWithCSRF === 'function') return fetchWithCSRF(url, options);
    return fetch(url, { ...options, credentials: 'same-origin' });
}

async function apiKeysLoad() {
    const body = document.getElementById('api-keys-body');
    const panel = apiKeysPanel();
    if (!body || !panel) return;

    const response = await apiKeysRequest(API_KEYS_ENDPOINT);
    if (!response.ok) return;
    const data = await response.json();
    body.replaceChildren();

    (data.tokens || []).forEach((token) => {
        const row = document.createElement('tr');
        const nameCell = document.createElement('td');
        const prefixCell = document.createElement('td');
        const prefix = document.createElement('code');
        const createdCell = document.createElement('td');
        const usedCell = document.createElement('td');
        const actionCell = document.createElement('td');

        nameCell.textContent = token.name;
        prefix.textContent = `${token.token_prefix}…`;
        prefixCell.appendChild(prefix);
        createdCell.textContent = apiKeysFormatDate(token.created_at);
        usedCell.textContent = token.revoked_at ? '—' : apiKeysFormatDate(token.last_used_at);

        if (token.revoked_at) {
            row.classList.add('revoked');
        } else {
            const revoke = document.createElement('button');
            revoke.className = 'api-keys-revoke';
            revoke.textContent = panel.dataset.revokeLabel;
            revoke.addEventListener('click', async () => {
                if (!window.confirm(panel.dataset.revokeConfirm)) return;
                const revokeResponse = await apiKeysRequest(`${API_KEYS_ENDPOINT}/${token.id}/revoke`, {
                    method: 'POST',
                });
                if (revokeResponse.ok) apiKeysLoad();
            });
            actionCell.appendChild(revoke);
        }

        row.append(nameCell, prefixCell, createdCell, usedCell, actionCell);
        body.appendChild(row);
    });
}

async function apiKeysCreate() {
    const input = document.getElementById('api-key-name');
    const response = await apiKeysRequest(API_KEYS_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: input ? input.value.trim() : '' }),
    });
    if (!response.ok) return;

    const data = await response.json();
    const box = document.getElementById('api-key-once');
    const plaintext = document.getElementById('api-key-plaintext');
    if (box && plaintext) {
        plaintext.textContent = data.token;
        box.hidden = false;
    }
    if (input) input.value = '';
    apiKeysLoad();
}

async function apiKeysCopy() {
    const plaintext = document.getElementById('api-key-plaintext');
    if (!plaintext) return;
    try {
        await navigator.clipboard.writeText(plaintext.textContent);
    } catch {
        const range = document.createRange();
        range.selectNodeContents(plaintext);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const button = document.getElementById('api-keys-btn');
    const panel = apiKeysPanel();
    if (!button || !panel) return;

    button.addEventListener('click', () => {
        panel.hidden = !panel.hidden;
        if (!panel.hidden) apiKeysLoad();
    });
    document.getElementById('api-keys-close')?.addEventListener('click', () => {
        panel.hidden = true;
    });
    document.getElementById('api-key-create')?.addEventListener('click', apiKeysCreate);
    document.getElementById('api-key-copy')?.addEventListener('click', apiKeysCopy);
});
<\/script>
    <script>(function () {
    'use strict';

    const ENDPOINT = '/api-keys/tavily';

    function el(id) { return document.getElementById(id); }

    function request(url, options) {
        if (typeof fetchWithCSRF === 'function') return fetchWithCSRF(url, options);
        return fetch(url, { credentials: 'same-origin', ...options });
    }

    function setStatus(text) {
        const status = el('tavily-status');
        if (!status) return;
        status.textContent = text || '';
        status.hidden = !text;
        status.className = 'tavily-status' + (text ? ' is-visible' : '');
    }

    // Chat-style live status while the GET /api-keys/tavily round-trip is in
    // flight («Updating information (N s)…»): pulsing + elapsed seconds.
    // Without it the panel first showed the add-key form, then re-rendered to
    // the saved-key branch a few seconds later (a visible flicker).
    let refreshTimer = null;
    let refreshStartedAt = null;

    function stopRefreshStatus() {
        if (refreshTimer) {
            clearInterval(refreshTimer);
            refreshTimer = null;
        }
        refreshStartedAt = null;
        const status = el('tavily-status');
        if (status) status.classList.remove('tavily-status-live');
    }

    function startRefreshStatus() {
        stopRefreshStatus();
        const status = el('tavily-status');
        const section = el('tavily-section');
        if (!status || !section) return;
        refreshStartedAt = Date.now();
        const base = '🔄 ' + (section.dataset.refreshingLabel || 'Refreshing…');
        const suffix = section.dataset.elapsedSuffix || 's';
        const paint = () => {
            const secs = Math.floor((Date.now() - refreshStartedAt) / 1000);
            status.textContent = secs >= 1 ? base + ' (' + secs + suffix + ')…' : base + '…';
        };
        paint();
        status.hidden = false;
        status.className = 'tavily-status is-visible tavily-status-live';
        refreshTimer = setInterval(() => {
            if (status.hidden || document.body.contains(status) === false) {
                stopRefreshStatus();
                return;
            }
            paint();
        }, 1000);
    }

    function showLoadingState() {
        // Hide BOTH branches until the server answers.
        const input = el('tavily-key-input');
        const addRow = el('tavily-create');
        const savedRow = el('tavily-key-saved');
        const quota = el('tavily-quota');
        if (addRow) addRow.hidden = true;
        if (savedRow) savedRow.hidden = true;
        if (quota) quota.hidden = true;
        if (input) input.value = '';
        startRefreshStatus();
    }

    function formatQuota(template, usage) {
        return template
            .replace('{limit}', usage.limit ?? '\u2014')
            .replace('{used}', usage.used ?? '\u2014')
            .replace('{remaining}', usage.remaining ?? '\u2014');
    }

    function render(data) {
        stopRefreshStatus();
        const input = el('tavily-key-input');
        const addRow = el('tavily-create');
        const savedRow = el('tavily-key-saved');
        const masked = el('tavily-key-masked');
        const quota = el('tavily-quota');
        if (!input || !addRow || !savedRow || !masked || !quota) return;

        if (data.has_key) {
            addRow.hidden = true;
            input.hidden = false; // re-show for the next no-key render
            savedRow.hidden = false;
            masked.textContent = data.masked_key || '';
            quota.textContent = formatQuota(el('tavily-section').dataset.quotaTemplate || '', data);
            quota.hidden = false;
            if (data.status === 'exhausted') setStatus(el('tavily-section').dataset.exhaustedLabel);
            else if (data.status === 'invalid') setStatus(el('tavily-section').dataset.invalidLabel);
            else if (data.status === 'unavailable') setStatus(el('tavily-section').dataset.unavailableLabel);
            else setStatus('');
        } else {
            input.hidden = false;
            input.value = '';
            addRow.hidden = false;
            savedRow.hidden = true;
            quota.hidden = true;
            setStatus('');
        }
    }

    async function load() {
        showLoadingState();
        const response = await request(ENDPOINT);
        if (!response.ok) {
            stopRefreshStatus();
            setStatus(el('tavily-section') ? el('tavily-section').dataset.unavailableLabel : '');
            // Fall back to the no-key form so the section stays usable.
            render({ has_key: false });
            return;
        }
        render(await response.json());
    }

    async function save(value) {
        const response = await request(ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ api_key: value }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
            setStatus(data.error || '');
            return;
        }
        render(data);
    }

    async function remove() {
        const delBtn = el('tavily-key-del-btn');
        if (delBtn) delBtn.disabled = true;
        try {
            const response = await request(ENDPOINT, { method: 'DELETE' });
            if (!response.ok) return;
            render(await response.json());
        } finally {
            if (delBtn) delBtn.disabled = false;
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const panel = el('api-keys-panel');
        const trigger = el('api-keys-btn');
        const input = el('tavily-key-input');
        const addBtn = el('tavily-key-add-btn');
        const delBtn = el('tavily-key-del-btn');
        if (!panel || !trigger || !input || !addBtn || !delBtn) return;

        addBtn.addEventListener('click', () => {
            if (input.value.trim()) save(input.value.trim());
        });
        input.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && input.value.trim()) {
                event.preventDefault();
                save(input.value.trim());
            }
        });
        delBtn.addEventListener('click', remove);

        trigger.addEventListener('click', () => {
            if (!panel.hidden) load();
        });

        // Cleanup when the panel closes (toggle handler hides it).
        new MutationObserver(() => {
            if (panel.hidden) stopRefreshStatus();
        }).observe(panel, { attributes: true, attributeFilter: ['hidden'] });
    });
})();<\/script>

    <script>// static/js/guest-theme.js
// Handles theme switching for unauthenticated users using localStorage
// Also auto-detects system theme on first visit

function applyTheme(theme) {
    if (theme === 'dark') {
        document.body.classList.add('dark-theme');
        document.getElementById('theme-toggle-guest').textContent = '☀️';
    } else {
        document.body.classList.remove('dark-theme');
        document.getElementById('theme-toggle-guest').textContent = '🌙';
    }
    // Save to localStorage (always update)
    localStorage.setItem('guest_theme', theme);
    // Optionally inform server to store in session (for consistency after login)
    fetch('/set-theme/' + theme, {
        method: 'POST',
        headers: { 'Cache-Control': 'no-cache', 'X-CSRFToken': getCSRFToken() }
    }).catch(() => {});
}

document.addEventListener('DOMContentLoaded', function() {
    const guestThemeBtn = document.getElementById('theme-toggle-guest');
    if (!guestThemeBtn) return;

    // Determine theme: from localStorage or system preference
    let savedTheme = localStorage.getItem('guest_theme');
    if (!savedTheme) {
        // Auto-detect system color scheme
        savedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        localStorage.setItem('guest_theme', savedTheme);
    }
    applyTheme(savedTheme);

    guestThemeBtn.addEventListener('click', function() {
        const isDark = document.body.classList.contains('dark-theme');
        const newTheme = isDark ? 'light' : 'dark';
        applyTheme(newTheme);
    });
});<\/script>

    <script>// app/static/js/footer-about.js
// "About" dialog opened from the footer brand label.
(function () {
    'use strict';

    var modal = document.getElementById('footer-about-modal');
    var btn = document.getElementById('footer-about-btn');
    if (!modal || !btn) return;

    var previouslyFocused = null;

    function openModal() {
        previouslyFocused = document.activeElement;
        modal.hidden = false;
        var closeBtn = modal.querySelector('.about-modal-close');
        if (closeBtn) closeBtn.focus();
        document.addEventListener('keydown', onKeydown);
    }

    function closeModal() {
        modal.hidden = true;
        document.removeEventListener('keydown', onKeydown);
        if (previouslyFocused && typeof previouslyFocused.focus === 'function') {
            previouslyFocused.focus();
        }
    }

    function onKeydown(e) {
        if (e.key === 'Escape') closeModal();
    }

    btn.addEventListener('click', openModal);
    modal.querySelectorAll('[data-close-about]').forEach(function (el) {
        el.addEventListener('click', closeModal);
    });
})();
<\/script>

<script>
/*
 * Shell of the FLAI interface demo: it loads the login screen into the iframe,
 * swaps it for the interface on login and switches between desktop and phone.
 */
(function () {
  "use strict";

  var frame = document.getElementById("demo-screen");
  var loginSource = document.getElementById("demo-login");
  var appSource = document.getElementById("demo-app");
  var body = document.body;

  function decode(text) {
    return text.replace(/<\\\/script/g, "</script").replace(/<\\!--/g, "<!--");
  }

  function setDevice(name) {
    body.classList.toggle("demo-mobile", name === "mobile");
    body.classList.toggle("demo-desktop", name !== "mobile");
    try {
      window.localStorage.setItem("demo_device", name);
    } catch (e) {
      /* storage is optional */
    }
  }

  Array.prototype.forEach.call(document.querySelectorAll("[data-device]"), function (button) {
    button.addEventListener("click", function () {
      setDevice(button.getAttribute("data-device"));
    });
  });

  var saved = "desktop";
  try {
    saved = window.localStorage.getItem("demo_device") || "desktop";
  } catch (e) {
    /* storage is optional */
  }
  setDevice(saved);

  frame.srcdoc = decode(loginSource.textContent);

  function savedTheme() {
    var match = /(?:^|[#&])theme=(dark|light)/.exec(window.location.hash);
    if (match) return match[1];
    try {
      return window.localStorage.getItem("demo_theme") || "";
    } catch (e) {
      return "";
    }
  }

  function rememberTheme(theme) {
    try {
      window.localStorage.setItem("demo_theme", theme);
    } catch (e) {
      /* storage is optional */
    }
    try {
      window.history.replaceState(null, "", "#theme=" + theme);
    } catch (e) {
      window.location.hash = "theme=" + theme;
    }
  }

  function pushTheme() {
    var theme = savedTheme();
    if (!theme || !frame.contentWindow) return;
    frame.contentWindow.postMessage({ type: "demo-theme", theme: theme }, "*");
  }

  frame.addEventListener("load", pushTheme);

  window.addEventListener("message", function (event) {
    var data = event.data || {};
    if (data.type === "demo-login") {
      frame.srcdoc = decode(appSource.textContent);
    } else if (data.type === "demo-theme-set" && data.theme) {
      rememberTheme(data.theme);
    }
  });
})();

</script>
