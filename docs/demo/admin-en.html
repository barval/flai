        const totalParams = info.parameter_count;
        const totalFromName = (info.parameters || '').match(/(\d+\.?\d*)\s*B/);
        const totalStr = totalParams
            ? (totalParams >= 1e11 ? `${(totalParams / 1e9).toFixed(0)}B` : `${(totalParams / 1e9).toFixed(1)}B`)
            : (totalFromName ? totalFromName[1] + 'B' : null);
        if (activeMatch && totalStr) {
            archLabel += ` ${activeMatch[0]}/${totalStr}`;
        } else if (activeMatch) {
            archLabel += ` ${activeMatch[0]}`;
        }
        archLabel += ')';
    }
    detailsHtml = `<p><strong>${t('Architecture:')}</strong> ${archLabel}</p>
        <p><strong>${t('Parameters:')}</strong> ${info.parameters || 'N/A'}</p>
        <p><strong>${t('Quantization:')}</strong> ${info.quantization || 'N/A'}</p>`;

    if (info.supports_mtp) {
        detailsHtml += `<p><strong>${t('MTP support:')}</strong> ${t('yes')}</p>`;
    } else {
        detailsHtml += `<p><strong>${t('MTP support:')}</strong> ${t('no')}</p>`;
    }

    if (info.context_length && info.context_length !== 'N/A') {
        detailsHtml += `<p><strong>${t('Max context length:')}</strong> ${info.context_length}</p>`;
    }

    if (module === 'embedding' && info.embedding_length && info.embedding_length !== 'N/A') {
        detailsHtml += `<p><strong>${t('Embedding length:')}</strong> ${info.embedding_length}</p>`;
    }

    if (info.file_size_mb) {
        const sizeMB = Math.round(info.file_size_mb);
        detailsHtml += `<p><strong>${t('File size:')}</strong> ${sizeMB} ${t('MB')}</p>`;
    }

    if (info.model_type) {
        detailsHtml += `<p><strong>${t('Type:')}</strong> ${info.model_type}</p>`;
    }

    detailsGrid.innerHTML = detailsHtml;

    const ctxInput = document.querySelector(`.context-length[data-module="${module}"]`);
    const contextLength = ctxInput ? ctxInput.value : '';
    if (module !== 'reranker') {
        // The reranker is CPU-only: it has no VRAM tier and no fit verdict.
        await updateMemoryEstimation(module, info, contextLength);
    }

    if (ctxInput && info.context_length && info.context_length !== 'N/A') {
        ctxInput.max = info.context_length;
        ctxInput.placeholder = `max: ${info.context_length}`;
        const hintSpan = document.querySelector(`.ctx-hint-${module}`);
        if (hintSpan) {
            hintSpan.textContent = '< ' + String(parseInt(info.context_length) + 1);
        }
    }
}

const _pendingEstimate = {};

async function updateMemoryEstimation(module, modelInfo, ctxLength) {
    if (module === 'embedding') return;

    const card = document.querySelector(`.model-card[data-module="${module}"]`);
    const modelName = card.querySelector('.model-dropdown')?.value;
    if (!modelName) return;

    if (_pendingEstimate[module]) return;
    _pendingEstimate[module] = true;

    const requestedCtx = parseInt(ctxLength) || 8192;

    // Show blinking placeholder while the estimate is loading
    const saveBtn = card.querySelector('.save-button');
    card.querySelectorAll('.memory-hint, .tier-indicator').forEach(el => el.remove());
    const placeholder = document.createElement('div');
    placeholder.className = 'memory-hint calculating';
    placeholder.style.cssText = 'margin-top: 8px; padding: 8px; border-radius: 4px; font-size: 0.85em; color: #888;';
    placeholder.textContent = t('calculating_vram');
    card.insertBefore(placeholder, saveBtn);

    // Force browser to repaint placeholder before the async fetch blocks main thread
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    try {
        const params = new URLSearchParams({
            model: modelName,
            module: module,
            ctx_size: String(requestedCtx),
        });
        const resp = await fetch(`/admin/api/model-estimate?${params}`, { credentials: 'same-origin' });
        if (!resp.ok) {
            dlog('Model estimate API error', resp.status);
            return;
        }
        const data = await resp.json();
        dlog('Model estimate:', data);

        const hintDiv = document.createElement('div');
        hintDiv.className = 'memory-hint';
        hintDiv.style.cssText = 'margin-top: 8px; padding: 8px; border-radius: 4px; font-size: 0.85em;';

        const hasGPU = data.has_gpu;
        const totalVRAM = data.total_vram_mb || 0;
        const status = data.status;
        const tier = data.tier || 'unknown';
        const canSave = data.can_save !== false;
        const nglRecommended = data.ngl_recommended;
        const tierMessage = data.tier_message;

        if (status === 'actual') {
            hintDiv.style.color = '#29A847';
            hintDiv.style.fontWeight = 'bold';
            hintDiv.textContent = t('vram_optimal_dynamic').replace('%1%', data.vram_percent || 0);
        } else if (status === 'measured' && data.measured_vram_mb) {
            if (hasGPU && totalVRAM > 0) {
                const pct = Math.round(data.measured_vram_mb / totalVRAM * 100);
                let color = '#29A847';
                if (pct > 90) color = '#E01F1F';
                else if (pct > 70) color = '#fd7e14';
                else if (pct > 50) color = '#FFD700';
                hintDiv.style.color = color;
                hintDiv.style.fontWeight = 'bold';
                var msg = t('vram_measured')
                    .replace('%1%', data.measured_vram_mb)
                    .replace('%2%', totalVRAM)
                    .replace('%3%', pct)
                    .replace('%4%', data.measurement_count || 1)
                    .replace('%5%', data.measured_ctx || data.context_length || '?');
                if (data.details) {
                    msg += t('vram_detail')
                        .replace('%1%', data.details.model_vram_mb)
                        .replace('%2%', data.details.kv_cache_mb)
                        .replace('%3%', data.details.compute_mb);
                }
                hintDiv.textContent = msg;
            } else {
                hintDiv.style.color = '#fd7e14';
                hintDiv.textContent = t('vram_nodata');
            }
        } else if (status === 'estimate' || (status === 'measured' && !data.measured_vram_mb)) {
            if (hasGPU && totalVRAM > 0) {
                const vramPct = data.vram_percent || 0;
                const tier = data.tier || 'unknown';
                let color = '#29A847';  // green = good (all layers on GPU)
                if (tier === 'cpu_offload') {
                    color = '#b8860b';  // dark goldenrod — partial CPU offload
                } else if (tier === 'impossible' || tier === 'unknown') {
                    color = '#E01F1F';  // red
                } else if (vramPct > 100) {
                    color = '#E01F1F';  // red — exceeds VRAM even for good tier
                }
                hintDiv.style.color = color;
                hintDiv.style.fontWeight = 'bold';
                var msg = t('vram_estimated')
                    .replace('%1%', data.vram_mb)
                    .replace('%2%', totalVRAM)
                    .replace('%3%', vramPct);
                if (tier === 'cpu_offload' && data.ngl != null && data.block_count) {
                    msg += ' — ' + t('ngl_offload_hint')
                        .replace('%1%', data.ngl)
                        .replace('%2%', data.block_count);
                }
                if (data.details) {
                    msg += t('vram_detail')
                        .replace('%1%', data.details.model_vram_mb)
                        .replace('%2%', data.details.kv_cache_mb)
                        .replace('%3%', data.details.compute_mb);
                }
                hintDiv.textContent = msg;
            } else if (hasGPU && totalVRAM === 0) {
                hintDiv.style.color = '#1CC8E3';
                hintDiv.style.fontWeight = 'bold';
                const msg = t('ngl_info').replace('%1%', data.ngl || '?').replace('%2%', data.block_count || '?');
                hintDiv.textContent = msg;
            } else {
                const ramPct = data.ram_percent || 0;
                if (ramPct < 50) {
                    hintDiv.style.color = '#fd7e14';
                    hintDiv.style.fontWeight = 'bold';
                    hintDiv.textContent = t('no_gpu_low').replace('%1%', ramPct);
                } else {
                    hintDiv.style.color = '#E01F1F';
                    hintDiv.style.fontWeight = 'bold';
                    hintDiv.textContent = t('no_gpu_full').replace('%1%', ramPct);
                }
            }
        } else {
            hintDiv.style.color = '#fd7e14';
            hintDiv.style.fontWeight = 'bold';
            if (hasGPU) {
                hintDiv.textContent = t('vram_nodata_gpu').replace('%1%', totalVRAM);
            } else {
                hintDiv.textContent = t('vram_nodata');
            }
        }

        // Render 3-tier indicator + lock save button on impossible/unknown
        if (tierMessage) {
            const tierDiv = document.createElement('div');
            tierDiv.className = `tier-indicator tier-${tier}`;
            tierDiv.style.cssText = 'margin-top: 6px; padding: 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold;';
            if (tier === 'good') {
                tierDiv.style.color = '#29A847';
                tierDiv.style.background = 'rgba(41, 168, 71, 0.1)';
            } else if (tier === 'cpu_offload') {
                tierDiv.style.color = '#b8860b';
                tierDiv.style.background = 'rgba(255, 215, 0, 0.15)';
            } else if (tier === 'impossible') {
                tierDiv.style.color = '#E01F1F';
                tierDiv.style.background = 'rgba(224, 31, 31, 0.12)';
            } else {
                tierDiv.style.color = '#fd7e14';
                tierDiv.style.background = 'rgba(253, 126, 20, 0.12)';
            }
            tierDiv.textContent = tierMessage;
            hintDiv.insertAdjacentElement('afterend', tierDiv);
        }

        // Toggle Save button: disable on impossible / unknown (no metadata)
        if (saveBtn) {
            if (canSave) {
                saveBtn.disabled = false;
                saveBtn.removeAttribute('title');
            } else {
                saveBtn.disabled = true;
                saveBtn.setAttribute('title', tierMessage || t('model_cannot_be_saved'));
            }
        }

        // For yellow tier, suggest ngl_recommended if it's lower than current
        if (tier === 'cpu_offload' && nglRecommended != null) {
            const nglInput = card.querySelector('.n-gpu-layers');
            if (nglInput) {
                nglInput.placeholder = '~' + nglRecommended;
            }
        }

        card.querySelectorAll('.memory-hint, .tier-indicator').forEach(el => el.remove());
        card.insertBefore(hintDiv, saveBtn);

    } catch (err) {
        console.error('Error updating memory estimation:', err);
    } finally {
        _pendingEstimate[module] = false;
    }
}

function validateModelConfig(module, card) {
    const modelName = card.querySelector('.model-dropdown').value;
    if (!modelName) {
        alert(t('Please select a model first.'));
        return false;
    }

    if (module === 'embedding' || module === 'reranker') return true;

    // Multimodal module requires a vision model — block plain chat models.
    if (module === 'multimodal') {
        const serviceUrl = typeof LLAMA_SWAP_URL !== 'undefined' ? LLAMA_SWAP_URL : 'http://flai-llamaswap:8080';
        const info = modelDetails[`${serviceUrl}:${modelName}`] || modelDetails[modelName];
        if (info && info.model_type === 'text') {
            alert(t('multimodal_model_must_be_vision'));
            return false;
        }
    }

    // Block save if the tier indicator marked the model as impossible/unknown
    const saveBtn = card.querySelector('.save-button');
    if (saveBtn && saveBtn.disabled) {
        alert(saveBtn.getAttribute('title') || t('model_cannot_be_saved'));
        return false;
    }

    const contextLength = card.querySelector('.context-length')?.value;
    const temperature = card.querySelector('.temperature')?.value;
    const topP = card.querySelector('.top-p')?.value;
    const timeout = card.querySelector('.timeout')?.value;

    const serviceUrl = typeof LLAMA_SWAP_URL !== 'undefined' ? LLAMA_SWAP_URL : 'http://flai-llamaswap:8080';
    const info = modelDetails[`${serviceUrl}:${modelName}`];
    const maxContext = info && info.context_length && info.context_length !== 'N/A' ? parseInt(info.context_length) : null;

    if (contextLength !== undefined && contextLength !== '') {
        const val = parseInt(contextLength);
        if (isNaN(val) || val < 512) {
            alert(t('Context length must be at least 512.'));
            return false;
        }
        if (maxContext && val > maxContext) {
            alert(t('Context length cannot exceed {max} (max for this model).').replace('{max}', maxContext));
            return false;
        }
    }

    if (temperature !== undefined && temperature !== '') {
        const val = parseFloat(temperature);
        if (isNaN(val) || val < 0.0 || val > 2.0) {
            alert(t('Temperature must be between 0.0 and 2.0.'));
            return false;
        }
    }

    if (topP !== undefined && topP !== '') {
        const val = parseFloat(topP);
        if (isNaN(val) || val < 0.0 || val > 1.0) {
            alert(t('Top P must be between 0.0 and 1.0.'));
            return false;
        }
    }

    if (timeout !== undefined && timeout !== '') {
        const val = parseInt(timeout);
        if (isNaN(val) || val < 0 || val > 1200) {
            alert(t('Timeout must be between 0 and 1200 seconds.'));
            return false;
        }
    }

    const repeatPenalty = card.querySelector('.repeat-penalty')?.value;
    if (repeatPenalty !== undefined && repeatPenalty !== '') {
        const val = parseFloat(repeatPenalty);
        if (isNaN(val) || val < 1.0 || val > 2.0) {
            alert(t('Repeat penalty must be between 1.0 and 2.0.'));
            return false;
        }
    }

    return true;
}

function onSaveConfig(event) {
    const btn = event.target;
    const module = btn.dataset.module;
    const card = document.querySelector(`.model-card[data-module="${module}"]`);

    if (!validateModelConfig(module, card)) return;

    const modelName = card.querySelector('.model-dropdown').value;
    const serviceUrl = card.querySelector('.service-url').value.trim();
    const contextLength = card.querySelector('.context-length')?.value;
    const temperature = card.querySelector('.temperature')?.value;
    const topP = card.querySelector('.top-p')?.value;
    const timeout = card.querySelector('.timeout')?.value;

    const repeatPenalty = card.querySelector('.repeat-penalty')?.value;

    const data = {
        model_name: modelName,
        service_url: serviceUrl,
        context_length: contextLength ? parseInt(contextLength) : null,
        temperature: temperature ? parseFloat(temperature) : null,
        top_p: topP ? parseFloat(topP) : null,
        timeout: timeout ? parseInt(timeout) : null,
        repeat_penalty: repeatPenalty ? parseFloat(repeatPenalty) : (module === 'reasoning' ? 1.15 : 1.1),
    };

    if (module === 'reranker') {
        // The cross-encoder window is fixed; the sampling knobs are meaningless
        // for a reranker and must not overwrite anything.
        data.context_length = 2048;
        delete data.temperature;
        delete data.top_p;
        delete data.repeat_penalty;
    }

    fetchWithCSRF(`/admin/api/model_configs/${module}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(result => {
        if (result.status === 'ok') {
            btn.textContent = '✓ ' + t('Saved');
            setTimeout(() => { btn.textContent = t('Save'); }, 2000);

            if (!currentModelConfigs[module]) currentModelConfigs[module] = {};
            Object.assign(currentModelConfigs[module], data);

            if (module === 'reasoning' && result.max_top_k) {
                updateChunksLimits(result.max_top_k);
            }

            if (module === 'embedding') {
                window.CURRENT_EMBEDDING_MODEL = result.model_name;
                if (result.reindex_triggered) {
                    alert(t('reindex_started'));
                }
            }

            if (module === 'reranker') {
                // The switches live in the same card: one button saves both the
                // model row and the three reranker settings.
                const settings = {
                    RAG_RERANK_ENABLED: card.querySelector('.rerank-enabled').checked,
                    RAG_RERANK_CANDIDATES: parseInt(card.querySelector('.rerank-candidates').value) || 10,
                    RAG_RERANK_TIMEOUT: parseInt(card.querySelector('.rerank-timeout').value) || 10,
                };
                fetchWithCSRF('/admin/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ values: settings })
                })
                .then(res => res.json())
                .then(saveResult => {
                    if (saveResult.status !== 'ok') {
                        alert(t('error') + ': ' + (saveResult.error || t('unknown_error')));
                        return;
                    }
                    window.RAG_RERANK_SETTINGS = {
                        enabled: settings.RAG_RERANK_ENABLED,
                        candidates: settings.RAG_RERANK_CANDIDATES,
                        timeout: settings.RAG_RERANK_TIMEOUT,
                    };
                })
                .catch(err => alert(t('error') + ': ' + err.message));
            }
        } else {
            alert(t('error') + ': ' + (result.error || t('unknown_error')));
        }
    })
    .catch(err => {
        console.error('Error saving config:', err);
        alert(t('error') + ': ' + err.message);
    });
}

function updateChunksLimits(maxTopK) {
    const ragTopKInput = document.getElementById('rag-top-k');
    const ragTopKInputContainer = ragTopKInput ? ragTopKInput.parentElement : null;
    if (ragTopKInput) {
        ragTopKInput.max = maxTopK;
    }
    if (ragTopKInputContainer) {
        const hintSmall = ragTopKInputContainer.querySelector('small');
        if (hintSmall) {
            hintSmall.textContent = '< ' + maxTopK;
        }
    }
}

function initChunksSection() {
    const saveChunksBtn = document.getElementById('save-chunks-btn');
    if (!saveChunksBtn) return;

    saveChunksBtn.addEventListener('click', async function() {
        const chunkSize = parseInt(document.getElementById('chunk-size').value) || 500;
        const chunkOverlap = parseInt(document.getElementById('chunk-overlap').value) || 50;
        const chunkStrategy = document.getElementById('chunk-strategy').value || 'fixed';
        const ragTopK = parseInt(document.getElementById('rag-top-k').value) || 20;
        const thresholdDefault = parseFloat(document.getElementById('rag-threshold-default').value) || 0.3;
        const thresholdReasoning = parseFloat(document.getElementById('rag-threshold-reasoning').value) || 0.3;

        const statusEl = document.getElementById('chunks-status');
        statusEl.textContent = '⏳';

        try {
            const response = await fetchWithCSRF('/admin/api/admin/chunks', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chunk_size: chunkSize,
                    chunk_overlap: chunkOverlap,
                    chunk_strategy: chunkStrategy,
                    rag_top_k: ragTopK,
                    rag_threshold_default: thresholdDefault,
                    rag_threshold_reasoning: thresholdReasoning
                })
            });
            const result = await safeJson(response);
            if (result.ok) {
                if (result.reindex_triggered) {
                    alert(t('chunks_saved'));
                } else {
                    alert(t('chunks_unchanged'));
                }
                if (result.rag_top_k) {
                    document.getElementById('rag-top-k').value = result.rag_top_k;
                }
                statusEl.textContent = '✅';
            } else {
                alert(t('error') + ': ' + (result.error || t('unknown_error')));
                statusEl.textContent = '❌';
            }
        } catch (err) {
            console.error('Save chunks error:', err);
            statusEl.textContent = '❌';
            alert(t('error'));
        }
    });

    const strategySelect = document.getElementById('chunk-strategy');
    if (strategySelect && typeof currentChunkStrategy !== 'undefined') {
        strategySelect.value = currentChunkStrategy;
    }
}

const TYPE_EMOJI = { reasoning: '🧠', multimodal: '🖼️', embedding: '📐', reranker: '🎯' };

function fmtNum(n) {
    return (Number(n) || 0).toLocaleString();
}

function renderInstalledFiles(files) {
    const host = document.getElementById('models-files-list');
    if (!host) return;
    host.innerHTML = '';
    if (!files || !files.length) {
        const empty = document.createElement('div');
        empty.className = 'hub-note';
        empty.textContent = t('hub_no_results');
        host.appendChild(empty);
        return;
    }
    files.forEach((f) => {
        const row = document.createElement('div');
        row.className = 'installed-file';
        const emoji = document.createElement('span');
        emoji.className = 'installed-file-emoji';
        emoji.textContent = TYPE_EMOJI[f.type] || TYPE_EMOJI.reasoning;
        row.appendChild(emoji);
        const name = document.createElement('span');
        name.className = 'installed-file-name';
        name.textContent = f.name;
        row.appendChild(name);
        const details = document.createElement('span');
        details.className = 'installed-file-details';
        const badge = document.createElement('span');
        badge.className = 'installed-file-badge';
        if (f.from_hub) {
            // Short badge: the full sentence does not fit a phone row. It keeps
            // its own column (also when empty) so the sizes line up.
            badge.textContent = t('Model Hub');
            badge.title = t('hub_installed_via_hub');
        }
        details.appendChild(badge);
        const meta = document.createElement('span');
        meta.className = 'installed-file-meta';
        meta.textContent = fmtNum(Math.ceil(Number(f.size_mb) || 0)) + ' ' + t('MB')
            + (f.path ? ' · ' + f.path : '');
        meta.title = meta.textContent;
        details.appendChild(meta);
        row.appendChild(details);
        const del = document.createElement('button');
        del.className = 'hub-del add-user-button';
        del.dataset.filename = f.name;
        del.textContent = '🗑 ' + t('hub_uninstall');
        del.addEventListener('click', () => deleteInstalledFile(f.name, del));
        row.appendChild(del);
        host.appendChild(row);
    });
}

async function loadInstalledFiles() {
    const host = document.getElementById('models-files-list');
    if (!host) return;
    try {
        const resp = await fetch('/admin/api/hub/installed', { credentials: 'same-origin' });
        const data = await safeJson(resp);
        if (data && data.status === 'ok') renderInstalledFiles(data.files || []);
    } catch (err) {
        console.error('Load installed model files error:', err);
    }
}

function refreshModelsAfterHubDownload() {
    modelDetails = {};
    modelListCache = {};
    loadModelConfigs();
    loadInstalledFiles();
}

async function deleteInstalledFile(filename, btn) {
    if (!confirm(t('hub_delete_confirm').replace('{filename}', filename))) return;
    btn.disabled = true;
    try {
        const resp = await fetchWithCSRF('/admin/api/hub/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: filename })
        });
        const data = await safeJson(resp);
        if (data && data.status === 'ok') {
            loadInstalledFiles();
        } else {
            btn.disabled = false;
            alert((data && data.error) || t('error'));
        }
    } catch (err) {
        btn.disabled = false;
        alert(t('error') + ': ' + err.message);
    }
}

document.addEventListener('DOMContentLoaded', function() {
    dlog('DOMContentLoaded, checking models-tab:', document.getElementById('models-tab'));
    initAdminTabs();
    if (document.getElementById('models-tab')) {
        loadModelConfigs();
    }

    const refreshBtn = document.getElementById('refresh-gguf-btn');
    if (refreshBtn) {
        refreshBtn.addEventListener('click', async function() {
            this.disabled = true;
            this.classList.add('btn-syncing');
            this.textContent = '🔄 ' + t('Loading...');
            try {
                const resp = await fetchWithCSRF('/admin/api/refresh-gguf-cache', { method: 'POST' });
                const data = await safeJson(resp);
                if (data.status === 'ok') {
                    modelDetails = {};
                    modelListCache = {};
                    loadModelConfigs();
                    loadInstalledFiles();
                } else {
                    alert(t('error') + ': ' + (data.error || t('unknown_error')));
                }
            } catch (err) {
                console.error('Refresh GGUF cache error:', err);
                alert(t('error') + ': ' + err.message);
            } finally {
                this.disabled = false;
                this.classList.remove('btn-syncing');
                this.textContent = '🔄 ' + t('Update model list');
            }
        });
    }

    initChunksSection();
    loadInstalledFiles();
});

    const CTX_MAX = 262144;
    const typeBoxes = {
        reasoning: document.getElementById('hub-type-reasoning'),
        multimodal: document.getElementById('hub-type-multimodal'),
        embedding: document.getElementById('hub-type-embedding'),
        reranker: document.getElementById('hub-type-reranker')
    };

    const typeToModule = {
        reasoning: 'reasoning', multimodal: 'multimodal', embedding: 'embedding', reranker: 'reranker'
    };
    const ACTIVE_DOWNLOADS_KEY = 'flai.modelHub.activeDownloads';
    let lastData = null;
    let installedList = [];
    let recalcBusy = false;
    let searchTimer = null;
    let recalcTimer = null;
    let searchStart = 0;

    btn.addEventListener('click', doSearch);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
    Object.values(typeBoxes).forEach(cb => cb.addEventListener('change', () => {
        if (lastData) renderResults(lastData, true);
    }));
    ctxSlider.addEventListener('input', () => {
        ctxValue.value = ctxSlider.value;
        refreshFits();
    });
    ctxValue.addEventListener('input', () => {
        const digits = ctxValue.value.replace(/\D+/g, '');
        ctxValue.value = digits;
        const n = parseInt(digits, 10);
        if (n) ctxSlider.value = Math.max(CTX_MIN, Math.min(n, CTX_MAX));
    });
    ctxValue.addEventListener('change', () => {
        const n = parseInt(ctxValue.value.replace(/\D+/g, ''), 10);
        if (!n) { ctxValue.value = ctxSlider.value; return; }
        const ctx = Math.max(CTX_MIN, Math.min(n, CTX_MAX));
        ctxSlider.value = ctx;
        ctxValue.value = String(ctx);
        refreshFits();
    });
    resumeActiveDownloads();

    function esc(s) {
        return String(s).replace(/[&<>"']/g,
            c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function fmtNum(n) {
        return (Number(n) || 0).toLocaleString();
    }

    function note(text) { return `<div class="hub-note">${esc(text)}</div>`; }

    function selectedTypes() {
        return Object.keys(typeBoxes).filter(t => typeBoxes[t].checked);
    }

    function currentContext() {
        return parseInt(ctxSlider.value, 10) || 8192;
    }

    function showStatus(el, on) { el.style.display = on ? 'block' : 'none'; }

    async function doSearch() {
        const q = input.value.trim();
        if (!q) { results.innerHTML = note(t('hub_no_query')); return; }
        btn.disabled = true;
        lastData = null;
        showStatus(recalcStatus, false);
        stopSearchTimer();
        showStatus(scanStatus, true);
        searchStart = Date.now();
        scanStatus.textContent = `🔍 ${esc(t('hub_searching_models'))} 0 ${esc(t('hub_seconds'))}`;
        searchTimer = setInterval(() => {
            const s = Math.floor((Date.now() - searchStart) / 1000);
            scanStatus.textContent = `🔍 ${esc(t('hub_searching_models'))} ${s} ${esc(t('hub_seconds'))}`;
        }, 1000);
        results.innerHTML = '';
        try {
            const res = await fetchWithCSRF(`/admin/api/hub/search?q=${encodeURIComponent(q)}&context=${currentContext()}`);
            const data = await res.json();
            if (data && data.items) { lastData = data; installedList = (data.installed || []); }
            renderResults(data);
        } catch (err) {
            results.innerHTML = note(t('hub_error'));
        } finally {
            showStatus(scanStatus, false);
            stopSearchTimer();
            btn.disabled = false;
            btn.textContent = t('hub_search');
        }
    }

    function stopSearchTimer() {
        if (searchTimer) { clearInterval(searchTimer); searchTimer = null; }
    }

    function _stopRecalcTimer() {
        if (recalcTimer) { clearInterval(recalcTimer); recalcTimer = null; }
    }

    function renderResults(data, keepFits) {
        let items = (data && data.items) || [];
        const hasFits = !!(data && data.fits_computed);
        const types = selectedTypes();
        if (types.length) items = items.filter(it => types.includes(it.type));
        if (!items.length) { results.innerHTML = note(t('hub_no_results')); return; }
        const sliderCtx = currentContext();
        let html = '';
        for (const it of items) {
            const badges = [];
            if (it.gated) badges.push(`<span class="hub-badge hub-badge-gated">${esc(t('hub_gated'))}</span>`);
            const nc = /(nc|non-commercial|noncommercial|cc-by-nc|personal)/i.test(it.license || '');
            if (nc) badges.push(`<span class="hub-badge hub-badge-nc" title="${esc(it.license)}">${esc(t('hub_nc'))}</span>`);
            const typeIc = it.type === 'multimodal' ? '🖼️' : it.type === 'embedding' ? '📐' : '🧠';
            const fileList = (it.files || []).slice().sort((a, b) => (a.size_mb || 0) - (b.size_mb || 0));
            html += `<div class="hub-repo">
                <div class="hub-repo-head">
                    <span class="hub-repo-name">${esc(it.repo)} ${typeIc}</span> ${badges.join(' ')}
                    ${it.arch_max_ctx ? `<span class="hub-repo-meta">${esc(t('hub_max_ctx'))}: ${fmtNum(it.arch_max_ctx)}</span>` : ''}
                    <span class="hub-repo-meta">⬇ ${fmtNum(it.downloads)} ⭐ ${fmtNum(it.likes)}</span>
                </div>
                <table class="hub-files"><tbody>`;
            for (const f of fileList) {
                if (it.arch_max_ctx && it.arch_max_ctx < sliderCtx) continue;
                const repo = esc(it.repo), file = esc(f.path);
                const fileName = f.path.split('/').pop();
                const isInstalled = installedList.includes(fileName);
                const companionOptions = (f.companion_choices || []).flatMap(group => group.options || []);
                const companionChoiceHtml = companionOptions.length
                    ? `<div class="hub-companion-choice">${companionOptions.map(option => `
                        <label><input type="radio" name="hub-draft-${esc(it.repo)}-${esc(f.path)}" value="${esc(option.path)}" data-companion-choice data-size-mb="${Number(option.size_mb) || 0}" ${option.default ? 'checked' : ''} ${isInstalled ? 'disabled' : ''}> ${esc(option.path.split('/').pop())} (${fmtNum(Math.ceil(option.size_mb))} ${t('MB')})</label>`).join('')}</div>`
                    : '';
                const action = it.gated
                    ? `<td><span class="hub-badge hub-badge-gated">${esc(t('hub_gated'))}</span></td>`
                    : isInstalled
                        ? `<td><span class="hub-installed">✓ ${esc(t('hub_installed'))}</span> <button class="hub-del add-user-button" data-filename="${esc(fileName)}">🗑 ${esc(t('hub_uninstall'))}</button></td>`
                        : `<td><button class="hub-dl add-user-button" data-repo="${repo}" data-file="${file}" data-module="${typeToModule[it.type]}">${esc(t('hub_download'))}</button></td>`;
                const fitAttr = f.fit ? ` title="${esc(f.fit.message || '')}"` : '';
                html += `<tr class="hub-file-row" data-repo="${repo}" data-file="${file}" data-module="${typeToModule[it.type]}" data-gated="${it.gated ? '1' : '0'}" data-max-ctx="${(f.fit && f.fit.arch_max_ctx) || ''}" data-companion-required-mb="${Number(f.companion_required_mb) || 0}">
                    <td class="hub-size">${fmtNum(Math.ceil(f.size_mb || 0))} ${t('MB')}</td>
                    <td class="hub-path">${esc(f.path)}${f.companion_mb > 0
                        ? `<div class="hub-aux-note">${esc(t('hub_service_files').replace('{n}', fmtNum(Math.ceil(f.companion_mb))))}</div>`
                        : companionOptions.length ? `<div class="hub-aux-note">${esc(t('hub_service_files').replace('{n}', fmtNum(Math.ceil(f.companion_mb))))}</div>` : ''}${companionChoiceHtml}</td>
                    <td class="hub-fit ${f.fit ? fitTierClass(f.fit) : 'hub-fit-pending'}"${fitAttr}>${f.fit ? esc(fitTierLabel(f.fit)) : '…'}</td>
                    ${action}
                </tr>`;
            }
            html += '</tbody></table></div>';
        }
        results.innerHTML = html;
        wireDownloadButtons();
        if (!keepFits) {
            if (!hasFits) recalcFits('hub_calculating');
        }
    }

    function recalcFits(messageKey) {
        if (recalcBusy) return;
        if (!results.querySelector('.hub-file-row')) return;
        recalcBusy = true;
        showStatus(recalcStatus, true);
        const baseText = esc(t(messageKey));
        recalcStatus.textContent = `🧮 ${baseText}`;
        const startedAt = Date.now();
        const suffix = esc(t('hub_seconds'));
        _stopRecalcTimer();
        recalcTimer = setInterval(() => {
            const secs = Math.floor((Date.now() - startedAt) / 1000);
            if (secs >= 1) recalcStatus.textContent = `🧮 ${baseText} (${secs}${suffix})`;
        }, 1000);
        collectFits(() => {
            _stopRecalcTimer();
            recalcBusy = false;
            showStatus(recalcStatus, false);
        });
    }

    function refreshFits() {
        if (!results.querySelector('.hub-file-row')) return;
        // Reapply the context threshold to already-rendered rows before
        // recomputing the colored fit statuses with the new context.
        const sliderCtx = currentContext();
        results.querySelectorAll('.hub-file-row').forEach((row) => {
            const maxCtx = parseInt(row.dataset.maxCtx || '0', 10);
            row.style.display = (maxCtx > 0 && maxCtx < sliderCtx) ? 'none' : '';
        });
        recalcFits('hub_recalculating');
    }

    function collectFits(done) {
        const rows = document.querySelectorAll('.hub-file-row');
        if (!rows.length) { if (done) done(); return; }
        // One /fit-all request per repo instead of one /fit per file: with a
        // single-process server a 50-repo list used to queue hundreds of
        // sequential requests and keep "Computing fit…" alive for minutes.
        const groups = {};
        rows.forEach((row) => {
            const repo = row.dataset.repo;
            (groups[repo] = groups[repo] || []).push(row);
        });
        let pending = Object.keys(groups).length;
        const finish = () => { if (--pending === 0 && done) done(); };
        Object.entries(groups).forEach(([repo, group]) => {
            const module = group[0].dataset.module || 'multimodal';
            group.forEach((row) => {
                const fitCell = row.querySelector('.hub-fit');
                fitCell.className = 'hub-fit hub-fit-pending';
                fitCell.textContent = '…';
            });
            const context = currentContext();
            fetchWithCSRF(`/admin/api/hub/fit-all?repo=${encodeURIComponent(repo)}&module=${module}&context=${context}`)
                .then(r => r.json().catch(() => null))
                .then((data) => {
                    const byFile = (data && data.status === 'ok' && data.fits) || {};
                    group.forEach((row) => {
                        const fitCell = row.querySelector('.hub-fit');
                        const fit = byFile[row.dataset.file];
                        if (!fit || fit.error) {
                            fitCell.textContent = '✗';
                            fitCell.title = fit && fit.error ? fit.error : t('hub_error');
                            fitCell.classList.remove('hub-fit-pending');
                            fitCell.classList.add('hub-fit-impossible');
                            return;
                        }
                        if (fit.arch_max_ctx) row.dataset.maxCtx = fit.arch_max_ctx;
                        renderFit(fitCell, fit);
                    });
                })
                .catch(() => {
                    group.forEach((row) => { row.querySelector('.hub-fit').textContent = '…'; });
                })
                .finally(finish);
        });
    }

function fitTierClass(fit) {
        if (fit.error) return 'hub-fit-impossible';
        const isCpu = fit.platform === 'cpu';
        if (isCpu) return fit.tier === 'cpu_offload' ? 'hub-fit-cpu' : 'hub-fit-impossible';
        if (fit.tier === 'good') return 'hub-fit-good';
        if (fit.tier === 'cpu_offload') return 'hub-fit-offload';
        if (fit.tier === 'impossible') return 'hub-fit-impossible';
        return 'hub-fit-pending';
    }

    function fitTierLabel(fit) {
        if (fit.error) return '✗';
        const isCpu = fit.platform === 'cpu';
        if (fit.tier === 'good' && !isCpu) return t('hub_fit_gpu');
        if (fit.tier === 'cpu_offload') return isCpu ? t('hub_fit_cpu') : t('hub_fit_gpu_cpu');
        if (fit.tier === 'impossible') return t('hub_fit_impossible');
        return '…';
    }

    function renderFit(cell, fit) {
        cell.className = 'hub-fit ' + fitTierClass(fit);
        cell.title = fit.message || '';
        cell.textContent = fitTierLabel(fit);
    }

    function wireDownloadButtons() {
        document.querySelectorAll('.hub-dl').forEach((btn) => {
            btn.addEventListener('click', () => startDownload(btn));
        });
        document.querySelectorAll('.hub-del').forEach((btn) => {
            btn.addEventListener('click', () => deleteDownloadedFile(btn, btn.dataset.filename));
        });
        document.querySelectorAll('.hub-companion-choice input').forEach((input) => {
            input.addEventListener('change', () => {
                const row = input.closest('.hub-file-row');
                const chosen = row.querySelector('.hub-companion-choice input:checked');
                const total = Number(row.dataset.companionRequiredMb || 0) + Number(chosen?.dataset.sizeMb || 0);
                const note = row.querySelector('.hub-aux-note');
                if (note) note.textContent = t('hub_service_files').replace('{n}', fmtNum(Math.ceil(total)));
            });
        });
    }

    function deleteDownloadedFile(btn, filename) {
        const msg = t('hub_delete_confirm').replace('{filename}', filename);
        if (!confirm(msg)) return;
        btn.disabled = true;
        fetchWithCSRF('/admin/api/hub/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: filename })
        })
        .then(r => r.json())
        .then((data) => {
            if (data.status === 'ok') {
                installedList = installedList.filter(b => b !== filename);
                if (lastData) renderResults(lastData, true);
            } else {
                btn.disabled = false;
                alert(data.error || t('hub_error'));
            }
        })
        .catch(() => { btn.disabled = false; alert(t('hub_error')); });
    }

    function checkHubReachability() {
        const banner = document.getElementById('hub-offline-banner');
        if (!banner) return;
        const showBanner = () => {
            banner.innerHTML = '⚠️ ' + esc(t('hub_no_hf_access')) + '. ' + esc(t('hub_manual_upload'));
            banner.style.display = 'block';
        };
        fetch('/admin/api/hub/reachability', { credentials: 'same-origin' })
            .then(r => r.json())
            .then((data) => {
                if (data && data.reachable) banner.style.display = 'none';
                else showBanner();
            })
            .catch(showBanner);
    }

    function getActiveDownloads() {
        try {
            return JSON.parse(sessionStorage.getItem(ACTIVE_DOWNLOADS_KEY) || '[]');
        } catch (_) {
            return [];
        }
    }

    function saveActiveDownloads(jobs) {
        sessionStorage.setItem(ACTIVE_DOWNLOADS_KEY, JSON.stringify(jobs));
    }

    function rememberActiveDownload(job) {
        const jobs = getActiveDownloads().filter(item => item.job_id !== job.job_id);
        jobs.push(job);
        saveActiveDownloads(jobs);
    }

    function forgetActiveDownload(jobId) {
        saveActiveDownloads(getActiveDownloads().filter(item => item.job_id !== jobId));
    }

    function createDownloadRow(job) {
        const row = document.createElement('div');
        row.className = 'hub-dl-job';
        const name = document.createElement('span');
        name.className = 'hub-dl-job-name';
        name.textContent = job.file;
        const wrap = document.createElement('span');
        wrap.className = 'hub-progress-wrap';
        const bar = document.createElement('span');
        bar.className = 'hub-progress-bar';
        const fill = document.createElement('span');
        fill.className = 'hub-progress-fill';
        bar.appendChild(fill);
        const text = document.createElement('span');
        text.className = 'hub-progress-text';
        text.textContent = '…';
        wrap.append(bar, text);
        const cancel = document.createElement('button');
        cancel.className = 'hub-cancel add-user-button';
        cancel.textContent = t('hub_cancel');
        cancel.dataset.job = job.job_id;
        row.append(name, wrap, cancel);
        activeDownloads.appendChild(row);
        activeDownloads.style.display = 'block';
        return { row, cancel };
    }

    function resumeActiveDownloads() {
        const jobs = getActiveDownloads();
        if (!activeDownloads || !jobs.length) return;
        jobs.forEach(job => {
            const ui = createDownloadRow(job);
            pollJob(job.job_id, ui.row, ui.cancel, job.repo, job.file, job.module);
        });
    }

    async function startDownload(btn) {
        const repo = btn.dataset.repo;
        const file = btn.dataset.file;
            const module = btn.dataset.module || 'multimodal';
            const row = btn.closest('.hub-file-row');
        const companionPaths = row
            ? Array.from(row.querySelectorAll('[data-companion-choice]:checked')).map(input => input.value)
            : [];
        btn.disabled = true;
        fetchWithCSRF('/admin/api/hub/download', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                repo: repo,
                file: file,
                module: module,
                companions: companionPaths
            })
        })
        .then(r => r.json())
        .then((data) => {
            if (data.status !== 'ok') {
                btn.disabled = false;
                row.querySelector('.hub-fit').textContent = '✗';
                row.querySelector('.hub-fit').title = data.error || t('hub_error');
                return;
            }
            const activeJob = { job_id: data.job_id, repo, file, module };
            rememberActiveDownload(activeJob);
            const ui = createDownloadRow(activeJob);
            // The "Download" button turns into a same-size red "Cancel" button
            // in place, so no extra control piles up on top of the file name.
            // A fresh <button> is used: the old node is disabled (browsers never
            // fire click on disabled buttons) and already carries the download
            // listener, which would re-submit the job on the next click.
            btn.replaceWith(ui.cancel);
            pollJob(data.job_id, ui.row, ui.cancel, repo, file, module);
        })
        .catch(() => { btn.disabled = false; row.querySelector('.hub-fit').textContent = '✗'; });
    }

    function restoreDownload(btn, repo, file, module) {
        const dlBtn = document.createElement('button');
        dlBtn.className = 'hub-dl add-user-button';
        dlBtn.dataset.repo = repo;
        dlBtn.dataset.file = file;
        dlBtn.dataset.module = module;
        dlBtn.textContent = t('hub_download');
        dlBtn.addEventListener('click', () => startDownload(dlBtn));
        if (btn.parentNode) btn.parentNode.replaceChild(dlBtn, btn);
    }

    function pollJob(jobId, cell, cancelBtn, repo, file, module) {
        const everyMs = 1000;
        cancelBtn.addEventListener('click', () => {
            fetchWithCSRF(`/admin/api/hub/cancel/${jobId}`, { method: 'POST' }).catch(() => {});
        });
        (function tick() {
            fetchWithCSRF(`/admin/api/hub/progress/${jobId}`)
                .then(r => r.json())
                .then((data) => {
                    // A transient error (progress hash not yet written) must not
                    // end the chain: reschedule and try again.
                    if (data.status !== 'ok') { setTimeout(tick, everyMs); return; }
                    const job = data.job;
                    const fill = cell.querySelector('.hub-progress-fill');
                    const text = cell.querySelector('.hub-progress-text');
                    if (job.state === 'starting' || job.state === 'downloading' || job.state === 'verifying') {
                        rememberActiveDownload({ job_id: jobId, repo, file, module });
                    }
                    if (job.state === 'starting') {
                        // Worker is still resolving the file: no bytes yet, but the
                        // poller must keep ticking or the bar freezes at 0%.
                        fill.style.width = '0%';
                        text.textContent = '…';
                        setTimeout(tick, everyMs);
                    } else if (job.state === 'downloading') {
                        const pct = job.total_mb > 0 ? Math.min(99, Math.round(job.received_mb / job.total_mb * 100)) : 0;
                        fill.style.width = pct + '%';
                        text.textContent = t('hub_downloading')
                            .replace('{pct}', String(pct))
                            .replace('{total}', fmtNum(Math.ceil(job.total_mb)));
                        setTimeout(tick, everyMs);
                    } else if (job.state === 'verifying') {
                        fill.style.width = '100%';
                        text.textContent = t('hub_verifying');
                        setTimeout(tick, everyMs);
                    } else if (job.state === 'done') {
                        fill.style.width = '100%';
                        cell.innerHTML = '✓ ' + esc(t('hub_done'));
                        if (typeof refreshModelsAfterHubDownload === 'function') {
                            refreshModelsAfterHubDownload();
                        }
                        forgetActiveDownload(jobId);
                        cancelBtn.remove();
                    } else if (job.state === 'cancelled') {
                        forgetActiveDownload(jobId);
                        cell.textContent = esc(t('hub_cancelled'));
                        restoreDownload(cancelBtn, repo, file, module);
                    } else if (job.state === 'failed') {
                        forgetActiveDownload(jobId);
                        cell.textContent = '✗ ' + esc(t('hub_failed')) + ': ' + esc(job.error || '');
                        restoreDownload(cancelBtn, repo, file, module);
                    }
                })
                .catch(() => { setTimeout(tick, everyMs); });
        })();
    }

    checkHubReachability();
    const hubTabBtn = document.querySelector('.admin-tab[data-tab="hub"]');
    if (hubTabBtn) hubTabBtn.addEventListener('click', () => checkHubReachability());
})();
<\/script>
<script>// app/static/js/admin-backups.js
// Backup/restore functionality for admin panel

document.addEventListener('DOMContentLoaded', function() {
    const createBtn = document.getElementById('create-backup-btn');
    const refreshBtn = document.getElementById('refresh-backups-btn');
    const backupsTbody = document.getElementById('backups-tbody');
    const noBackupsMsg = document.getElementById('no-backups-msg');
    const backupsTable = document.getElementById('backups-table');

    if (!createBtn) return; // Not on backups tab

    // Load backups on tab activation
    const backupsTabBtn = document.querySelector('[data-tab="backups"]');
    if (backupsTabBtn) {
        backupsTabBtn.addEventListener('click', function() {
            loadBackups();
        });
    }

    // Initial load
    loadBackups();

    createBtn.addEventListener('click', createBackup);
    refreshBtn.addEventListener('click', refreshBackups);

    function refreshBackups() {
        refreshBtn.disabled = true;
        refreshBtn.classList.add('btn-syncing');
        refreshBtn.textContent = '🔄 ' + t('Loading...');
        loadBackups().finally(() => {
            refreshBtn.disabled = false;
            refreshBtn.classList.remove('btn-syncing');
            refreshBtn.textContent = '🔄 ' + t('Update backup list');
        });
    }

    function loadBackups() {
        return fetch('/admin/api/backups/')
            .then(res => res.json())
            .then(backups => {
                backupsTbody.innerHTML = '';
                if (!backups || backups.length === 0) {
                    backupsTable.style.display = 'none';
                    noBackupsMsg.style.display = 'block';
                    return;
                }
                backupsTable.style.display = 'table';
                noBackupsMsg.style.display = 'none';

                backups.forEach((backup, index) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="cam-num">${index + 1}</td>
                        <td>${formatDate(backup.created_at)}</td>
                        <td title="${escapeHtml(backup.filename)}">${escapeHtml(backup.filename)}</td>
                        <td><span class="backup-type-badge">${backup.type === 'users' ? t('Users only') : (backup.type === 'full' ? t('Full (users + chats + files)') : backup.type)}</span></td>
                        <td>${formatSize(backup.size)}</td>
                        <td class="actions-cell">
                            <button class="btn-success" onclick="restoreBackup('${escapeHtml(backup.filename)}')" title="${t('restore')}">${t('restore')}</button>
                            <a href="/admin/api/backups/${encodeURIComponent(backup.filename)}/download" class="btn-warning" title="${t('download')}">${t('download')}</a>
                            <button class="btn-danger" onclick="deleteBackup('${escapeHtml(backup.filename)}')" title="${t('delete')}">${t('delete')}</button>
                        </td>
                    `;
                    backupsTbody.appendChild(tr);
                });
            })
            .catch(err => {
                console.error('Error loading backups:', err);
                alert(t('backup_error'));
            })
            .finally(() => {});  // Return a promise for refreshBackups().finally()
    }

    function createBackup() {
        const backupType = document.getElementById('backup-type').value;
        createBtn.disabled = true;
        createBtn.textContent = t('creating');

        fetchWithCSRF('/admin/api/backups/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: backupType })
        })
        .then(res => res.json())
        .then(result => {
            if (result.status === 'ok') {
                loadBackups();
            } else {
                showToast(t('backup_error') + ': ' + (result.error || ''), 'error');
            }
        })
        .catch(err => {
            console.error('Error creating backup:', err);
            alert(t('backup_error'));
        })
        .finally(() => {
            createBtn.disabled = false;
            createBtn.textContent = t('Create backup');
        });
    }

    window.restoreBackup = function(filename) {
        const backupType = filename.startsWith('full_') ? 'full' : 'users';
        const msg = backupType === 'full'
            ? t('restore_confirm_full').replace('{filename}', filename)
            : t('restore_confirm_users').replace('{filename}', filename);

        if (!confirm(msg)) return;

        createBtn.disabled = true;

        fetchWithCSRF('/admin/api/backups/restore', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: filename })
        })
        .then(res => res.json())
        .then(result => {
            if (result.status === 'ok') {
                setTimeout(() => location.reload(), 1000);
            } else {
                alert(t('restore_error') + ': ' + (result.error || ''));
                createBtn.disabled = false;
            }
        })
        .catch(err => {
            console.error('Error restoring backup:', err);
            alert(t('restore_error'));
            createBtn.disabled = false;
        });
    };

    window.deleteBackup = function(filename) {
        const msg = t('delete_confirm').replace('{filename}', filename);
        if (!confirm(msg)) return;

        fetchWithCSRF(`/admin/api/backups/${encodeURIComponent(filename)}`, {
            method: 'DELETE'
        })
        .then(res => res.json())
        .then(result => {
            if (result.status === 'ok') {
                loadBackups();
            } else {
                alert(t('delete_error') + ': ' + (result.error || ''));
            }
        })
        .catch(err => {
            console.error('Error deleting backup:', err);
            alert(t('delete_error'));
        });
    };

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function formatDate(isoStr) {
        try {
            const d = new Date(isoStr);
            return d.toLocaleString();
        } catch {
            return isoStr;
        }
    }
});

<script>// app/static/js/admin-branding.js
// Personalization tab: custom header logo + localized site names.
(function () {
    'use strict';

    const logoPreview = document.getElementById('branding-logo-preview');
    const logoInput = document.getElementById('branding-logo-input');
    const uploadBtn = document.getElementById('branding-logo-upload-btn');
    const deleteBtn = document.getElementById('branding-logo-delete-btn');
    const namesForm = document.getElementById('branding-names-form');
    const nameRu = document.getElementById('branding-name-ru');
    const nameEn = document.getElementById('branding-name-en');
    if (!logoPreview || !uploadBtn) return;

    const t = (key) => (window.TRANSLATIONS && window.TRANSLATIONS[key]) || key;
    const DEFAULT_LOGO = logoPreview.src;

    function setDeleteVisibility(hasLogo) {
        deleteBtn.hidden = !hasLogo;
    }

    async function safeJson(resp) {
        const text = await resp.text();
        try {
            return JSON.parse(text);
        } catch (e) {
            throw new Error('HTTP ' + resp.status + ' ' + resp.statusText + (text ? ' — ' + text.slice(0, 120) : ''));
        }
    }

    async function loadBranding() {
        try {
            const resp = await fetch('/admin/api/branding', { credentials: 'same-origin' });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const data = await safeJson(resp);
            logoPreview.src = data.logo_url || DEFAULT_LOGO;
            setDeleteVisibility(!!data.has_logo);
            nameRu.value = data.site_name_ru || '';
            nameEn.value = data.site_name_en || '';
        } catch (err) {
            console.error('Branding load failed:', err);
            alert(t('branding_load_error'));
        }
    }

    uploadBtn.addEventListener('click', () => logoInput.click());

    logoInput.addEventListener('change', async () => {
        const file = logoInput.files && logoInput.files[0];
        if (!file) return;
        if (file.size > 2 * 1024 * 1024) {
            alert(t('branding_logo_too_large'));
            logoInput.value = '';
            return;
        }
        const form = new FormData();
        form.append('logo', file);
        const csrf = namesForm.querySelector('input[name="csrf_token"]');
        uploadBtn.disabled = true;
        try {
            const resp = await fetch('/admin/api/branding/logo', {
                method: 'POST',
                credentials: 'same-origin',
                headers: csrf ? { 'X-CSRFToken': csrf.value } : undefined,
                body: form,
            });
            const data = await safeJson(resp);
            if (!resp.ok) throw new Error(data.error || t('branding_upload_failed'));
            logoPreview.src = data.logo_url + (data.logo_url.includes('?') ? '&' : '?') + '_r=' + Date.now();
            setDeleteVisibility(true);
            alert(t('branding_logo_uploaded'));
        } catch (err) {
            console.error('Logo upload failed:', err);
            alert(err.message || t('branding_upload_failed'));
        } finally {
            uploadBtn.disabled = false;
            logoInput.value = '';
        }
    });

    deleteBtn.addEventListener('click', async () => {
        const csrf = namesForm.querySelector('input[name="csrf_token"]');
        deleteBtn.disabled = true;
        try {
            const resp = await fetch('/admin/api/branding/logo', {
                method: 'DELETE',
                credentials: 'same-origin',
                headers: csrf ? { 'X-CSRFToken': csrf.value } : undefined,
            });
            const data = await safeJson(resp);
            if (!resp.ok) throw new Error(data.error || 'HTTP ' + resp.status);
            logoPreview.src = DEFAULT_LOGO + (DEFAULT_LOGO.includes('?') ? '&' : '?') + '_r=' + Date.now();
            setDeleteVisibility(false);
            alert(t('branding_logo_deleted'));
        } catch (err) {
            console.error('Logo delete failed:', err);
            alert(err.message || 'HTTP error');
        } finally {
            deleteBtn.disabled = false;
        }
    });

    namesForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const ru = nameRu.value.trim();
        const en = nameEn.value.trim();
        if (!ru && !en) {
            // Deliberate reset — both empty means "use the default brand name".
        } else if (!ru || !en) {
            alert(t('branding_both_required'));
            return;
        } else if (ru.length > 40 || en.length > 40) {
            alert(t('branding_name_too_long'));
            return;
        }
        const csrf = namesForm.querySelector('input[name="csrf_token"]');
        try {
            const resp = await fetch('/admin/api/branding/names', {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json',
                    ...(csrf ? { 'X-CSRFToken': csrf.value } : {}),
                },
                body: JSON.stringify({ site_name_ru: ru, site_name_en: en }),
            });
            const data = await safeJson(resp);
            if (!resp.ok) throw new Error(data.error || 'HTTP ' + resp.status);
            nameRu.value = data.site_name_ru || '';
            nameEn.value = data.site_name_en || '';
            alert(t('branding_names_saved'));
            // The header shows the names for the *current* session language only
            // after reload — reload is the simplest way to see the change.
            window.location.reload();
        } catch (err) {
            console.error('Names save failed:', err);
            alert(err.message || 'HTTP error');
        }
    });

    loadBranding();
})();
