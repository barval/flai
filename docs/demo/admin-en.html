    // closes; appending its tokens into the task view would interleave two
    // conversations in one container.
    if (typeof isTaskViewActive === 'function' && isTaskViewActive()) return;

    const chatMessages = document.getElementById('chat-messages');
    if (!chatMessages) return;

    let streamMsg = chatMessages.querySelector('.assistant-message[data-streaming="true"]');
    let indicatorSpan = null;

    if (!streamMsg) {
        // Remove task-progress indicator ("Loading the model...") once
        // the first stream_token arrives — the model is now responding.
        _removeProgressElement(data.task_id);

        // Create new message element with proper structure
        streamMsg = document.createElement('div');
        streamMsg.className = 'assistant-message bot-message';
        streamMsg.setAttribute('data-streaming', 'true');
        streamMsg.setAttribute('data-task-id', data.task_id);
        streamMsg.setAttribute('data-role', 'assistant');
        streamMsg.dataset.sessionId = data.session_id;
        chatMessages.appendChild(streamMsg);

        // Header with timestamp, streaming indicator, cancel button
        const headerDiv = document.createElement('span');
        headerDiv.className = 'message-header';

        const timeSpan = document.createElement('span');
        timeSpan.textContent = '📅 ' + formatFullDateTime(new Date().toISOString());
        headerDiv.appendChild(timeSpan);

        indicatorSpan = document.createElement('span');
        indicatorSpan.className = 'streaming-indicator blink';
        indicatorSpan.textContent = '⚡ ' + t('generating');
        headerDiv.appendChild(indicatorSpan);

        streamMsg.appendChild(headerDiv);

        // Content div
        const contentDiv = document.createElement('div');
        contentDiv.className = 'message-content';
        streamMsg.appendChild(contentDiv);

        _showHeaderCancelButton(data.task_id);
    }

    // Update content (strip thinking tags and generic reasoning for display).
    // Throttled: the strip runs over the whole accumulated buffer, so doing it
    // on every token is O(n^2) and starves the renderer on long responses.
    if (now - reqInfo.lastRender >= STREAM_RENDER_INTERVAL) {
        reqInfo.lastRender = now;
        const contentDiv = streamMsg.querySelector('.message-content');
        if (contentDiv) {
            contentDiv.textContent = _stripGenericReasoning(_stripThinkingTags(reqInfo.accumulatedContent));
            if (isNearBottom(chatMessages)) scrollToBottom(chatMessages);
        }
    }

    // Live token/s estimate (every 500ms)
    if (!indicatorSpan) {
        indicatorSpan = streamMsg.querySelector('.streaming-indicator');
    }
    if (indicatorSpan && now - reqInfo.lastSpeedUpdate >= 500) {
        reqInfo.lastSpeedUpdate = now;
        var elapsed = (now - reqInfo.streamStartTime) / 1000;
        if (elapsed > 0.5) {
            var estTokens = Math.round(reqInfo.accumulatedContent.length / 3);
            var tps = (estTokens / elapsed).toFixed(1);
            indicatorSpan.textContent = '⚡ ' + t('generating') + ' (' + tps + t('tps_suffix') + ')';
        }
    }
}

function _saveStreamToSessionStorage(taskId, sessionId, content) {
    try {
        sessionStorage.setItem('stream_' + taskId, JSON.stringify({
            sessionId: sessionId,
            content: content,
            timestamp: Date.now()
        }));
    } catch (e) {
        // sessionStorage full or unavailable - ignore
    }
}

function _clearStreamFromSessionStorage(taskId) {
    try {
        sessionStorage.removeItem('stream_' + taskId);
    } catch (e) {
        // ignore
    }
}

function restoreStreamingFromSessionStorage() {
    if (!currentSessionId) return;
    // The Tasks tab owns the main window (task view or empty state) — do not
    // paint streaming chat elements into it.
    if (typeof isTaskViewActive === 'function' && isTaskViewActive()) return;
    const keysToRemove = [];
    const chatMessages = document.getElementById('chat-messages');
    if (!chatMessages) return;

    for (var i = 0; i < sessionStorage.length; i++) {
        var key = sessionStorage.key(i);
        if (!key || !key.startsWith('stream_')) continue;
        try {
            var saved = JSON.parse(sessionStorage.getItem(key));
            if (!saved || !saved.sessionId || !saved.content) {
                keysToRemove.push(key);
                continue;
            }
            if (saved.sessionId !== currentSessionId) {
                keysToRemove.push(key);
                continue;
            }
            // Restore DOM for this session
            var existing = chatMessages.querySelector('[data-task-id="' + key.replace('stream_', '') + '"]');
            if (existing) {
                keysToRemove.push(key);
                continue;
            }
            var taskId = key.replace('stream_', '');
            var msgDiv = document.createElement('div');
            msgDiv.className = 'assistant-message bot-message';
            msgDiv.setAttribute('data-streaming', 'true');
            msgDiv.setAttribute('data-task-id', taskId);
            msgDiv.setAttribute('data-role', 'assistant');
            msgDiv.dataset.sessionId = currentSessionId;
            chatMessages.appendChild(msgDiv);

            var headerDiv = document.createElement('span');
            headerDiv.className = 'message-header';

            var timeSpan = document.createElement('span');
            timeSpan.textContent = '📅 ' + formatFullDateTime(new Date(saved.timestamp).toISOString());
            headerDiv.appendChild(timeSpan);

            var indicatorSpan = document.createElement('span');
            indicatorSpan.className = 'streaming-indicator blink';
            indicatorSpan.textContent = '⚡ ' + t('generating');
            headerDiv.appendChild(indicatorSpan);

            msgDiv.appendChild(headerDiv);

            var contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = saved.content;
            msgDiv.appendChild(contentDiv);

            _showHeaderCancelButton(taskId);

            // Re-register in pendingRequestIds
            if (!pendingRequestIds[taskId]) {
                pendingRequestIds[taskId] = {
                    sessionId: currentSessionId,
                    timestamp: saved.timestamp,
                    accumulatedContent: saved.content,
                    streamStartTime: Date.now(),
                    lastSpeedUpdate: Date.now()
                };
            }
        } catch (e) {
            keysToRemove.push(key);
        }
    }
    // Clean stale keys
    for (var j = 0; j < keysToRemove.length; j++) {
        try { sessionStorage.removeItem(keysToRemove[j]); } catch (e) {}
    }
}

// -- result_completed -------------------------------------------------

// When a voice request triggers deep analysis (RLM), the backend re-queues a
// plain text/image task in addition to the RLM trace. Its re-queued
// request_id (captured from the transcription SSE) is suppressed here so the
// plain answer is NOT rendered next to the deep-analysis trace ("instead of
// a plain answer"). In-memory only: a page refresh between transcription and
// completion falls back to the normal render (acceptable edge case).
const rlmSuppressedResultIds = new Set();

function onResultCompleted(data) {
    if (!data || !data.task_id) return;
    dlog('onResultCompleted:', data.task_id, data.status);

    // Suppressed re-queued plain task: clean up indicators and queue state but
    // do NOT render the answer (deep-analysis trace already replaced it).
    if (rlmSuppressedResultIds.has(data.task_id)) {
        rlmSuppressedResultIds.delete(data.task_id);
        _hideHeaderCancelButton();
        _removeProgressElement(data.task_id);
        _clearStreamFromSessionStorage(data.task_id);
        const suppressedSessionId = data.session_id || (data.result && data.result.session_id) || null;
        if (suppressedSessionId) {
            setLocalTranscribing(suppressedSessionId, false);
            clearSessionQueue(suppressedSessionId);
        }
        clearPendingRequest(data.task_id);
        setTimeout(fetchQueueStatus, 500);
        return;
    }

    _hideHeaderCancelButton();

    // Clean up progress indicators
    _removeProgressElement(data.task_id);
    const barEl = document.querySelector('.video-progress-bar[data-task-id="' + data.task_id + '"]');
    if (barEl) barEl.remove();
    const previewEl = document.querySelector('.image-preview-container[data-task-id="' + data.task_id + '"]');
    if (previewEl) previewEl.remove();

    const reqInfo = pendingRequestIds[data.task_id];
    if (!reqInfo) {
        // After page refresh, pendingRequestIds is empty (in-memory, not persisted).
        // The result may still carry a valid response - display it and clean up.
        const existingMsg = document.querySelector('[data-task-id="' + data.task_id + '"]');
        if (existingMsg && existingMsg.hasAttribute('data-streaming')) existingMsg.remove();
        _clearStreamFromSessionStorage(data.task_id);
        const sessionId = data.session_id || (data.result && data.result.session_id) || null;
        if (data.status === 'completed' && data.result) {
            handleCompletedResult(data.result, sessionId);
        } else if (data.status === 'error') {
            handleErrorResult(data, sessionId);
        }
        return;
    }

    const expectedSessionId = reqInfo.sessionId;

    // Re-queue case (RAG/video/image): the task completed but spawned a new queue
    // entry with a different request_id. The old streaming message in the DOM is
    // just an intermediate placeholder — remove it so the new task's streaming
    // message doesn't create a duplicate.
    if (data.result && data.result.status === 'queued' && data.result.request_id) {
        const oldMsg = document.querySelector('.assistant-message[data-task-id="' + data.task_id + '"]');
        if (oldMsg) oldMsg.remove();
        _clearStreamFromSessionStorage(data.task_id);
        clearPendingRequest(data.task_id);
        trackPendingRequest(data.result.request_id, expectedSessionId);
        // Keep processing=true locally — don't call fetchQueueStatus() here
        // because it rebuilds sessionQueueInfo from scratch. If the server
        // hasn't registered the new reasoning task yet, it would overwrite
        // processing=true with false, causing ⚡ to flicker off in the sidebar.
        // The normal 5s poll will sync with the server shortly.
        sessionQueueInfo[expectedSessionId] = { processing: true, queued: 0, queue_position: 0, has_transcribing: false };
        if (typeof updateStatusCounter === 'function') updateStatusCounter();
        return;
    }

    // Handle streamed completion differently
    if (reqInfo.accumulatedContent !== undefined) {
        finalizeStreamedMessage(data, reqInfo, expectedSessionId);
        return;
    }

    clearPendingRequest(data.task_id);

    if (data.status === 'completed' && data.result) {
        handleCompletedResult(data.result, expectedSessionId);
    } else if (data.status === 'error') {
        handleErrorResult(data, expectedSessionId);
    }
}

function onStreamCancelled(data) {
    if (!data || !data.task_id) return;
    dlog('onStreamCancelled:', data.task_id);

    // The result_completed will follow shortly - let finalizeStreamedMessage handle cleanup.
    // Just mark the DOM as cancelled.
    const streamMsg = document.querySelector('.assistant-message[data-streaming="true"]');
    if (streamMsg) {
        // Update header: show cancelled label
        const indicator = streamMsg.querySelector('.streaming-indicator');
        if (indicator) {
            indicator.className = 'cancelled-label';
            indicator.textContent = '⚠️ ' + t('cancelled');
        }
    }
    _hideHeaderCancelButton();
    _clearStreamFromSessionStorage(data.task_id);
}

function finalizeStreamedMessage(data, reqInfo, expectedSessionId) {
    _hideHeaderCancelButton();
    const resultSessionId = data.result?.session_id || data.session_id || expectedSessionId;
    const taskId = data.task_id || reqInfo.taskId;

    // Update sessions count
    if (resultSessionId && sessionsData[resultSessionId]) {
        sessionsData[resultSessionId].message_count = (sessionsData[resultSessionId].message_count || 0) + 1;
        sessionsData[resultSessionId].updated_at = new Date().toISOString();
        delete newMessageIndicators[resultSessionId];
        if (data.result && typeof accumulateSessionTokens === 'function') {
            accumulateSessionTokens(resultSessionId, data.result.prompt_tokens, data.result.completion_tokens);
        }
    }

    // Find stream message by task-id (more reliable than generic [data-streaming])
    const streamMsg = document.querySelector('.assistant-message[data-task-id="' + taskId + '"]');
    if (streamMsg) {
        streamMsg.removeAttribute('data-streaming');
        streamMsg.removeAttribute('data-task-id');
        if (data.result?.message_id) {
            streamMsg.dataset.messageId = data.result.message_id;
            displayedMessageIds.add(data.result.message_id);
        }
        // Remove streaming-only elements
        var indicator = streamMsg.querySelector('.streaming-indicator');
        if (indicator) indicator.remove();
        var cancelledLabel = streamMsg.querySelector('.cancelled-label');
        if (cancelledLabel) cancelledLabel.remove();

        // Rebuild header with metadata from result
        var result = data.result;
        if (result) {
            var oldHeader = streamMsg.querySelector('.message-header');
            if (oldHeader) {
                var newHeader = document.createElement('span');
                newHeader.className = 'message-header';

                // Timestamp
                var ts = result.assistant_timestamp || new Date().toISOString();
                newHeader.innerHTML = '📅 ' + formatFullDateTime(ts);

                // Model name
                if (result.model_used) {
                    var shortModel = (result.model_used.split('/').pop() || result.model_used).replace(/\.gguf$/i, '');
                    var emoji = getModelEmoji(result.model_type);
                    var modelSpan = document.createElement('span');
                    modelSpan.className = 'text-muted';
                    modelSpan.textContent = ' | ' + emoji + shortModel;
                    newHeader.appendChild(modelSpan);
                }

                // Response time
                if (result.response_time) {
                    var duration = formatResponseDuration(result.response_time);
                    if (duration) {
                        var langSuffix = t('seconds_suffix');
                        var timeSpan = document.createElement('span');
                        timeSpan.className = 'text-muted';
                        timeSpan.textContent = ' | ⏱️ ' + duration + langSuffix + ' |';
                        newHeader.appendChild(timeSpan);

                        // Token usage counters (▲ outgoing requests / ▼
                        // incoming answers) — between the ⏱️ time and 🚀 tps
                        // segments of the header.
                        var tokenHTML = tokenStatsHTML(result.prompt_tokens, result.completion_tokens);
                        if (tokenHTML) {
                            var tokenHolder = document.createElement('span');
                            tokenHolder.innerHTML = tokenHTML;
                            newHeader.appendChild(tokenHolder);
                        }

                        // Tokens per second
                        if (result.completion_tokens) {
                            var tps = (result.completion_tokens / parseFloat(duration)).toFixed(1);
                            var tpsSpan = document.createElement('span');
                            tpsSpan.className = 'text-muted';
                            tpsSpan.textContent = ' 🚀 ' + tps + t('tps_suffix') + ' |';
                            newHeader.appendChild(tpsSpan);
                        }
                    }
                }

                // Response style emoji
                if (result.response_style) {
                    var styleEmoji = getResponseStyleEmoji(result.response_style);
                    if (styleEmoji) {
                        var styleLabel = t('response_style_' + result.response_style) || result.response_style;
                        var styleSpan = document.createElement('span');
                        styleSpan.className = 'response-style-indicator';
                        styleSpan.title = styleLabel;
                        styleSpan.textContent = styleEmoji;
                        newHeader.appendChild(styleSpan);
                    }
                }

                // TTS button
                var ttsBtn = document.createElement('button');
                ttsBtn.className = 'tts-button';
                ttsBtn.title = t('speak');
                ttsBtn.textContent = '🗣️';
                newHeader.appendChild(ttsBtn);

                // Copy button
                var copyBtn = document.createElement('button');
                copyBtn.className = 'copy-message-button';
                copyBtn.title = t('copy_text');
                copyBtn.textContent = '📋';
                newHeader.appendChild(copyBtn);

                oldHeader.replaceWith(newHeader);

                // Attach TTS click handler
                ttsBtn = newHeader.querySelector('.tts-button');
                if (ttsBtn) {
                    ttsBtn.removeAttribute('onclick');
                    ttsBtn.addEventListener('click', function(e) {
                        e.preventDefault();
                        if (window.IS_RELOADING) return;
                        var fn = window.playTTS || playTTS;
                        if (typeof fn === 'function') fn(ttsBtn, streamMsg);
                    });
                }

                // Attach copy button click handler
                copyBtn = newHeader.querySelector('.copy-message-button');
                if (copyBtn) {
                    copyBtn.addEventListener('click', function(e) {
                        e.preventDefault();
                        if (window.IS_RELOADING) return;
                        var rawText = streamMsg.dataset.rawText || streamMsg.dataset.cleanText || result.response;
                        if (!rawText) return;
                        copyToClipboard(rawText).then(function(success) {
                            var originalHTML = copyBtn.innerHTML;
                            var originalTitle = copyBtn.title;
                            if (success) {
                                copyBtn.innerHTML = '✓';
                                copyBtn.title = t('copied');
                                setTimeout(function() {
                                    copyBtn.innerHTML = originalHTML;
                                    copyBtn.title = originalTitle;
                                }, 2000);
                            }
                        });
                    });
                }
            }
        }

        // Set raw text for copy button (strip thinking tags and generic reasoning)
        if (result && result.response) {
            streamMsg.setAttribute('data-raw-text', _stripGenericReasoning(_stripThinkingTags(result.response)));
        }

        // Replace content with full rendered markdown (sanitized to prevent XSS)
        var contentDiv = streamMsg.querySelector('.message-content');
        var chatMessages = document.getElementById('chat-messages');
        var wasAtBottom = isNearBottom(chatMessages);
        if (contentDiv && result && result.response) {
            var cleanResponse = _stripGenericReasoning(_stripThinkingTags(result.response));
            contentDiv.innerHTML = DOMPurify.sanitize(marked.parse(cleanResponse));
        } else if (contentDiv && result && result.error) {
            // Show error in streaming message if no response text
            contentDiv.innerHTML = DOMPurify.sanitize(result.error);
        }

        // Display file attachments (image, video) from result if present
        if (result && (result.file_path || result.file_data)) {
            var fileUrl = '';
            if (result.file_path) {
                fileUrl = '/api/files/' + result.file_path;
            } else if (result.file_data) {
                fileUrl = 'data:' + (result.file_type || 'application/octet-stream') + ';base64,' + result.file_data;
            }
            if (fileUrl && result.file_type) {
                if (result.file_type.startsWith('image/')) {
                    var existingImg = streamMsg.querySelector('.image-container');
                    if (!existingImg) {
                        var imgContainer = document.createElement('div');
                        imgContainer.className = 'image-container';
                        var img = document.createElement('img');
                        img.src = fileUrl;
                        img.loading = 'lazy';
                        img.className = 'attached-image';
                        img.alt = result.file_name || t('image');
                        img.title = t('click_to_enlarge');
                        img.onclick = function() { openImageModal(this.src, result.file_name || t('image')); };
                        imgContainer.appendChild(img);
                        streamMsg.appendChild(imgContainer);
                    }
                } else if (result.file_type.startsWith('video/')) {
                    var existingVideo = streamMsg.querySelector('video');
                    if (!existingVideo) {
                        var video = document.createElement('video');
                        video.controls = true;
                        video.preload = 'metadata';
                        video.src = fileUrl;
                        video.style.maxWidth = '100%';
                        video.style.maxHeight = '400px';
                        streamMsg.appendChild(video);
                    }
                }
            }
        }

        if (typeof updateLastVisit === 'function') updateLastVisit(currentSessionId);
        if (typeof addCopyButtonsToMessage === 'function') addCopyButtonsToMessage(streamMsg);
        scrollToBottom(chatMessages);
    } else if (resultSessionId === currentSessionId && data.result?.response) {
        // Task view open: skip the DOM render (message persisted; reloads with
        // the session) — without this guard the streamed chat answer would be
        // appended into the open task conversation.
        if (typeof isTaskViewActive === 'function' && isTaskViewActive()) {
            return;
        }
        // Fallback: create the message via displayMessage
            window.displayMessage('assistant', data.result.response, null, null, null, null,
                data.result.assistant_timestamp || new Date().toISOString(),
                data.result.response_time, data.result.model_used,
                null, null, null, null, data.result.message_id,
                data.result.response_style, data.result.completion_tokens,
                data.result.file_size, data.result.model_type, data.result.prompt_tokens);
    }

    if (resultSessionId && resultSessionId !== currentSessionId) {
        setNewMessageIndicator(resultSessionId, true);
    }

    // Cleanup - but don't clear pending request if task was requeued
    if (resultSessionId) {
        setLocalTranscribing(resultSessionId, false);
        clearSessionQueue(resultSessionId);
        setTimeout(fetchQueueStatus, 500);
    }
    var wasRequeued = data.result && data.result.status === 'queued' && data.result.request_id;
    if (!wasRequeued) {
        clearPendingRequest(taskId);
    }
    _clearStreamFromSessionStorage(taskId);
}

function trackPendingRequest(requestId, sessionId, persist = true) {
    pendingRequestIds[requestId] = { sessionId: sessionId, timestamp: Date.now() };
    if (!persist) return;
    // Persist to sessionStorage so status indicators survive session switches
    try {
        const stored = JSON.parse(sessionStorage.getItem('pendingRequests') || '{}');
        stored[requestId] = { sessionId: sessionId, timestamp: Date.now() };
        sessionStorage.setItem('pendingRequests', JSON.stringify(stored));
    } catch (e) { /* ignore */ }
}

function restorePendingRequests() {
    try {
        const stored = JSON.parse(sessionStorage.getItem('pendingRequests') || '{}');
        const now = Date.now();
        for (const [reqId, info] of Object.entries(stored)) {
            // Only restore if not too old (5 minutes)
            if (!pendingRequestIds[reqId] && now - info.timestamp < 5 * 60 * 1000) {
                pendingRequestIds[reqId] = info;
            }
        }
    } catch (e) { /* ignore */ }
}

function verifyPendingRequests() {
    // On SSE reconnect, check if any pending tasks already completed on the server.
    // Fixes stuck hourglasses when result_completed event was lost during disconnection.
    const ids = Object.keys(pendingRequestIds);
    if (ids.length === 0) return;

    ids.forEach(function (reqId) {
        fetchWithCSRF('/api/queue/result/' + reqId)
            .then(function (resp) { return resp.json(); })
            .then(function (data) {
                if (data.status === 'completed' && data.result) {
                    const info = pendingRequestIds[reqId];
                    const sessionId = info ? info.sessionId : null;
                    clearPendingRequest(reqId);
                    handleCompletedResult(data.result, sessionId);
                } else if (data.status === 'error') {
                    const info = pendingRequestIds[reqId];
                    const sessionId = info ? info.sessionId : null;
                    clearPendingRequest(reqId);
                    handleErrorResult(data, sessionId);
                }
                // 'pending' means still running - leave it in pendingRequestIds
            })
            .catch(function () { /* ignore network errors */ });
    });
}

function clearPendingRequest(requestId) {
    delete pendingRequestIds[requestId];
    try {
        const stored = JSON.parse(sessionStorage.getItem('pendingRequests') || '{}');
        delete stored[requestId];
        sessionStorage.setItem('pendingRequests', JSON.stringify(stored));
    } catch (e) { /* ignore */ }
}

// -- RLM trace summary -------------------------------------------------
// The RLM result carries rlm_trace_task_id / rlm_steps in extra. The full
// per-step trace lives in the Redis key rlm_trace:<task_id> (not exposed via
// API), so for now we render only a collapsible steps summary attached to
// the last assistant message.
function appendRlmTraceBlock(steps) {
    const chatMessages = document.getElementById('chat-messages');
    if (!chatMessages) return;
    const assistantMsgs = chatMessages.querySelectorAll('.assistant-message');
    const lastAssistant = assistantMsgs.length ? assistantMsgs[assistantMsgs.length - 1] : null;
    if (!lastAssistant || lastAssistant.querySelector('.rlm-trace')) return;

    const details = document.createElement('details');
    details.className = 'rlm-trace';
    const summary = document.createElement('summary');
    summary.textContent = t('rlm_trace_summary').replace('%s', steps);
    details.appendChild(summary);
    lastAssistant.appendChild(details);
    if (isNearBottom(chatMessages)) scrollToBottom(chatMessages);
}

function handleCompletedResult(result, expectedSessionId) {
    const resultSessionId = result.session_id || expectedSessionId;

    // Update sessionsData count to keep sidebar in sync
    if (resultSessionId && sessionsData[resultSessionId]) {
        sessionsData[resultSessionId].message_count = (sessionsData[resultSessionId].message_count || 0) + 1;
        sessionsData[resultSessionId].updated_at = new Date().toISOString();
        delete newMessageIndicators[resultSessionId];
        if (typeof accumulateSessionTokens === 'function') {
            accumulateSessionTokens(resultSessionId, result.prompt_tokens, result.completion_tokens);
        }
    }

    // Transcription result - may spawn chained processing
    if (result.transcribed_text !== undefined && result.transcribed_text !== null) {
        handleTranscriptionResult(result, resultSessionId, expectedSessionId);
        return;
    }

    // Error result
    if (result.error) {
        if (resultSessionId === currentSessionId
            && !(typeof isTaskViewActive === 'function' && isTaskViewActive())) {
            // Error headers intentionally get no ⏱️/🚀/🤖 - pass null for
            // responseTime and modelName='system'.
            window.displayMessage('assistant', result.error, null, null, null, null,
                result.assistant_timestamp || new Date().toISOString(), null, 'system',
                null, null, null, null, result.message_id, null, null, null, 'system');
        }
        if (resultSessionId) setLocalTranscribing(resultSessionId, false);
        clearSessionQueue(resultSessionId);
        setTimeout(fetchQueueStatus, 500);
        return;
    }

    // Multiple messages (camera tasks)
    if (result.messages) {
        handleCameraResult(result, resultSessionId);
        return;
    }

    // Re-queue case: task completed but created a new queue entry (e.g., video from text)
    if (result.status === 'queued' && result.request_id) {
        trackPendingRequest(result.request_id, resultSessionId);
        sessionQueueInfo[resultSessionId] = { processing: true, queued: 0, queue_position: 0, has_transcribing: false };
        if (typeof updateStatusCounter === 'function') updateStatusCounter();
        if (typeof fetchQueueStatus === 'function') fetchQueueStatus();
        return;
    }

    // Single response (text / image gen)
    if (result.response) {
        if (result.message_id && displayedMessageIds.has(result.message_id)) {
            dlog('Skipping duplicate response by ID', result.message_id);
        } else {
            let responseTime = result.response_time;
            let modelUsed = result.model_used;

            if (result.mm_time && result.gen_time) {
                responseTime = { mm_time: result.mm_time, gen_time: result.gen_time, mm_model: result.mm_model, gen_model: result.gen_model };
                modelUsed = result.gen_model;
            }

            if (resultSessionId === currentSessionId
                && !(typeof isTaskViewActive === 'function' && isTaskViewActive())) {
                window.displayMessage('assistant', result.response, result.file_data,
                    result.file_type, result.file_name, result.file_path,
                    result.assistant_timestamp || new Date().toISOString(), responseTime, modelUsed,
                    null, null, null, null, result.message_id,
                    result.response_style, result.completion_tokens,
                    result.file_size, result.model_type, result.prompt_tokens);
                if (result.rlm_trace_task_id && typeof result.rlm_steps === 'number') {
                    appendRlmTraceBlock(result.rlm_steps);
                }
                if (typeof updateLastVisit === 'function') updateLastVisit(currentSessionId);
            } else {
                setNewMessageIndicator(resultSessionId, true);
            }
        }
        if (resultSessionId) setLocalTranscribing(resultSessionId, false);
        clearSessionQueue(resultSessionId);
        setTimeout(fetchQueueStatus, 500);
        return;
    }

    // No recognizable payload - clean up anyway
    if (resultSessionId) {
        setLocalTranscribing(resultSessionId, false);
        clearSessionQueue(resultSessionId);
        setTimeout(fetchQueueStatus, 500);
    }
}

function handleTranscriptionResult(result, resultSessionId, expectedSessionId) {
    if (resultSessionId === currentSessionId
        && !(typeof isTaskViewActive === 'function' && isTaskViewActive())) {
        if (!result.transcribed_message_id || !displayedMessageIds.has(result.transcribed_message_id)) {
            const transcribedText = result.transcribed_text || '(empty transcription)';
            var transcribedContent = JSON.stringify({prefix: '🎤 ' + t('transcribed') + ': ', text: transcribedText});
            window.displayMessage('assistant', transcribedContent, null, null, null, null,
                result.assistant_timestamp || new Date().toISOString(), result.response_time, 'whisper',
                null, null, null, null, result.transcribed_message_id, null, null, null, 'whisper');
            if (result.transcribed_message_id) displayedMessageIds.add(result.transcribed_message_id);
        }

        // Voice-triggered deep analysis: if a voice request was queued while
        // the RLM toggle was ON, start the analysis with the transcribed text
        // instead of continuing the plain (non-RLM) send flow. Clear the flag
        // first so a second delivery (SSE vs session polling) cannot start
        // deep analysis twice.
        if (window.rlmAwaitingVoice) {
            const rlmToggle = document.getElementById('rlm-toggle');
            const docsSelect = document.getElementById('rlm-docs');
            const docIds = docsSelect ? Array.from(docsSelect.selectedOptions).map(o => o.value) : [];
            if (rlmToggle && rlmToggle.checked && (docIds.length > 0 || window.rlmAwaitingVoiceImage)) {
                // The re-queued plain task (whose request_id travels in the
                // transcription SSE) must not render: the deep-analysis trace
                // replaces it. Suppress that task_id so onResultCompleted
                // skips the plain answer.
                if (result.request_id) rlmSuppressedResultIds.add(result.request_id);
                window.rlmAwaitingVoice = false;
                // The RLM request replaces the normal response: do not track
                // the re-queued plain task or send the transcribed text through
                // the plain flow. sendRlmAnalysis() consumes the saved image
                // reference (rlmAwaitingVoiceImage) before we clear it below.
                sendRlmAnalysis(result.transcribed_text || '');
                setLocalTranscribing(resultSessionId, false);
                window.rlmAwaitingVoiceImage = null;
                return;
            }
            // No docs/image remain selected at transcription time: clear the
            // flag and un-check the toggle (documented behavior), then proceed
            // with the normal flow.
            window.rlmAwaitingVoice = false;
            window.rlmAwaitingVoiceImage = null;
            if (rlmToggle) rlmToggle.checked = false;
            if (typeof updateRlmToggleCount === 'function') updateRlmToggleCount();
        }

        if (result.request_id) {
            trackPendingRequest(result.request_id, resultSessionId);
            sessionQueueInfo[resultSessionId] = { processing: true, queued: 0, queue_position: 0, has_transcribing: false };
            window.updateStatusCounter();
            if (typeof fetchQueueStatus === 'function') fetchQueueStatus();
        } else {
            // Audio file - no further processing, clear ⚡
            clearSessionQueue(resultSessionId);
            if (typeof fetchQueueStatus === 'function') fetchQueueStatus();

            // Also clear the safety‑valve cache to force UI redraw
            if (typeof updateSessionsListFromData === 'function') {
                window._lastSessionsJson = null;
                updateSessionsListFromData();
            }
        }
        setLocalTranscribing(resultSessionId, false);
    } else {
        if (result.request_id) {
            trackPendingRequest(result.request_id, resultSessionId);
        } else {
            setNewMessageIndicator(resultSessionId, true);
        }
        setLocalTranscribing(resultSessionId, false);
        window.updateStatusCounter();
    }
}

function handleCameraResult(result, resultSessionId) {
    const cameraSessionId = result.session_id || resultSessionId;
    if (cameraSessionId === currentSessionId
        && !(typeof isTaskViewActive === 'function' && isTaskViewActive())) {
        for (const msg of result.messages) {
            if (msg.message_id && displayedMessageIds.has(msg.message_id)) continue;
            window.displayMessage('assistant', msg.response, msg.file_data, msg.file_type, msg.file_name, msg.file_path,
                msg.assistant_timestamp, msg.response_time, msg.model_used,
                null, null, null, null, msg.message_id, msg.response_style,
                msg.completion_tokens, msg.file_size, msg.model_type, msg.prompt_tokens);
        }
        if (typeof updateLastVisit === 'function') updateLastVisit(currentSessionId);
    } else if (cameraSessionId) {
        setNewMessageIndicator(cameraSessionId, true);
    }
    if (resultSessionId) setLocalTranscribing(resultSessionId, false);
    clearSessionQueue(resultSessionId);
    setTimeout(fetchQueueStatus, 500);
}

function handleErrorResult(data, expectedSessionId) {
    const errorSessionId = data.result?.session_id || expectedSessionId;
    if (errorSessionId === currentSessionId
        && !(typeof isTaskViewActive === 'function' && isTaskViewActive())) {
        const errorMsg = data.result?.error || data.error || t('unknown_error');
        window.displayMessage('assistant', '⚠️ ' + t('error') + ': ' + errorMsg, null, null, null, null,
            new Date().toISOString(), null, 'system', null, null, null, null, null, null, null, null, 'system');
    }
    if (errorSessionId) {
        setLocalTranscribing(errorSessionId, false);
        clearSessionQueue(errorSessionId);
        setTimeout(fetchQueueStatus, 500);
    }
}

function clearSessionQueue(sessionId) {
    if (!sessionId) return;
    sessionQueueInfo[sessionId] = { processing: false, queued: 0, queue_position: 0, has_transcribing: false };
    if (sessionsData[sessionId]) sessionsData[sessionId].queue_info = null;
    if (typeof updateUIFromQueueStatus === 'function') updateUIFromQueueStatus();
}

// -- message_new ------------------------------------------------------

function onMessageNew(data) {
    if (!data || !data.session_id || !data.message_id) return;
    dlog('onMessageNew: session', data.session_id, 'msg', data.message_id, 'role', data.role);

    // Task conversation is open in the main window: the message is already
    // persisted, so skip only the render (counters/indicators below still run
    // for the other-session branch; for the current session the message
    // reloads with loadMessages when the task view closes).
    if (data.session_id === currentSessionId
        && typeof isTaskViewActive === 'function' && isTaskViewActive()) {
        return;
    }

    // Skip if message is for a different session or already displayed
    if (data.session_id !== currentSessionId) {
        setNewMessageIndicator(data.session_id, true);
        return;
    }
    if (displayedMessageIds.has(data.message_id)) {
        dlog('onMessageNew: already displayed', data.message_id);
        return;
    }
    if (document.querySelector('[data-message-id="' + data.message_id + '"]')) {
        displayedMessageIds.add(data.message_id);
        return;
    }

    // Reconcile the optimistic user message in place. The optimistic element
    // created by displayUserMessage (chat-init.js) carries only data-temp-id —
    // the real message_id is unknown until the POST response. The SSE echo of
    // the user's own message (message_new, role=user, published by
    // save_message inside the POST handler) arrives with the REAL message_id
    // while the POST is still in flight, so neither the displayedMessageIds
    // guard above nor the [data-message-id] DOM lookup can match the
    // optimistic element — without this guard the echo renders a SECOND user
    // bubble (duplicate that disappears on F5, because history loads the
    // single DB row).
    //
    // The guard is deliberately DOM-based and does NOT consult
    // pendingRequestIds: fetchQueueStatus()'s "safety valve" (chat-queue.js)
    // wipes ALL pendingRequestIds whenever the server reports idle — and that
    // poll races the in-flight POST, so the entry can vanish between the
    // optimistic render and this echo (observed duplicate 2026-09-21).
    // An element with data-temp-id and no data-message-id is by definition an
    // unconfirmed optimistic render; the DOM state is not wiped by anyone.
    //
    // NOTE on casing: dataset.tempId serialises to the attribute
    // "data-temp-id" (camelCase → kebab-case). CSS attribute selectors are
    // case-sensitive for attribute NAMES in HTML documents, so the selector
    // must be [data-temp-id] — an earlier [data-tempId] selector matched
    // nothing and the guard silently never ran (headless repro 2026-09-21).
    if (data.role === 'user') {
        var optimisticEls = document.querySelectorAll('.user-message[data-temp-id]');
        for (var oi = 0; oi < optimisticEls.length; oi++) {
            var oel = optimisticEls[oi];
            // Element already confirmed (real id assigned) — not optimistic.
            if (oel.dataset.messageId) continue;
            // Optimistic element for a DIFFERENT session (switched session
            // while the send was in flight) — leave its echo to its own view.
            if (oel.dataset.sessionId && oel.dataset.sessionId !== data.session_id) continue;
            dlog('onMessageNew: user SSE echo skipped — optimistic element still unconfirmed', data.message_id);
            return;
        }
    }

    // Use inline message data from SSE event (avoids fetching 50 messages)
    if (data.message) {
        var msg = data.message;
        if (!displayedMessageIds.has(msg.id)) {
            // A streaming placeholder for this session will be finalized with
            // this same message (finalizeStreamedMessage) — don't double-render.
            var activeStream = Object.keys(pendingRequestIds).some(function (tid) {
                var r = pendingRequestIds[tid];
                return r.sessionId === data.session_id && r.accumulatedContent !== undefined;
            });
            if (!activeStream) {
                var responseTime = null;
                if (msg.response_time) {
                    if (typeof msg.response_time === 'object') responseTime = msg.response_time;
                    else if (!isNaN(parseFloat(msg.response_time))) responseTime = parseFloat(msg.response_time);
                }
                // displayMessage owns the dedup (DOM + displayedMessageIds) and
                // registers the id itself — do NOT pre-add it here, or the
                // render below would be silently skipped.
                window.displayMessage(
                    msg.role, msg.content, msg.file_data, msg.file_type, msg.file_name, msg.file_path,
                    msg.timestamp, responseTime, msg.model_name,
                    msg.mm_time, msg.gen_time, msg.mm_model, msg.gen_model, msg.id,
                    msg.response_style, msg.completion_tokens, null, msg.model_type, msg.prompt_tokens
                );
            }
            if (sessionsData[data.session_id]) {
                sessionsData[data.session_id].message_count = (sessionsData[data.session_id].message_count || 0) + 1;
                if (typeof accumulateSessionTokens === 'function') {
                    accumulateSessionTokens(data.session_id, msg.prompt_tokens, msg.completion_tokens);
                }
            }
            // The message arrived in the current session — mark it visited so the
            // server-side unread count drops immediately (matches the behavior
            // of finalizeStreamedMessage/handleCompletedResult).
            if (typeof updateLastVisit === 'function') updateLastVisit(currentSessionId);
        }
        return;
    }

    // Fallback: fetch the full message data from server (legacy path)
    fetch('/api/sessions/' + data.session_id + '/messages?limit=50')
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (json) {
            if (!json || !json.messages) return;
            var messages = json.messages;
            // Find the specific message
            for (var i = 0; i < messages.length; i++) {
                var msg = messages[i];
                if (msg.id == data.message_id) {
                    if (displayedMessageIds.has(msg.id)) return;
                    // displayMessage registers the id itself (do not pre-add).
                    var responseTime = null;
                    if (msg.response_time) {
                        if (typeof msg.response_time === 'object') responseTime = msg.response_time;
                        else if (!isNaN(parseFloat(msg.response_time))) responseTime = parseFloat(msg.response_time);
                    }
                    window.displayMessage(
                        msg.role, msg.content, msg.file_data, msg.file_type, msg.file_name, msg.file_path,
                        msg.timestamp, responseTime, msg.model_name,
                        msg.mm_time, msg.gen_time, msg.mm_model, msg.gen_model, msg.id,
                        msg.response_style, msg.completion_tokens, null, msg.model_type, msg.prompt_tokens
                    );
                    if (sessionsData[data.session_id]) {
                        sessionsData[data.session_id].message_count = (sessionsData[data.session_id].message_count || 0) + 1;
                        if (typeof accumulateSessionTokens === 'function') {
                            accumulateSessionTokens(data.session_id, msg.prompt_tokens, msg.completion_tokens);
                        }
                    }
                    if (typeof updateLastVisit === 'function') updateLastVisit(currentSessionId);
                    return;
                }
            }
        })
        .catch(function () {});
}

// -- Progress restore after reconnect / page reload ------------------

async function restoreTaskProgress() {
    // The Tasks tab owns the main window (task view or empty state) — chat
    // progress bars must not be restored into it.
    if (typeof isTaskViewActive === 'function' && isTaskViewActive()) return;
    for (const [taskId, info] of Object.entries(pendingRequestIds)) {
        if (info.sessionId !== currentSessionId) continue;
        if (info._progressRestored) continue;

        try {
            const resp = await fetch('/api/queue/progress/' + taskId);
            const json = await resp.json();
            const progress = json && json.progress;
            if (!progress) continue;

            info._progressRestored = true;

            if (progress.type === 'video_step') {
                onVideoStep({
                    session_id: info.sessionId,
                    task_id: taskId,
                    step: progress.step,
                    total: progress.total,
                    percent: progress.percent,
                });
            } else if (progress.type === 'image_step') {
                onImageStep({
                    session_id: info.sessionId,
                    task_id: taskId,
                    step: progress.step,
                    total: progress.total,
                    percent: progress.percent,
                });
            } else if (progress.type === 'task_progress') {
                onTaskProgress({
                    session_id: info.sessionId,
                    task_id: taskId,
                    stage: progress.stage,
                    count: progress.count,
                });
            }
        } catch (e) {
            dlog('Failed to restore progress for', taskId, e);
        }
    }
}

// -- Initialisation ---------------------------------------------------

document.addEventListener('DOMContentLoaded', function () {
    connectEventStream();
});

// Reconnect SSE when tab becomes visible again (mobile fix)
document.addEventListener('visibilitychange', function () {
    if (!document.hidden && (!eventSource || eventSource.readyState !== EventSource.OPEN)) {
        dlog('Tab visible, reconnecting SSE...');
        connectEventStream();
        if (typeof loadSessionsFromServer === 'function') loadSessionsFromServer();
        if (typeof fetchQueueStatus === 'function') fetchQueueStatus();
        if (typeof restoreTaskProgress === 'function') restoreTaskProgress();
    }
});

// Make functions globally accessible
window.connectEventStream = connectEventStream;
window.disconnectEventStream = disconnectEventStream;
window.trackPendingRequest = trackPendingRequest;
window.restoreStreamingFromSessionStorage = restoreStreamingFromSessionStorage;
window.restoreTaskProgress = restoreTaskProgress;

// Fallback polling: refresh queue status every 5s while there are pending requests
setInterval(function () {
    if (Object.keys(pendingRequestIds).length > 0 && typeof fetchQueueStatus === 'function') {
        fetchQueueStatus();
    }
}, 5000);

            deleteBtn.onclick = () => deleteUser(user.login);
            actionsCell.appendChild(deleteBtn);
            row.appendChild(actionsCell);
            labelUserCardCells(row);
            tbody.appendChild(row);
        });
        if (tavilyCells.size) {
            fetch('/admin/api/users/tavily-usage')
                .then(response => response.json())
                .then(usage => {
                    tavilyCells.forEach((cell, login) => {
                        const state = usage[login];
                        if (!state) {
                            cell.textContent = '-';
                            return;
                        }
                        if (state.status === 'ok') {
                            cell.textContent = state.remaining;
                        } else if (state.status === 'exhausted') {
                            cell.textContent = '0';
                        } else if (state.status === 'no_key') {
                            cell.textContent = '-';
                        } else {
                            cell.textContent = '?';
                            cell.title = state.status === 'invalid' ? t('tavily_invalid_key') : t('tavily_unavailable');
                        }
                    });
                })
                .catch(err => {
                    dlog('Tavily usage load failed:', err);
                    tavilyCells.forEach((cell) => { cell.textContent = '-'; });
                });
        }
    })
    .catch(err => console.error('Error loading users:', err));
}

function saveStorageLimit(login, input) {
    const raw = String(input.value || '').trim();
    let value = null;
    if (raw !== '') {
        value = parseInt(raw, 10);
        if (!Number.isFinite(value) || value < 1) {
            alert(t('storage_limit_invalid'));
            input.value = input.dataset.default;
            return;
        }
    }
    fetchWithCSRF(`/admin/api/users/${login}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ storage_limit_mb: value })
    }).then(response => response.json()).then(result => {
        if (result.status !== 'ok') {
            alert(t('storage_limit_invalid'));
            return;
        }
        if (result.storage_limit_mb === null) {
            loadUsers();
        }
    }).catch(err => {
        console.error('Storage limit update failed', err);
        alert(t('storage_limit_invalid'));
    });

        headers: { 'Content-Type': 'application/json' },

    }).catch(err => console.error('Error updating user:', err));

function deleteUser(login) {

async function onContextLengthChange(event) {
    const input = event.target;
    const module = input.dataset.module;
    const ctxLength = input.value;

    const serviceUrl = typeof LLAMA_SWAP_URL !== 'undefined' ? LLAMA_SWAP_URL : 'http://flai-llamaswap:8080';

    const modelName = modelSelect.value;

    if (!modelName) return;

    const modelInfo = modelDetails[`${serviceUrl}:${modelName}`];
    if (modelInfo) {
        await updateMemoryEstimation(module, modelInfo, ctxLength);
    }
}

function modelAllowedForModule(type, module) {
    // A missing/unknown type means legacy fallback servers: only the typed
    // modules are restrictive then.
    if (module === 'embedding') return type === 'embedding';
    if (module === 'reranker') return type === 'reranker';
    if (module === 'multimodal') return type === 'multimodal';
    // A reranker cannot chat, and a chat model cannot rerank.
    return type !== 'embedding' && type !== 'reranker';
}

async function refreshModelsForModule(module, silent = false) {
    const urlInput = document.querySelector(`.service-url[data-module="${module}"]`);
    let serviceUrl = urlInput.value.trim();
    let backend = 'llamacpp';

    // Use llama-swap URL if configured
    if (typeof LLAMA_SWAP_URL !== 'undefined' && LLAMA_SWAP_URL) {
        serviceUrl = LLAMA_SWAP_URL;
        backend = 'llama-swap';
    } else if (!serviceUrl || serviceUrl === 'http://flai-llamacpp:8033') {
        serviceUrl = 'http://flai-llamaswap:8080';
        backend = 'llama-swap';
    }

    const select = document.querySelector(`.model-dropdown[data-module="${module}"]`);
    const currentConfig = currentModelConfigs[module] || {};
    const currentModelName = currentConfig.model_name || '';

    select.innerHTML = `<option value="">${t('-- Select model --')}</option>`;
    select.disabled = true;
    clearModelError(module);

    try {
        let models = [];

        // For llama-swap mode, first try to get actual GGUF files from models directory
        if (backend === 'llama-swap') {
            dlog('Trying to load GGUF files from models directory');
            try {
                const ggufRes = await fetch('/admin/api/llamacpp/models?list_type=gguf_files');
                dlog('GGUF response status:', ggufRes.status);
                if (ggufRes.ok) {
                    models = await ggufRes.json();
                    dlog('Loaded GGUF files:', models);
                } else {
                    dwarn('GGUF files endpoint failed with status:', ggufRes.status);
                }
            } catch (e) {
                dwarn('Could not load GGUF files:', e);
            }
        }

        // If no GGUF files or not llama-swap, get from llama-server API
        if (models.length === 0) {
            dlog('Loading models from llama-server API, backend:', backend);
            const response = await fetch(`/admin/api/llamacpp/models?url=${encodeURIComponent(serviceUrl)}&backend=${backend}`);
            if (!response.ok) {
                if (!silent) {
                    let errorMsg = `HTTP ${response.status}`;
                    try {
                        const errorData = await response.json();
                        if (errorData.error) errorMsg = errorData.error;
                    } catch (e) {}
                    showModelError(module, t('error') + ': ' + errorMsg);
                }
                return;
            }
            models = await response.json();
        }

        modelListCache[serviceUrl] = models;
        models = models.map(m => typeof m === 'string' ? { id: m, type: '' } : m);
        models.forEach(model => {
            if (!modelAllowedForModule(model.type, module)) return;
            const option = document.createElement('option');
            option.value = model.id;
            option.textContent = model.id;
            select.appendChild(option);
        });
    } catch (err) {
        if (!silent) {
            showModelError(module, t('error') + ': ' + err.message);
        }
    } finally {
        select.disabled = false;

        // Try to match current model
        if (currentModelName && select.options.length > 0) {
            // Simple approach: check if any option contains the current model name
            // Start from index 1 to skip the placeholder option
            let found = false;
            for (let i = 1; i < select.options.length; i++) {
                const optVal = select.options[i].value;
                const currentNorm = currentModelName.replace(/\.gguf$/, '').toLowerCase();
                const optNorm = optVal.replace(/\.gguf$/, '').toLowerCase();

                // Check various matches
                if (optVal === currentModelName || currentModelName === optVal ||
                    optNorm === currentNorm ||
                    optVal.includes(currentModelName) || currentModelName.includes(optVal) ||
                    optNorm.includes(currentNorm) || currentNorm.includes(optNorm)) {
                    select.selectedIndex = i;
                    select.value = optVal;
                    found = true;
                    dlog('Selected model at index', i, 'value:', optVal, 'for:', currentModelName);
                    break;
                }
            }

            // Last resort: check with path normalization
            if (!found) {
                const currentBase = currentModelName.split('/').pop().replace(/\.gguf$/, '');
                for (let i = 0; i < select.options.length; i++) {
                    const optBase = select.options[i].value.split('/').pop().replace(/\.gguf$/, '');
                    if (optBase === currentBase) {
                        select.selectedIndex = i;
                        found = true;
                        break;
                    }
                }
            }

            dlog('Model matching:', currentModelName, '-> found:', found);

            // Trigger model info load
            if (found && select.selectedIndex >= 0) {
                setTimeout(() => {
                    onModelSelect({ target: select });
                }, 100);
            }
        }
    }
}

async function onModelSelect(event) {
