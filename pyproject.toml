[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flai"
version = "13.6.0"
description = "Fully Local AI — a personal AI assistant that runs entirely on your hardware"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Valery Barval"},
]

dependencies = [
    "flask>=3.0",
    "flask-wtf>=1.2.1",
    "flask-limiter>=3.5.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.0",
    "urllib3>=2.8.0",
    "Werkzeug>=3.1.9",
    "gunicorn==26.2.0",
    "gevent>=23.9.0",
    "Pillow>=13.0.0",
    "pytz>=2023.3",
    "redis>=7.0,<9",
    "Flask-Babel>=3.0",
    "qdrant-client==1.20.0",
    "pdfplumber>=0.11.0",
    "reportlab>=4.2",
    "python-docx==1.2.0",
    "olefile>=0.47",
    "python-magic==0.4.27",
    "ebooklib>=0.17",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.2",
    "python-pptx>=1.0.2",
    "odfpy>=1.4.0",
    "striprtf>=0.0.26",
    "gguf>=0.10.0",
    "psycopg2-binary>=2.9.9",
    "pymorphy3>=2.0.6",
    "pendulum>=3.0.0",
    "trafilatura>=2.0.0",
    "networkx>=3.2",
    "flasgger==0.9.7.1",
]

[project.optional-dependencies]
test = [
    # pytest 9.2 adds TestReport._id (a NodeId object) that pytest-forked 1.7.5
    # cannot marshal: every forked test then dies with "EXITED with status 3".
    # The ceiling lifts when the forker handles it (latest plugin is 1.7.5).
    "pytest>=9.0.3,<9.2",
    "pytest-flask>=1.3.0",
    "pytest-cov>=6.0",
    "pytest-forked",
]
dev = [
    "ruff>=0.15.0",
    "mypy>=2.0.0",
    "types-requests",
    "types-redis",
    "types-pytz",
]
load-test = [
    "locust>=2.20.1",
]

[project.scripts]
flai = "wsgi:app"

[tool.setuptools.packages.find]
include = ["app*", "modules*"]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "translations",
    "*.js",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    ]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # do not perform function calls in argument defaults (common in Flask)
    "E402",   # module level import not at top (required for test setup)
    "PTH",    # flake8-use-pathlib — ~200 stylistic warnings, non-critical
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__ are expected

[tool.ruff.lint.isort]
known-first-party = ["app", "modules"]

[tool.mypy]
# The image runs Python 3.11, but numpy 2.5 ships stubs written with PEP 695 syntax
# (`type X = ...`), which mypy can only parse with a 3.12 target. CI runs
# `python -m compileall` on 3.11 as the guard that the code still runs where it ships.
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
ignore_missing_imports = true
exclude = ["tests/", "venv/", "translations/"]

# The check runs and blocks CI, but the backlog is real: these modules still carry the errors
# it found the day it was switched on. Removing a line is how a module gets fixed — the
# release gate (check_mypy_ratchet.py) rejects an entry that no longer reports anything, so
# this list can only shrink.
[[tool.mypy.overrides]]
module = [
    "app.api_bridge",
    "app.cli",
    "app.crawler_guard",
    "app.database",
    "app.documents_write",
    "app.graph_extract",
    "app.graph_rag",
    "app.lemmatizer",
    "app.llama_swap_config",
    "app.mcp_registry",
    "app.model_hub",
    "app.monitoring.archive",
    "app.monitoring.queries",
    "app.monitoring.snapshots",
    "app.monitoring.system",
    "app.queue",
    "app.rag_eval",
    "app.resource_manager",
    "app.routes.admin",
    "app.routes.messages",
    "app.routes.scheduler",
    "app.routes.tasks",
    "app.scheduler",
    "app.scheduler_tools",
    "app.settings_store",
    "app.tasks.answer_images",
    "app.tasks.events",
    "app.tasks.executor",
    "app.tasks.runner",
    "app.tavily_keys",
    "app.tools",
    "app.universal_mode",
    "app.utils",
    "modules.history",
    "modules.rag",
    "modules.sd_cpp",
    "modules.search",
    "modules.video",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
norecursedirs = ["load", "load/*"]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (with mocked services)",
    "e2e: End-to-end tests (requires running services)",
    "slow: Slow running tests (>1 second)",
    "requires_db: Tests that require database access",
    "requires_redis: Tests that require Redis access",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning:flask_limiter",
    "ignore::UserWarning:qdrant_client",
]
