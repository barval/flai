use_default_settings: true

search:
  formats:
    - html
    - json

server:
  secret_key: "flai-searxng-change-me-in-production"
  bind_address: "0.0.0.0"
  limiter: false

ui:
  static_use_hash: true

engines:
  - name: google news
  - name: bing news
  - name: yahoo news
  - name: yahoo
    disabled: false
  # bing returns decoy/help-page garbage in the top of merged results
  # (Google support pages in random languages) when rate-limited, drowning
  # out the news aggregators. bing news below remains enabled.
  - name: bing
    disabled: true
  - name: mojeek
    disabled: false
  - name: marginalia
    disabled: false
  - name: presearch
    disabled: false
  - name: qwant
    disabled: false
  - name: yandex
    disabled: false
  - name: swisscows news
    disabled: false
