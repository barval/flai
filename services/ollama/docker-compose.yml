version: '3.8'

# Ollama Standalone Service
# Use this docker-compose for deploying Ollama on a separate server
# For GPU acceleration, use docker-compose.gpu.yml instead

services:
  ollama:
    image: ollama/ollama:latest
    container_name: flai-ollama
    ports:
      - "${OLLAMA_HOST:-0.0.0.0:11434}:11434"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-0.0.0.0:11434}
      - OLLAMA_ORIGINS=${OLLAMA_ORIGINS:-*}
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - flai_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  ollama_models:
    driver: local

networks:
  flai_network:
    driver: bridge
