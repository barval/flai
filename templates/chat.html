{% extends "base.html" %}

{% block content %}
<div class="chat-container">
    <!-- Левая колонка – сеансы -->
    <div class="sessions-sidebar">
        <div class="sessions-header">
            <h2>Сеансы (<span id="sessions-count">{{ sessions|length }}</span>)</h2>
            <button id="new-session-button" class="new-session-button">➕</button>
        </div>
        
        <div class="sessions-list" id="sessions-list">
            {% for s in sessions %}
            <div class="session-item {% if s.id == current_session %}active{% endif %}" data-session-id="{{ s.id }}">
                <div class="session-content">
                    <div class="session-info">
                        <div class="session-title">{{ s.title }}</div>
                        <div class="session-date">{{ s.updated_at[:19].replace('T', ' ') }}</div>
                    </div>
                    <button class="delete-session-button" title="Удалить сеанс">🗑️</button>
                </div>
            </div>
            {% endfor %}
        </div>
        
        <!-- Панель статуса сервисов -->
        {% include "components/service_status.html" %}
    </div>
    
    <!-- Правая часть – чат -->
    <div class="chat-main">
        <div class="chat-header">
            <h2>Чат</h2>
            <div class="context-info-container">
                <div id="context-info" class="context-info">Сообщений: 0</div>
                <button id="save-chat-button" class="save-chat-button" title="Сохранить как HTML">💾</button>
                <button id="clear-context-button" class="clear-context-button">🗑️</button>
                <button id="show-status-button" class="status-toggle-button">📊 Статус</button>
            </div>
        </div>
        
        <!-- Панель состояния запросов -->
        <div class="requests-status-panel" id="requests-status-panel" style="display: none;">
            <div class="status-header">
                <h3>Мои запросы</h3>
                <button class="refresh-status" onclick="refreshRequestsStatus()">↻</button>
            </div>
            
            <!-- Системная нагрузка -->
            <div class="system-load-container">
                <div class="system-load" id="system-load"></div>
            </div>

            <!-- Текущий обрабатываемый запрос -->
            <div id="processing-request" class="processing-request" style="display: none;">
                <div class="request-badge processing">
                    <span class="spinner-small"></span>
                    <span id="processing-text"></span>
                </div>
            </div>
            
            <!-- Очередь запросов -->
            <div id="queued-requests" class="queued-requests" style="display: none;">
                <h4>В очереди:</h4>
                <div id="queued-list"></div>
            </div>
            
            <!-- Недавно выполненные -->
            <div id="recent-completed" class="recent-completed" style="display: none;">
                <h4>Недавние ответы:</h4>
                <div id="completed-list"></div>
            </div>
        </div>
        
        <!-- Контейнер для предупреждений о статусе сервисов -->
        <div id="service-warnings" class="service-warnings"></div>
        
        <div class="chat-messages" id="chat-messages"></div>
        
        <!-- Превью файлов -->
        <div id="file-preview-container" style="display: none;">
            <div>
                <span id="file-preview-name"></span>
                <span id="file-preview-size"></span>
                <button id="remove-file-button">✕</button>
            </div>
        </div>
        
        <!-- Модальное окно для просмотра изображений -->
        <div id="image-modal" class="image-modal" onclick="closeImageModal()">
            <span class="image-modal-close">&times;</span>
            <img class="image-modal-content" id="modal-image">
            <div id="modal-caption"></div>
        </div>
        
        <!-- Поле ввода -->
        <div class="message-input">
            <input type="text" id="message-input" placeholder="Введите сообщение..." autocomplete="off">
            <input type="file" id="file-input" accept="image/*,audio/*,.pdf,.doc,.docx,.txt" style="display: none;">
            <button id="attach-file-button">📎</button>
            <button id="send-button">Отправить</button>
        </div>
    </div>
</div>

<!-- Подключение модулей JavaScript -->
<script src="{{ url_for('static', filename='js/marked.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/utils.js') }}"></script>
<script src="{{ url_for('static', filename='js/state.js') }}"></script>
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/ui.js') }}"></script>
<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
<script src="{{ url_for('static', filename='js/service_status.js') }}"></script>
{% endblock %}
