{% extends "base.html" %}

{% block content %}
<div class="chat-container">
    <!-- Левая колонка – сеансы -->
    <div class="sessions-sidebar">
        <div class="sessions-header">
            <h2>Сеансы (<span id="sessions-count">{{ sessions|length }}</span>)</h2>
            <button id="new-session-button" class="new-session-button">➕</button>
        </div>
        
        <div class="sessions-list" id="sessions-list">
            {% for s in sessions %}
            <div class="session-item {% if s.id == current_session %}active{% endif %}" data-session-id="{{ s.id }}">
                <div class="session-content">
                    <div class="session-info">
                        <div class="session-title">{{ s.title }}</div>
                        <div class="session-date">{{ s.updated_at[:19].replace('T', ' ') }}</div>
                    </div>
                    <button class="delete-session-button" title="Удалить сеанс">🗑️</button>
                </div>
            </div>
            {% endfor %}
        </div>
        
        <!-- Добавляем панель статуса сервисов -->
        {% include "components/service_status.html" %}
    </div>
    
    <!-- Правая часть – чат -->
    <div class="chat-main">
        <div class="chat-header">
            <h2>Чат</h2>
            <div class="context-info-container">
                <div id="context-info" class="context-info">Сообщений: 0</div>
                <button id="save-chat-button" class="save-chat-button" title="Сохранить как HTML">💾</button>
                <button id="clear-context-button" class="clear-context-button">🗑️</button>
                <button id="show-status-button" class="status-toggle-button" onclick="toggleRequestsPanel()">📊 Статус</button>
            </div>
        </div>
        
        <!-- Панель состояния запросов -->
        <div class="requests-status-panel" id="requests-status-panel" style="display: none;">
            <div class="status-header">
                <h3>Мои запросы</h3>
                <button class="refresh-status" onclick="refreshRequestsStatus()">↻</button>
            </div>
            
            <!-- Системная нагрузка - всегда вверху -->
            <div class="system-load-container">
                <div class="system-load" id="system-load"></div>
            </div>

            <!-- Текущий обрабатываемый запрос -->
            <div id="processing-request" class="processing-request" style="display: none;">
                <div class="request-badge processing">
                    <span class="spinner-small"></span>
                    <span id="processing-text"></span>
                </div>
            </div>
            
            <!-- Очередь запросов -->
            <div id="queued-requests" class="queued-requests" style="display: none;">
                <h4>В очереди:</h4>
                <div id="queued-list"></div>
            </div>
            
            <!-- Недавно выполненные -->
            <div id="recent-completed" class="recent-completed" style="display: none;">
                <h4>Недавние ответы:</h4>
                <div id="completed-list"></div>
            </div>
        </div>
        
        <!-- Добавляем контейнер для предупреждений о статусе сервисов -->
        <div id="service-warnings" class="service-warnings"></div>
        
        <div class="chat-messages" id="chat-messages">
            <!-- История загрузится через JS -->
        </div>
        
        <!-- Превью файлов -->
        <div id="file-preview-container" style="display: none;">
            <div>
                <span id="file-preview-name"></span>
                <span id="file-preview-size"></span>
                <button id="remove-file-button">✕</button>
            </div>
        </div>
        
        <!-- Модальное окно для просмотра изображений в полном размере -->
        <div id="image-modal" class="image-modal" onclick="closeImageModal()">
            <span class="image-modal-close">&times;</span>
            <img class="image-modal-content" id="modal-image">
            <div id="modal-caption"></div>
        </div>
        
        <!-- Поле ввода -->
        <div class="message-input">
            <input type="text" id="message-input" placeholder="Введите сообщение..." autocomplete="off">
            <input type="file" id="file-input" accept="image/*,audio/*,.pdf,.doc,.docx,.txt" style="display: none;">
            <button id="attach-file-button">📎</button>
            <button id="send-button">Отправить</button>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/marked.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/service_status.js') }}"></script>
<script>
    // Глобальные переменные
    let currentSessionId = "{{ current_session }}";
    let isSending = false;
    let attachedFile = null;
    let pendingRequests = {};
    let defaultModelName = 'qwen3-vl:8b-instruct';
    let sessionsData = {};
    let syncInterval = null;
    let newMessageIndicators = {};
    let statusRefreshInterval = null;

    // -------------------------------
    // Вспомогательные функции
    // -------------------------------
    function pad(n) { 
        return n.toString().padStart(2, '0'); 
    }

    // -------------------------------
    // Форматирование размера файла
    // -------------------------------
    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Б';
        if (!bytes) return '';
        
        const k = 1024;
        const sizes = ['Б', 'КБ', 'МБ', 'ГБ'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    // -------------------------------
    // Декодирование HTML-сущностей
    // -------------------------------
    function decodeHtmlEntities(text) {
        if (!text) return '';
        const textarea = document.createElement('textarea');
        textarea.innerHTML = text;
        return textarea.value;
    }

    // -------------------------------
    // Экранирование HTML
    // -------------------------------
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // -------------------------------
    // Форматирование даты
    // -------------------------------
    function formatFullDateTime(ts) {
        if (!ts) return '';
        try {
            const date = new Date(ts);
            if (isNaN(date.getTime())) {
                return ts.replace('T', ' ').slice(0, 19);
            }
            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            const seconds = date.getSeconds().toString().padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        } catch (e) {
            return ts.replace('T', ' ').slice(0, 19);
        }
    }

    // -------------------------------
    // Функции для работы с модальным окном изображений
    // -------------------------------
    function openImageModal(imgSrc, imgAlt) {
        const modal = document.getElementById('image-modal');
        const modalImg = document.getElementById('modal-image');
        const captionText = document.getElementById('modal-caption');
        
        modal.style.display = "block";
        modalImg.src = imgSrc;
        captionText.innerHTML = imgAlt;
    }

    function closeImageModal() {
        const modal = document.getElementById('image-modal');
        modal.style.display = "none";
    }

    // -------------------------------
    // Функция для показа предупреждений о статусе сервисов
    // -------------------------------
    function showServiceWarning(message, type = 'warning') {
        const warningsDiv = document.getElementById('service-warnings');
        if (!warningsDiv) return;
        
        const warning = document.createElement('div');
        warning.className = `service-warning ${type}`;
        warning.innerHTML = `
            <span class="warning-icon">⚠️</span>
            <span class="warning-text">${message}</span>
            <button class="close-warning" onclick="this.parentElement.remove()">✕</button>
        `;
        
        warningsDiv.appendChild(warning);
        
        // Автоматически скрываем через 10 секунд
        setTimeout(() => {
            if (warning.parentElement) {
                warning.remove();
            }
        }, 10000);
    }

    // -------------------------------
    // Обновление счетчика сообщений
    // -------------------------------
    function updateMessageCount() {
        const count = document.querySelectorAll('.user-message, .assistant-message, .bot-message').length;
        document.getElementById('context-info').textContent = `Сообщений: ${count}`;
    }

    // -------------------------------
    // Управление индикаторами новых сообщений
    // -------------------------------
    function setNewMessageIndicator(sessionId, show, isError = false) {
        if (show) {
            // Сохраняем не только факт наличия, но и тип
            newMessageIndicators[sessionId] = { hasNew: true, isError: isError };
        } else {
            delete newMessageIndicators[sessionId];
        }
        updateIndicatorsInDOM();
    }

    function updateIndicatorsInDOM() {
        document.querySelectorAll('.session-item').forEach(el => {
            const sessionId = el.dataset.sessionId;
            const titleElement = el.querySelector('.session-title');
            let indicator = el.querySelector('.new-message-indicator');
            let errorIndicator = el.querySelector('.error-message-indicator');

            // Удаляем старые индикаторы
            if (indicator) indicator.remove();
            if (errorIndicator) errorIndicator.remove();

            const indicatorData = newMessageIndicators[sessionId];
            if (indicatorData && indicatorData.hasNew && sessionId !== currentSessionId) {
                if (indicatorData.isError) {
                    // Создаем красный индикатор для ошибки
                    errorIndicator = document.createElement('span');
                    errorIndicator.className = 'error-message-indicator';
                    errorIndicator.textContent = '●';
                    errorIndicator.title = 'Произошла ошибка';
                    titleElement.appendChild(errorIndicator);
                } else {
                    // Создаем обычный синий индикатор для нового сообщения
                    indicator = document.createElement('span');
                    indicator.className = 'new-message-indicator';
                    indicator.textContent = '●';
                    titleElement.appendChild(indicator);
                }
            }
        });
    }

    function updateSessionWithRequestStatus(sessionId, status) {
        const sessionItem = document.querySelector(`.session-item[data-session-id="${sessionId}"]`);
        if (!sessionItem) return;
        
        // Удаляем старые индикаторы
        const oldIndicator = sessionItem.querySelector('.request-status-indicator');
        if (oldIndicator) oldIndicator.remove();
        
        if (status === 'processing') {
            const indicator = document.createElement('span');
            indicator.className = 'request-status-indicator processing';
            indicator.innerHTML = '⚡';
            indicator.title = 'Запрос обрабатывается';
            sessionItem.querySelector('.session-title').appendChild(indicator);
        } else if (status === 'queued') {
            const indicator = document.createElement('span');
            indicator.className = 'request-status-indicator queued';
            indicator.innerHTML = '⏳';
            indicator.title = 'Запрос в очереди';
            sessionItem.querySelector('.session-title').appendChild(indicator);
        }
    }

    function clearIndicatorForSession(sessionId) {
        if (sessionId === currentSessionId) {
            setNewMessageIndicator(sessionId, false);
        }
    }

    // -------------------------------
    // Загрузка списка сеансов с сервера
    // -------------------------------
    function loadSessionsFromServer() {
        return fetch('/api/sessions')
            .then(res => res.json())
            .then(sessions => {
                let updated = false;
                let titlesChanged = false;
                
                // Обновляем данные в хранилище
                sessions.forEach(s => {
                    if (!sessionsData[s.id]) {
                        sessionsData[s.id] = {
                            title: s.title,
                            updated_at: s.updated_at
                        };
                        updated = true;
                    } else if (sessionsData[s.id].title !== s.title) {
                        sessionsData[s.id].title = s.title;
                        sessionsData[s.id].updated_at = s.updated_at;
                        updated = true;
                        titlesChanged = true;
                    } else if (sessionsData[s.id].updated_at !== s.updated_at) {
                        sessionsData[s.id].updated_at = s.updated_at;
                        updated = true;
                    }
                });
                
                // Удаляем из хранилища сеансы, которых больше нет
                Object.keys(sessionsData).forEach(id => {
                    if (!sessions.find(s => s.id === id)) {
                        delete sessionsData[id];
                        delete newMessageIndicators[id];
                        updated = true;
                    }
                });
                
                // Если были изменения, обновляем отображение
                if (updated) {
                    updateSessionsList(sessions, titlesChanged);
                }
                
                return sessions;
            })
            .catch(err => console.error('Ошибка загрузки сеансов:', err));
    }

    // Принудительное обновление списка сеансов
    function forceRefreshSessions() {
        loadSessionsFromServer().then(() => {
            console.log('Список сеансов обновлен');
        });
    }

    // -------------------------------
    // Обновление списка сеансов в DOM
    // -------------------------------
    function updateSessionsList(sessions, preserveIndicators = true) {
        const sessionsList = document.getElementById('sessions-list');
        const currentActiveId = currentSessionId;
        
        // Используем данные из хранилища
        sessions.forEach(s => {
            if (sessionsData[s.id]) {
                s.title = sessionsData[s.id].title;
                s.updated_at = sessionsData[s.id].updated_at;
            }
        });
        
        // Сортируем по дате обновления (новые сверху)
        sessions.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
        
        let html = '';
        sessions.forEach(s => {
            const isActive = s.id === currentActiveId ? 'active' : '';
            const dateStr = s.updated_at ? s.updated_at.replace('T', ' ').substring(0, 19) : '';
            const indicatorData = newMessageIndicators[s.id];
            const hasIndicator = indicatorData && indicatorData.hasNew && s.id !== currentActiveId;
            const isError = indicatorData && indicatorData.isError;
            
            html += `
                <div class="session-item ${isActive}" data-session-id="${s.id}">
                    <div class="session-content">
                        <div class="session-info">
                            <div class="session-title">${escapeHtml(s.title)}${hasIndicator ? (isError ? '<span class="error-message-indicator">●</span>' : '<span class="new-message-indicator">●</span>') : ''}</div>
                            <div class="session-date">${dateStr}</div>
                        </div>
                        <button class="delete-session-button" title="Удалить сеанс">🗑️</button>
                    </div>
                </div>
            `;
        });
        
        sessionsList.innerHTML = html;
        document.getElementById('sessions-count').textContent = sessions.length;
        
        // Перепривязываем обработчики событий
        attachSessionEventHandlers();
        
        // После обновления списка, обновляем статусы запросов
        refreshRequestsStatus();
    }

    // -------------------------------
    // Привязка обработчиков событий к элементам сеансов
    // -------------------------------
    function attachSessionEventHandlers() {
        // Клик по сеансу (но не по кнопке удаления)
        document.querySelectorAll('.session-item').forEach(el => {
            el.addEventListener('click', function(e) {
                if (e.target.closest('.delete-session-button')) {
                    return;
                }
                
                const sessionId = this.dataset.sessionId;
                if (sessionId === currentSessionId) return;
                
                // Очищаем индикатор для этого сеанса перед переключением
                setNewMessageIndicator(sessionId, false);
                
                document.querySelectorAll('.session-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                
                switchSession(sessionId);
            });
        });
        
        // Кнопки удаления сеансов
        document.querySelectorAll('.delete-session-button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const sessionItem = this.closest('.session-item');
                const sessionId = sessionItem.dataset.sessionId;
                const sessionTitle = sessionItem.querySelector('.session-title').textContent;
                const sessionDate = sessionItem.querySelector('.session-date').textContent;
                
                if (confirm(`Удалить сеанс "${sessionTitle}" от ${sessionDate}?`)) {
                    deleteSession(sessionId);
                }
            });
        });
    }

    // -------------------------------
    // Запуск периодической синхронизации
    // -------------------------------
    function startSyncInterval() {
        if (syncInterval) {
            clearInterval(syncInterval);
        }
        // Синхронизируем каждые 3 секунды
        syncInterval = setInterval(() => {
            loadSessionsFromServer();
        }, 3000);
    }

    // -------------------------------
    // Инициализация
    // -------------------------------
    document.addEventListener('DOMContentLoaded', function() {
        // Загружаем список сеансов с сервера
        loadSessionsFromServer().then(() => {
            // Загружаем сообщения текущего сеанса
            loadMessages(currentSessionId);
            // Запускаем периодическую синхронизацию
            startSyncInterval();
        });
        
        // Новая беседа
        document.getElementById('new-session-button').addEventListener('click', createNewSession);
        
        // Отправка
        document.getElementById('send-button').addEventListener('click', sendMessage);
        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // Прикрепление файлов
        document.getElementById('attach-file-button').addEventListener('click', function() {
            document.getElementById('file-input').click();
        });
        
        document.getElementById('file-input').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                attachedFile = e.target.files[0];
                const preview = document.getElementById('file-preview-container');
                document.getElementById('file-preview-name').textContent = attachedFile.name;
                
                // Добавляем отображение размера файла в превью
                const fileSize = formatFileSize(attachedFile.size);
                const sizeSpan = document.getElementById('file-preview-size');
                if (sizeSpan) {
                    sizeSpan.textContent = ` (${fileSize})`;
                }
                
                preview.style.display = 'block';
            }
        });
        
        document.getElementById('remove-file-button').addEventListener('click', function() {
            attachedFile = null;
            document.getElementById('file-input').value = '';
            document.getElementById('file-preview-container').style.display = 'none';
        });
        
        // Очистка контекста
        document.getElementById('clear-context-button').addEventListener('click', function() {
            if (confirm('Очистить всю переписку в этом сеансе?')) {
                clearHistory();
            }
        });
        
        // Сохранение чата
        document.getElementById('save-chat-button').addEventListener('click', saveChatAsHTML);
        
        // Закрытие модального окна по ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeImageModal();
            }
        });

        // Периодическое обновление списка сеансов (каждые 5 секунд)
        setInterval(forceRefreshSessions, 5000);
        
        // Инициализируем монитор статусов сервисов
        window.serviceMonitor = new ServiceStatusMonitor();
    });

    // -------------------------------
    // Загрузка сообщений сеанса
    // -------------------------------
    function loadMessages(sessionId) {
        return fetch(`/api/sessions/${sessionId}/messages`)
            .then(res => res.json())
            .then(messages => {
                const container = document.getElementById('chat-messages');
                container.innerHTML = '';
                
                // Получаем информацию о сессии для модели по умолчанию
                fetch(`/api/sessions/${sessionId}/model-info`)
                    .then(res => res.json())
                    .then(data => {
                        defaultModelName = data.model_name || 'qwen3-vl:8b-instruct-q4_K_M';
                    })
                    .catch(err => console.error('Error loading model info:', err));
                
                // Группируем сообщения для вычисления времени ответа
                let lastUserMessage = null;
                
                messages.forEach((msg) => {
                    if (msg.role === 'user') {
                        lastUserMessage = msg;
                        displayMessage(
                            msg.role, 
                            msg.content, 
                            msg.file_data, 
                            msg.file_type, 
                            msg.file_name, 
                            msg.timestamp,
                            null,  // responseTime
                            null,  // modelName (будет определено позже)
                            null,  // mmTime
                            null,  // genTime
                            null,  // mmModel
                            null   // genModel
                        );
                    } else if (msg.role === 'assistant') {
                        // Вычисляем разницу во времени, если есть предыдущее сообщение пользователя
                        let responseTime = null;
                        if (lastUserMessage) {
                            const userTime = new Date(lastUserMessage.timestamp);
                            const assistantTime = new Date(msg.timestamp);
                            const diffSeconds = (assistantTime - userTime) / 1000;
                            responseTime = Math.round(diffSeconds * 10) / 10;
                        }
                        
                        // Проверяем, есть ли сохранённое время ответа в БД
                        if (msg.response_time) {
                            // Если response_time - объект (для генерации изображений)
                            if (typeof msg.response_time === 'object') {
                                responseTime = msg.response_time;
                            } 
                            // Если response_time - число или строка с числом
                            else if (!isNaN(parseFloat(msg.response_time))) {
                                responseTime = parseFloat(msg.response_time);
                            }
                        }
                        
                        // Проверяем, есть ли раздельное время в сообщении из БД
                        let mmTime = msg.mm_time;
                        let genTime = msg.gen_time;
                        let mmModel = msg.mm_model;
                        let genModel = msg.gen_model;
                        
                        // Если есть раздельное время, создаем объект responseTime
                        if (mmTime && genTime) {
                            responseTime = {
                                mm_time: parseFloat(mmTime),
                                gen_time: parseFloat(genTime),
                                mm_model: mmModel || 'неизвестно',
                                gen_model: genModel || 'неизвестно'
                            };
                        }
                        
                        displayMessage(
                            msg.role, 
                            msg.content,
                            msg.file_data, 
                            msg.file_type, 
                            msg.file_name, 
                            msg.timestamp,
                            responseTime,
                            msg.model_name || defaultModelName,
                            mmTime,
                            genTime,
                            mmModel,
                            genModel
                        );
                        
                        lastUserMessage = null; // Сбрасываем после пары
                    }
                });
                
                updateMessageCount();
                container.scrollTop = container.scrollHeight;
                
                // Очищаем индикатор для этого сеанса
                setNewMessageIndicator(sessionId, false);
            });
    }

    // -------------------------------
    // Отображение одного сообщения
    // -------------------------------
    function displayMessage(role, content, fileData, fileType, fileName, timestamp, responseTime, modelName, mmTime, genTime, mmModel, genModel) {
        console.log('displayMessage called with:', {  // Добавляем отладку
            role,
            responseTime,
            modelName,
            type: typeof responseTime,
            value: responseTime
        });
        
        const container = document.getElementById('chat-messages');
        const msgDiv = document.createElement('div');
        
        // Устанавливаем правильный класс в зависимости от роли
        if (role === 'user') {
            msgDiv.className = 'user-message';
        } else {
            msgDiv.className = 'assistant-message';
            msgDiv.classList.add('bot-message');
        }
        
        if (!timestamp) {
            timestamp = new Date().toISOString();
        }
        
        msgDiv.setAttribute('data-timestamp', timestamp);
        
        // Для сообщений ассистента сохраняем дополнительную информацию
        if (role === 'assistant') {
            if (modelName) {
                msgDiv.dataset.modelName = modelName;
            }
            if (responseTime && typeof responseTime === 'object') {
                if (responseTime.mm_time) msgDiv.dataset.mmTime = responseTime.mm_time;
                if (responseTime.gen_time) msgDiv.dataset.genTime = responseTime.gen_time;
                if (responseTime.mm_model) msgDiv.dataset.mmModel = responseTime.mm_model;
                if (responseTime.gen_model) msgDiv.dataset.genModel = responseTime.gen_model;
            } else if (mmTime && genTime) {
                msgDiv.dataset.mmTime = mmTime;
                msgDiv.dataset.genTime = genTime;
                msgDiv.dataset.mmModel = mmModel || 'неизвестно';
                msgDiv.dataset.genModel = genModel || 'неизвестно';
            }
        }
        
        let timeDisplay = formatFullDateTime(timestamp);
        
        // Информация о файле для пользователя
        if (role === 'user' && fileName && fileData) {
            const base64Length = fileData.length;
            const fileSizeBytes = Math.round((base64Length * 3) / 4);
            const fileSize = formatFileSize(fileSizeBytes);
            timeDisplay += ` <span class="file-info">[📎 ${fileName}, ${fileSize}]</span>`;
            
            if (fileType && fileType.startsWith('image/')) {
                timeDisplay += ` <a href="data:${fileType};base64,${fileData}" 
                                    download="${fileName || 'image.jpg'}" 
                                    class="download-link-inline" 
                                    title="Скачать изображение"
                                    onclick="event.stopPropagation()">⬇️</a>`;
            }
        }
        
        // Информация о файле для ассистента
        if (role === 'assistant' && fileName && fileData) {
            const base64Length = fileData.length;
            const fileSizeBytes = Math.round((base64Length * 3) / 4);
            const fileSize = formatFileSize(fileSizeBytes);
            timeDisplay += ` <span class="file-info">[📎 ${fileName}, ${fileSize}]</span>`;
            
            if (fileType && fileType.startsWith('image/')) {
                timeDisplay += ` <a href="data:${fileType};base64,${fileData}" 
                                    download="${fileName || 'generated_image.jpg'}" 
                                    class="download-link-inline" 
                                    title="Скачать изображение"
                                    onclick="event.stopPropagation()">⬇️</a>`;
            }
        }
        
        // Добавляем время ответа и информацию о модели для сообщений ассистента
        if (role === 'assistant') {
            console.log('Processing assistant message, responseTime:', responseTime); // Отладка
            
            // Проверяем наличие responseTime
            if (responseTime !== undefined && responseTime !== null) {
                if (typeof responseTime === 'object') {
                    // Объект с раздельным временем
                    if (responseTime.mm_time && responseTime.gen_time) {
                        const mmTime = parseFloat(responseTime.mm_time).toFixed(1);
                        const genTime = parseFloat(responseTime.gen_time).toFixed(1);
                        const mmModel = responseTime.mm_model || 'неизвестно';
                        const genModel = responseTime.gen_model || 'неизвестно';
                        
                        timeDisplay += `<br><span class="model-response-info">(Обработано: ${mmModel} за ${mmTime} сек)</span>`;
                        timeDisplay += `<br><span class="model-response-info">(Сгенерировано: ${genModel} за ${genTime} сек)</span>`;
                    } else if (responseTime.mm_time) {
                        const mmTime = parseFloat(responseTime.mm_time).toFixed(1);
                        const mmModel = responseTime.mm_model || 'неизвестно';
                        timeDisplay += `<br><span class="model-response-info">(Обработано: ${mmModel} за ${mmTime} сек)</span>`;
                    } else if (responseTime.gen_time) {
                        const genTime = parseFloat(responseTime.gen_time).toFixed(1);
                        const genModel = responseTime.gen_model || 'неизвестно';
                        timeDisplay += `<br><span class="model-response-info">(Сгенерировано: ${genModel} за ${genTime} сек)</span>`;
                    }
                } 
                else if (typeof responseTime === 'number' || !isNaN(parseFloat(responseTime))) {
                    // Числовое значение - обычное время ответа
                    const timeValue = typeof responseTime === 'number' ? responseTime : parseFloat(responseTime);
                    console.log('Displaying numeric response time:', timeValue); // Отладка
                    
                    if (timeValue > 0) {
                        let fullModelName = modelName || defaultModelName || 'qwen3-vl:8b-instruct-q4_K_M';
                        timeDisplay += ` <span class="model-response-info">(ответ: ${fullModelName} за ${timeValue.toFixed(1)} сек)</span>`;
                    } else {
                        let fullModelName = modelName || defaultModelName || 'qwen3-vl:8b-instruct-q4_K_M';
                        timeDisplay += ` <span class="model-response-info">(модель: ${fullModelName})</span>`;
                    }
                }
                else {
                    // responseTime есть, но непонятного типа
                    console.warn('Unknown responseTime type:', typeof responseTime, responseTime);
                    let fullModelName = modelName || defaultModelName || 'qwen3-vl:8b-instruct-q4_K_M';
                    timeDisplay += ` <span class="model-response-info">(модель: ${fullModelName})</span>`;
                }
            } else {
                // Нет responseTime - показываем только модель
                console.log('No responseTime, showing only model'); // Отладка
                let fullModelName = modelName || defaultModelName || 'qwen3-vl:8b-instruct-q4_K_M';
                timeDisplay += ` <span class="model-response-info">(модель: ${fullModelName})</span>`;
            }
        }
        
        let html = `<small>${timeDisplay}</small>`;
        
        // Обработка текста
        if (typeof content === 'string') {
            if (content.startsWith('[')) {
                try {
                    const parts = JSON.parse(content);
                    let textContent = '';
                    parts.forEach(part => {
                        if (part.type === 'text') {
                            textContent += part.text + '\n';
                        }
                    });
                    if (textContent) {
                        const escapedText = escapeHtml(textContent.trim());
                        html += `<div class="message-content">${marked.parse(escapedText)}</div>`;
                    }
                } catch (e) {
                    if (role === 'assistant') {
                        const decodedText = decodeHtmlEntities(content);
                        html += `<div class="message-content">${marked.parse(decodedText)}</div>`;
                    } else {
                        const escapedText = escapeHtml(content);
                        html += `<div class="message-content">${marked.parse(escapedText)}</div>`;
                    }
                }
            } else {
                if (role === 'assistant') {
                    const decodedText = decodeHtmlEntities(content);
                    html += `<div class="message-content">${marked.parse(decodedText)}</div>`;
                } else {
                    const escapedText = escapeHtml(content);
                    html += `<div class="message-content">${marked.parse(escapedText)}</div>`;
                }
            }
        }
        
        // Файл (если есть)
        if (fileData) {
            if (fileType && fileType.startsWith('image/')) {
                html += `
                    <div class="image-container">
                        <img src="data:${fileType};base64,${fileData}" 
                            class="attached-image" 
                            alt="${fileName || 'attached image'}"
                            title="Нажмите для увеличения"
                            onclick="openImageModal(this.src, '${fileName || 'Изображение'}')">
                    </div>
                `;
            } else if (fileType && fileType.startsWith('audio/')) {
                html += `<audio controls src="data:${fileType};base64,${fileData}"></audio>`;
            } else {
                html += `<div class="attached-file">
                            <span class="file-icon">📄</span>
                            <a href="data:${fileType};base64,${fileData}" download="${fileName}">${fileName}</a>
                        </div>`;
            }
        }
        
        msgDiv.innerHTML = html;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
        
        updateMessageCount();
        
        setTimeout(() => {
            addCopyButtonsToMessage(msgDiv);
        }, 50);
    }

    // -------------------------------
    // Переключение сеанса
    // -------------------------------
    function switchSession(sessionId) {
        fetch(`/api/sessions/${sessionId}/switch`, { method: 'POST' })
            .then(res => res.json())
            .then(() => {
                currentSessionId = sessionId;
                loadMessages(sessionId);
                
                document.querySelectorAll('.session-item').forEach(el => {
                    if (el.dataset.sessionId === sessionId) {
                        el.classList.add('active');
                    } else {
                        el.classList.remove('active');
                    }
                });
                
                // Обновляем индикаторы после переключения
                updateIndicatorsInDOM();
            });
    }

    // -------------------------------
    // Создание нового сеанса
    // -------------------------------
    function createNewSession() {
        fetch('/api/sessions/new', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                // Добавляем в хранилище данных
                sessionsData[data.id] = {
                    title: data.title,
                    updated_at: new Date().toISOString()
                };
                
                // НЕМЕДЛЕННО убираем выделение со всех сеансов
                document.querySelectorAll('.session-item').forEach(el => {
                    el.classList.remove('active');
                });
                
                // НЕМЕДЛЕННО устанавливаем новый currentSessionId
                currentSessionId = data.id;
                
                // Перезагружаем список сеансов с сервера
                loadSessionsFromServer().then(() => {
                    document.getElementById('chat-messages').innerHTML = '';
                    updateMessageCount();
                    defaultModelName = 'qwen3-vl:8b-instruct';
                    setNewMessageIndicator(data.id, false);
                });
            });
    }

    // -------------------------------
    // Обновление заголовка сеанса
    // -------------------------------
    function updateSessionTitle(sessionId, newTitle) {
        // Обновляем в хранилище данных
        if (sessionsData[sessionId]) {
            sessionsData[sessionId].title = newTitle;
            sessionsData[sessionId].updated_at = new Date().toISOString();
        }
        
        // Находим элемент сеанса
        const sessionItem = document.querySelector(`.session-item[data-session-id="${sessionId}"]`);
        if (!sessionItem) return;
        
        const titleElement = sessionItem.querySelector('.session-title');
        if (titleElement) {
            titleElement.innerHTML = escapeHtml(newTitle);
            
            // Сохраняем индикатор, если есть
            const indicatorData = newMessageIndicators[sessionId];
            if (indicatorData && indicatorData.hasNew && sessionId !== currentSessionId) {
                if (indicatorData.isError) {
                    const errorIndicator = document.createElement('span');
                    errorIndicator.className = 'error-message-indicator';
                    errorIndicator.textContent = '●';
                    titleElement.appendChild(errorIndicator);
                } else {
                    const indicator = document.createElement('span');
                    indicator.className = 'new-message-indicator';
                    indicator.textContent = '●';
                    titleElement.appendChild(indicator);
                }
            }
        }
        
        // Обновляем дату
        const now = new Date();
        const formattedDate = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        const dateElement = sessionItem.querySelector('.session-date');
        if (dateElement) {
            dateElement.textContent = formattedDate;
        }
        
        // НЕМЕДЛЕННО перемещаем сеанс вверх списка
        const sessionsList = document.getElementById('sessions-list');
        if (sessionsList.firstChild !== sessionItem) {
            sessionsList.insertBefore(sessionItem, sessionsList.firstChild);
        }
    }

    // -------------------------------
    // Функции для панели состояния запросов
    // -------------------------------
    function initRequestsStatusPanel() {
        // Показываем панель
        document.getElementById('requests-status-panel').style.display = 'block';
        
        // Запускаем периодическое обновление (каждые 3 секунды)
        if (statusRefreshInterval) {
            clearInterval(statusRefreshInterval);
        }
        statusRefreshInterval = setInterval(refreshRequestsStatus, 3000);
        
        // Первое обновление
        refreshRequestsStatus();
    }

    function toggleRequestsPanel() {
        const panel = document.getElementById('requests-status-panel');
        if (panel.style.display === 'none') {
            initRequestsStatusPanel();
        } else {
            panel.style.display = 'none';
            if (statusRefreshInterval) {
                clearInterval(statusRefreshInterval);
                statusRefreshInterval = null;
            }
        }
    }

    async function refreshRequestsStatus() {
        try {
            const response = await fetch('/api/queue/status');
            const status = await response.json();
            
            updateSystemLoad(status.system);
            updateProcessingRequest(status.processing);
            updateQueuedRequests(status.queued);
            updateRecentCompleted(status.recent_completed);
            
            if (status.processing) {
                updateSessionWithRequestStatus(status.processing.session_id, 'processing');
            }
            
            status.queued.forEach(req => {
                updateSessionWithRequestStatus(req.session_id, 'queued');
            });
            
        } catch (error) {
            console.error('Ошибка обновления статуса:', error);
        }
    }

    function updateSystemLoad(system) {
        const container = document.getElementById('system-load');
        if (!container) return;
        
        if (!system) {
            container.innerHTML = '';
            return;
        }
        
        const loadPercent = Math.min(100, (system.total_queued / 10) * 100);
        const loadClass = system.current_load === 'high' ? 'high' : '';
        
        let statusText = 'Низкая';
        let statusColor = '#28a745';
        if (system.total_queued > 10) {
            statusText = 'Высокая';
            statusColor = '#dc3545';
        } else if (system.total_queued > 5) {
            statusText = 'Средняя';
            statusColor = '#ffc107';
        }
        
        // Добавляем информацию о доступности сервисов
        let servicesHtml = '';
        if (system.services) {
            servicesHtml = '<div class="services-mini-status">';
            if (system.services.ollama) {
                const ollamaHealth = system.services.ollama.health;
                servicesHtml += `<span class="service-dot ${ollamaHealth}" title="Ollama: ${ollamaHealth}"></span>`;
            }
            if (system.services.automatic1111) {
                const autoHealth = system.services.automatic1111.health;
                servicesHtml += `<span class="service-dot ${autoHealth}" title="Automatic1111: ${autoHealth}"></span>`;
            }
            servicesHtml += '</div>';
        }
        
        container.innerHTML = `
            <div class="system-load-indicator">
                <div class="load-header">
                    <span>📊 Нагрузка системы ${servicesHtml}</span>
                    <span class="load-status" style="color: ${statusColor};">${statusText}</span>
                </div>
                <div class="load-bar-container">
                    <div class="load-bar">
                        <div class="load-fill ${loadClass}" style="width: ${loadPercent}%"></div>
                    </div>
                    <div class="load-value">
                        <strong>${system.total_queued}</strong> в очереди
                    </div>
                </div>
            </div>
        `;
    }

    function updateProcessingRequest(processing) {
        const container = document.getElementById('processing-request');
        const textEl = document.getElementById('processing-text');
        
        if (processing) {
            container.style.display = 'block';
            textEl.innerHTML = `${processing.type_icon} ${processing.session_title}: обрабатывается...`;
        } else {
            container.style.display = 'none';
        }
    }

    function updateQueuedRequests(queued) {
        const container = document.getElementById('queued-requests');
        const listEl = document.getElementById('queued-list');
        
        if (queued.length > 0) {
            container.style.display = 'block';
            
            let html = '';
            queued.forEach(req => {
                const pos = req.position_info;
                
                let waitText = '~5 сек';
                if (pos && pos.estimated_seconds !== undefined && !isNaN(pos.estimated_seconds)) {
                    const waitMinutes = Math.floor(pos.estimated_seconds / 60);
                    const waitSeconds = Math.round(pos.estimated_seconds % 60);
                    waitText = waitMinutes > 0 
                        ? `${waitMinutes} мин ${waitSeconds} сек`
                        : `${waitSeconds} сек`;
                }
                
                html += `
                    <div class="queue-item" data-request-id="${req.id}">
                        <span class="queue-position">#${pos?.position || '?'}</span>
                        <span class="request-icon">${req.type_icon}</span>
                        <span class="request-title" title="${req.session_title}">
                            ${(req.session_title || 'Неизвестный сеанс').substring(0, 20)}...
                        </span>
                        <span class="wait-time">⏱️ ${waitText}</span>
                        <span class="cancel-request" onclick="cancelRequest('${req.id}')">✕</span>
                    </div>
                `;
            });
            
            listEl.innerHTML = html;
        } else {
            container.style.display = 'none';
        }
    }

    function updateRecentCompleted(completed) {
        const container = document.getElementById('recent-completed');
        const listEl = document.getElementById('completed-list');
        
        if (completed.length > 0) {
            container.style.display = 'block';
            
            let html = '';
            completed.forEach(req => {
                html += `
                    <div class="recent-item">
                        <span>✅</span>
                        <span class="request-title" title="${req.session_title}">
                            ${req.session_title.substring(0, 15)}...
                        </span>
                        <span class="completed-time">${req.completed_at}</span>
                        <span class="duration">(${req.duration}с)</span>
                    </div>
                `;
            });
            
            listEl.innerHTML = html;
        } else {
            container.style.display = 'none';
        }
    }

    async function cancelRequest(requestId) {
        if (!confirm('Отменить этот запрос?')) return;
        
        try {
            const response = await fetch(`/api/queue/cancel/${requestId}`, {
                method: 'POST'
            });
            const result = await response.json();
            
            if (result.success) {
                refreshRequestsStatus();
            } else {
                alert('Не удалось отменить запрос (возможно, он уже обрабатывается)');
            }
        } catch (error) {
            console.error('Ошибка отмены:', error);
        }
    }

    // -------------------------------
    // Отправка сообщения
    // -------------------------------
    async function sendMessage() {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text && !attachedFile) {
            alert('Введите сообщение или прикрепите файл');
            return;
        }
        
        if (isSending) return;
        isSending = true;
        
        const sendButton = document.getElementById('send-button');
        sendButton.disabled = true;
        sendButton.innerHTML = '⏳ Отправка...';
        
        const messageCount = document.querySelectorAll('.user-message').length;
        if (messageCount === 0) {
            let newTitle = text ? text.slice(0, 40) + (text.length > 40 ? '...' : '') : '';
            if (!newTitle && attachedFile) {
                newTitle = attachedFile.name.slice(0, 40) + (attachedFile.name.length > 40 ? '...' : '');
            }
            if (newTitle) {
                updateSessionTitle(currentSessionId, newTitle);
                
                fetch(`/api/sessions/${currentSessionId}/update-title`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({title: newTitle})
                }).catch(err => console.error('Ошибка обновления заголовка:', err));
            }
        }
        
        const now = new Date();
        const timestamp = now.toISOString();
        
        const userContent = [];
        if (text) {
            userContent.push({"type": "text", "text": text});
        }
        
        let fileData = null;
        let fileType = null;
        let fileName = null;
        
        const tempAttachedFile = attachedFile;
        const tempText = text;
        
        const displayUserMessage = (fileData, fileType, fileName) => {
            if (fileData) {
                userContent.push({
                    "type": "file", 
                    "file_data": fileData, 
                    "file_type": fileType, 
                    "file_name": fileName
                });
            }
            
            displayMessage(
                'user', 
                JSON.stringify(userContent), 
                fileData, 
                fileType, 
                fileName, 
                timestamp
            );
            
            input.value = '';
            attachedFile = null;
            document.getElementById('file-preview-container').style.display = 'none';
            document.getElementById('file-input').value = '';
        };
        
        const sendToServer = async () => {
            try {
                let response;
                
                if (tempAttachedFile) {
                    const formData = new FormData();
                    formData.append('message', tempText);
                    formData.append('file', tempAttachedFile);
                    
                    response = await fetch('/send_message', {
                        method: 'POST',
                        body: formData
                    });
                } else {
                    response = await fetch('/send_message', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: tempText
                        })
                    });
                }
                
                const data = await response.json();
                console.log('Ответ от сервера:', data);
                
                // Показываем предупреждение, если сервис не готов
                if (data.warning) {
                    showServiceWarning(data.warning);
                }
                
                if (data.status === 'queued') {
                    const waitMinutes = Math.floor(data.estimated_wait / 60);
                    const waitSeconds = Math.round(data.estimated_wait % 60);
                    const waitText = waitMinutes > 0 
                        ? `${waitMinutes} мин ${waitSeconds} сек`
                        : `${waitSeconds} сек`;
                    
                    const notification = document.createElement('div');
                    notification.className = 'queue-notification';
                    notification.innerHTML = `
                        <div class="notification-content">
                            <span>⏳ Запрос в очереди (позиция ${data.position})</span>
                            <span class="wait-time">~${waitText}</span>
                        </div>
                    `;
                    document.querySelector('.chat-header').appendChild(notification);
                    setTimeout(() => notification.remove(), 5000);
                    
                    refreshRequestsStatus();
                    
                    const panel = document.getElementById('requests-status-panel');
                    if (panel.style.display === 'none') {
                        initRequestsStatusPanel();
                    }
                    
                    startResultPolling(data.request_id);
                } else if (data.response) {
                    displayMessage(
                        'assistant',
                        data.response,
                        data.generated_image,
                        data.file_type,
                        data.file_name,
                        data.assistant_timestamp,
                        data.response_time,
                        data.model_used
                    );
                }
                
            } catch (err) {
                alert('Ошибка: ' + err.message);
                console.error('Send message error:', err);
                const lastMessage = document.querySelector('.user-message:last-child');
                if (lastMessage) {
                    lastMessage.style.borderLeft = '3px solid #e74c3c';
                }
            } finally {
                sendButton.disabled = false;
                sendButton.innerHTML = 'Отправить';
                isSending = false;
            }
        };

        // Функция для опроса результата
        function startResultPolling(requestId) {
            console.log('Start polling for request:', requestId);
            let pollCount = 0;
            const maxPolls = 120;
            
            const pollInterval = setInterval(async () => {
                pollCount++;
                
                try {
                    const response = await fetch(`/api/queue/result/${requestId}`);
                    const data = await response.json();
                    console.log('Poll result:', data);
                    
                    if (data.status === 'completed') {
                        clearInterval(pollInterval);
                        console.log('Request completed, result:', data.result);
                        
                        if (data.result) {
                            const resultSessionId = data.result.session_id;
                            
                            if (data.result.response) {
                                let responseTime = data.result.response_time;
                                let modelUsed = data.result.model_used;
                                const isError = data.result.is_error || false;
                                
                                console.log('Processing completed result:', {
                                    responseTime,
                                    modelUsed,
                                    type: typeof responseTime,
                                    value: responseTime
                                });
                                
                                // Проверяем наличие раздельного времени
                                if (data.result.mm_time && data.result.gen_time) {
                                    responseTime = {
                                        mm_time: data.result.mm_time,
                                        gen_time: data.result.gen_time,
                                        mm_model: data.result.mm_model,
                                        gen_model: data.result.gen_model
                                    };
                                    modelUsed = data.result.mm_model;
                                } 
                                // Если responseTime - строка, пробуем распарсить как JSON
                                else if (typeof responseTime === 'string' && responseTime.startsWith('{')) {
                                    try {
                                        responseTime = JSON.parse(responseTime);
                                    } catch (e) {
                                        console.log('Failed to parse responseTime JSON:', e);
                                    }
                                }
                                
                                console.log('Final responseTime before display:', responseTime);
                                
                                if (resultSessionId === currentSessionId) {
                                    displayMessage(
                                        'assistant',
                                        data.result.response,
                                        data.result.generated_image,
                                        data.result.file_type,
                                        data.result.file_name,
                                        data.result.assistant_timestamp || new Date().toISOString(), 
                                        responseTime,
                                        modelUsed
                                    );
                                } else {
                                    console.log(`Ответ для сеанса ${resultSessionId}, не текущего`);
                                    setNewMessageIndicator(resultSessionId, true, isError);
                                    loadSessionsFromServer();
                                }
                            } else if (data.result.error) {
                                if (resultSessionId === currentSessionId) {
                                    displayMessage(
                                        'assistant',
                                        `⚠️ ${data.result.error}`,
                                        null, null, null,
                                        data.result.assistant_timestamp || new Date().toISOString(),
                                        data.result.response_time,
                                        'system'
                                    );
                                } else {
                                    setNewMessageIndicator(resultSessionId, true, true);
                                    loadSessionsFromServer();
                                }
                            }
                        }
                        refreshRequestsStatus();
                        
                        setTimeout(() => {
                            loadSessionsFromServer();
                        }, 500);
                        
                    } else if (data.status === 'error') {
                        clearInterval(pollInterval);
                        console.error('Request error:', data.error);
                        
                        const resultSessionId = data.result?.session_id;
                        
                        if (resultSessionId === currentSessionId) {
                            displayMessage(
                                'assistant',
                                `⚠️ Ошибка: ${data.error || 'Неизвестная ошибка'}`,
                                null, null, null,
                                data.result?.assistant_timestamp || new Date().toISOString(),
                                data.result?.response_time,
                                'system'
                            );
                        } else if (resultSessionId) {
                            setNewMessageIndicator(resultSessionId, true, true);
                            loadSessionsFromServer();
                        }
                        
                        refreshRequestsStatus();
                        
                    } else if (data.status === 'pending') {
                        console.log('Request still pending...');
                    }
                    
                    if (pollCount >= maxPolls) {
                        clearInterval(pollInterval);
                        console.log('Polling stopped after max attempts');
                        
                        displayMessage(
                            'assistant',
                            '⚠️ Превышено время ожидания ответа. Проверьте статус запроса в панели "Мои запросы".',
                            null, null, null,
                            new Date().toISOString(),
                            null,
                            'system'
                        );
                    }
                    
                } catch (error) {
                    console.error('Error polling result:', error);
                    if (pollCount >= maxPolls) {
                        clearInterval(pollInterval);
                    }
                }
            }, 3000);
        }
        
        if (tempAttachedFile) {
            const reader = new FileReader();
            reader.onload = async function(e) {
                fileData = e.target.result.split(',')[1];
                fileType = tempAttachedFile.type;
                fileName = tempAttachedFile.name;
                
                displayUserMessage(fileData, fileType, fileName);
                
                await sendToServer();
            };
            reader.readAsDataURL(tempAttachedFile);
        } else {
            displayUserMessage(null, null, null);
            
            await sendToServer();
        }
    }

    function deleteSession(sessionId) {
        for (let [id, req] of Object.entries(pendingRequests)) {
            if (req.sessionId === sessionId && !req.processed) {
                pendingRequests[id].processed = true;
            }
        }
        
        delete newMessageIndicators[sessionId];
        
        fetch(`/api/sessions/${sessionId}/delete`, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'ok') {
                    delete sessionsData[sessionId];
                    
                    const sessionItem = document.querySelector(`.session-item[data-session-id="${sessionId}"]`);
                    if (sessionItem) {
                        sessionItem.remove();
                    }
                    
                    const sessionsCount = document.querySelectorAll('.session-item').length;
                    document.getElementById('sessions-count').textContent = sessionsCount;
                    
                    if (sessionId === currentSessionId) {
                        const remainingSessions = document.querySelectorAll('.session-item');
                        if (remainingSessions.length > 0) {
                            const firstSession = remainingSessions[0];
                            const firstSessionId = firstSession.dataset.sessionId;
                            switchSession(firstSessionId);
                        } else {
                            setTimeout(() => {
                                createNewSession();
                            }, 50);
                        }
                    }
                }
            })
            .catch(err => {
                alert('Ошибка при удалении сеанса: ' + err.message);
            });
    }

    // Функции для копирования кода
    async function copyToClipboard(text) {
        try {
            await navigator.clipboard.writeText(text);
            return true;
        } catch (err) {
            console.error('Ошибка копирования через clipboard API:', err);
            try {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                const success = document.execCommand('copy');
                document.body.removeChild(textarea);
                return success;
            } catch (fallbackErr) {
                console.error('Ошибка копирования через execCommand:', fallbackErr);
                return false;
            }
        }
    }

    async function handleCopyClick(button, codeElement) {
        const code = codeElement.textContent || codeElement.innerText;
        const originalHTML = button.innerHTML;
        const originalClass = button.className;
        
        button.innerHTML = '⏳';
        button.disabled = true;
        
        const success = await copyToClipboard(code);
        
        if (success) {
            button.innerHTML = '✓';
            button.className = originalClass + ' copied';
            button.title = 'Скопировано!';
            
            setTimeout(() => {
                button.innerHTML = '📋';
                button.className = originalClass.replace(' copied', '');
                button.title = 'Копировать код';
                button.disabled = false;
            }, 2000);
        } else {
            button.innerHTML = '✗';
            button.title = 'Ошибка копирования';
            
            setTimeout(() => {
                button.innerHTML = '📋';
                button.title = 'Копировать код';
                button.disabled = false;
            }, 2000);
        }
    }

    function addCopyButtonsToMessage(messageElement) {
        if (!messageElement) return;
        
        const codeBlocks = messageElement.querySelectorAll('pre code');
        
        codeBlocks.forEach((codeBlock) => {
            const parent = codeBlock.parentNode;
            if (parent.classList.contains('code-block-wrapper')) return;
            
            const wrapper = document.createElement('div');
            wrapper.className = 'code-block-wrapper';
            
            const copyButton = document.createElement('button');
            copyButton.className = 'copy-code-button';
            copyButton.innerHTML = '📋';
            copyButton.title = 'Копировать код';
            copyButton.setAttribute('aria-label', 'Копировать код');
            
            copyButton.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                handleCopyClick(copyButton, codeBlock);
            });
            
            parent.parentNode.insertBefore(wrapper, parent);
            wrapper.appendChild(parent);
            wrapper.appendChild(copyButton);
        });
    }

    function addCopyButtonsToAllCodeBlocks() {
        document.querySelectorAll('.user-message, .assistant-message, .bot-message').forEach(message => {
            addCopyButtonsToMessage(message);
        });
    }

    function setupCopyButtonsObserver() {
        const chatMessages = document.getElementById('chat-messages');
        if (!chatMessages) return;
        
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                mutation.addedNodes.forEach((node) => {
                    if (node.nodeType === Node.ELEMENT_NODE) {
                        if (node.classList && 
                            (node.classList.contains('user-message') || 
                            node.classList.contains('assistant-message') || 
                            node.classList.contains('bot-message'))) {
                            addCopyButtonsToMessage(node);
                        }
                        
                        const messages = node.querySelectorAll?.('.user-message, .assistant-message, .bot-message');
                        if (messages) {
                            messages.forEach(addCopyButtonsToMessage);
                        }
                    }
                });
            });
        });
        
        observer.observe(chatMessages, {
            childList: true,
            subtree: true
        });
    }

    const originalLoadMessages = window.loadMessages || function(){};

    window.loadMessages = function(sessionId) {
        return originalLoadMessages(sessionId).then(() => {
            setTimeout(addCopyButtonsToAllCodeBlocks, 100);
        });
    };

    const originalDisplayMessage = window.displayMessage || function(){};

    window.displayMessage = function(role, content, fileData, fileType, fileName, timestamp, responseTime, modelName) {
        const result = originalDisplayMessage.call(this, role, content, fileData, fileType, fileName, timestamp, responseTime, modelName);
        
        const messages = document.getElementById('chat-messages');
        if (messages) {
            const lastMessage = messages.lastElementChild;
            if (lastMessage) {
                setTimeout(() => addCopyButtonsToMessage(lastMessage), 50);
            }
        }
        
        return result;
    };

    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(setupCopyButtonsObserver, 500);
        setTimeout(addCopyButtonsToAllCodeBlocks, 1000);
    });

</script>
