{% extends "base.html" %}

{% block content %}
<div class="chat-container">
    <!-- Левая колонка – сеансы -->
    <div class="sessions-sidebar">
        <div class="sessions-header">
            <h2>Сеансы (<span id="sessions-count">{{ sessions|length }}</span>)</h2>
            <button id="new-session-button" class="new-session-button">➕</button>
        </div>
        
        <div class="sessions-list" id="sessions-list">
            {% for s in sessions %}
            <div class="session-item {% if s.id == current_session %}active{% endif %}" data-session-id="{{ s.id }}">
                <div class="session-content">
                    <div class="session-info">
                        <div class="session-title">{{ s.title }}</div>
                        <div class="session-date">{{ s.updated_at[:19].replace('T', ' ') }}</div>
                    </div>
                    <button class="delete-session-button" title="Удалить сеанс">🗑️</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    
    <!-- Правая часть – чат -->
    <div class="chat-main">
        <div class="chat-header">
            <h2>Чат</h2>
            <div class="context-info-container">
                <div id="context-info" class="context-info">Сообщений: 0</div>
                <button id="save-chat-button" class="save-chat-button" title="Сохранить как HTML">💾</button>
                <button id="clear-context-button" class="clear-context-button">🗑️</button>
            </div>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <!-- История загрузится через JS -->
        </div>
        
        <!-- Превью файлов -->
        <div id="file-preview-container" style="display: none;">
            <div>
                <span id="file-preview-name"></span>
                <span id="file-preview-size"></span>
                <button id="remove-file-button">✕</button>
            </div>
        </div>
        
        <!-- Модальное окно для просмотра изображений в полном размере -->
        <div id="image-modal" class="image-modal" onclick="closeImageModal()">
            <span class="image-modal-close">&times;</span>
            <img class="image-modal-content" id="modal-image">
            <div id="modal-caption"></div>
        </div>
        
        <!-- Поле ввода -->
        <div class="message-input">
            <input type="text" id="message-input" placeholder="Введите сообщение..." autocomplete="off">
            <input type="file" id="file-input" accept="image/*,audio/*,.pdf,.doc,.docx,.txt" style="display: none;">
            <button id="attach-file-button">📎</button>
            <button id="send-button">Отправить</button>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/marked.min.js') }}"></script>
<script>
    // Глобальные переменные
    let currentSessionId = "{{ current_session }}";
    let isSending = false;
    let attachedFile = null;
    let pendingRequests = {}; // Хранилище для отслеживания запросов по сеансам
    let defaultModelName = 'qwen3-vl:8b-instruct';
    let sessionsData = {}; // Хранилище данных о сеансах
    let syncInterval = null; // Интервал для синхронизации
    let newMessageIndicators = {}; // Хранилище индикаторов новых сообщений {sessionId: true}

    // -------------------------------
    // Вспомогательные функции
    // -------------------------------
    function pad(n) { 
        return n.toString().padStart(2, '0'); 
    }

    // -------------------------------
    // Форматирование размера файла
    // -------------------------------
    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Б';
        if (!bytes) return '';
        
        const k = 1024;
        const sizes = ['Б', 'КБ', 'МБ', 'ГБ'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    // -------------------------------
    // Декодирование HTML-сущностей
    // -------------------------------
    function decodeHtmlEntities(text) {
        if (!text) return '';
        const textarea = document.createElement('textarea');
        textarea.innerHTML = text;
        return textarea.value;
    }

    // -------------------------------
    // Экранирование HTML
    // -------------------------------
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // -------------------------------
    // Форматирование даты
    // -------------------------------
    function formatFullDateTime(ts) {
        if (!ts) return '';
        try {
            const date = new Date(ts);
            if (isNaN(date.getTime())) {
                return ts.replace('T', ' ').slice(0, 19);
            }
            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            const seconds = date.getSeconds().toString().padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        } catch (e) {
            return ts.replace('T', ' ').slice(0, 19);
        }
    }

    // -------------------------------
    // Функции для работы с модальным окном изображений
    // -------------------------------
    function openImageModal(imgSrc, imgAlt) {
        const modal = document.getElementById('image-modal');
        const modalImg = document.getElementById('modal-image');
        const captionText = document.getElementById('modal-caption');
        
        modal.style.display = "block";
        modalImg.src = imgSrc;
        captionText.innerHTML = imgAlt;
    }

    function closeImageModal() {
        const modal = document.getElementById('image-modal');
        modal.style.display = "none";
    }

    // -------------------------------
    // Обновление счетчика сообщений
    // -------------------------------
    function updateMessageCount() {
        const count = document.querySelectorAll('.user-message, .assistant-message, .bot-message').length;
        document.getElementById('context-info').textContent = `Сообщений: ${count}`;
    }

    // -------------------------------
    // Управление индикаторами новых сообщений
    // -------------------------------
    function setNewMessageIndicator(sessionId, show) {
        if (show) {
            newMessageIndicators[sessionId] = true;
        } else {
            delete newMessageIndicators[sessionId];
        }
        updateIndicatorsInDOM();
    }

    function updateIndicatorsInDOM() {
        document.querySelectorAll('.session-item').forEach(el => {
            const sessionId = el.dataset.sessionId;
            const titleElement = el.querySelector('.session-title');
            let indicator = el.querySelector('.new-message-indicator');
            
            if (newMessageIndicators[sessionId] && sessionId !== currentSessionId) {
                if (!indicator) {
                    indicator = document.createElement('span');
                    indicator.className = 'new-message-indicator';
                    indicator.textContent = '●';
                    titleElement.appendChild(indicator);
                }
            } else {
                if (indicator) {
                    indicator.remove();
                }
            }
        });
    }

    function clearIndicatorForSession(sessionId) {
        if (sessionId === currentSessionId) {
            setNewMessageIndicator(sessionId, false);
        }
    }

    // -------------------------------
    // Загрузка списка сеансов с сервера
    // -------------------------------
    function loadSessionsFromServer() {
        return fetch('/api/sessions')
            .then(res => res.json())
            .then(sessions => {
                let updated = false;
                let titlesChanged = false;
                
                // Обновляем данные в хранилище
                sessions.forEach(s => {
                    if (!sessionsData[s.id]) {
                        sessionsData[s.id] = {
                            title: s.title,
                            updated_at: s.updated_at
                        };
                        updated = true;
                    } else if (sessionsData[s.id].title !== s.title) {
                        sessionsData[s.id].title = s.title;
                        sessionsData[s.id].updated_at = s.updated_at;
                        updated = true;
                        titlesChanged = true;
                    } else if (sessionsData[s.id].updated_at !== s.updated_at) {
                        sessionsData[s.id].updated_at = s.updated_at;
                        updated = true;
                    }
                });
                
                // Удаляем из хранилища сеансы, которых больше нет
                Object.keys(sessionsData).forEach(id => {
                    if (!sessions.find(s => s.id === id)) {
                        delete sessionsData[id];
                        delete newMessageIndicators[id];
                        updated = true;
                    }
                });
                
                // Если были изменения, обновляем отображение
                if (updated) {
                    updateSessionsList(sessions, titlesChanged);
                }
                
                return sessions;
            })
            .catch(err => console.error('Ошибка загрузки сеансов:', err));
    }

    // -------------------------------
    // Обновление списка сеансов в DOM
    // -------------------------------
    function updateSessionsList(sessions, preserveIndicators = true) {
        const sessionsList = document.getElementById('sessions-list');
        const currentActiveId = currentSessionId;
        
        // Используем данные из хранилища
        sessions.forEach(s => {
            if (sessionsData[s.id]) {
                s.title = sessionsData[s.id].title;
                s.updated_at = sessionsData[s.id].updated_at;
            }
        });
        
        // Сортируем по дате обновления (новые сверху)
        sessions.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
        
        let html = '';
        sessions.forEach(s => {
            const isActive = s.id === currentActiveId ? 'active' : '';
            const dateStr = s.updated_at ? s.updated_at.replace('T', ' ').substring(0, 19) : '';
            const hasIndicator = newMessageIndicators[s.id] && s.id !== currentActiveId;
            
            html += `
                <div class="session-item ${isActive}" data-session-id="${s.id}">
                    <div class="session-content">
                        <div class="session-info">
                            <div class="session-title">${escapeHtml(s.title)}${hasIndicator ? '<span class="new-message-indicator">●</span>' : ''}</div>
                            <div class="session-date">${dateStr}</div>
                        </div>
                        <button class="delete-session-button" title="Удалить сеанс">🗑️</button>
                    </div>
                </div>
            `;
        });
        
        sessionsList.innerHTML = html;
        document.getElementById('sessions-count').textContent = sessions.length;
        
        // Перепривязываем обработчики событий
        attachSessionEventHandlers();
    }

    // -------------------------------
    // Привязка обработчиков событий к элементам сеансов
    // -------------------------------
    function attachSessionEventHandlers() {
        // Клик по сеансу (но не по кнопке удаления)
        document.querySelectorAll('.session-item').forEach(el => {
            el.addEventListener('click', function(e) {
                if (e.target.closest('.delete-session-button')) {
                    return;
                }
                
                const sessionId = this.dataset.sessionId;
                if (sessionId === currentSessionId) return;
                
                // Очищаем индикатор для этого сеанса перед переключением
                setNewMessageIndicator(sessionId, false);
                
                document.querySelectorAll('.session-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                
                switchSession(sessionId);
            });
        });
        
        // Кнопки удаления сеансов
        document.querySelectorAll('.delete-session-button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const sessionItem = this.closest('.session-item');
                const sessionId = sessionItem.dataset.sessionId;
                const sessionTitle = sessionItem.querySelector('.session-title').textContent;
                const sessionDate = sessionItem.querySelector('.session-date').textContent;
                
                if (confirm(`Удалить сеанс "${sessionTitle}" от ${sessionDate}?`)) {
                    deleteSession(sessionId);
                }
            });
        });
    }

    // -------------------------------
    // Запуск периодической синхронизации
    // -------------------------------
    function startSyncInterval() {
        if (syncInterval) {
            clearInterval(syncInterval);
        }
        // Синхронизируем каждые 3 секунды
        syncInterval = setInterval(() => {
            loadSessionsFromServer();
        }, 3000);
    }

    // -------------------------------
    // Инициализация
    // -------------------------------
    document.addEventListener('DOMContentLoaded', function() {
        // Загружаем список сеансов с сервера
        loadSessionsFromServer().then(() => {
            // Загружаем сообщения текущего сеанса
            loadMessages(currentSessionId);
            // Запускаем периодическую синхронизацию
            startSyncInterval();
        });
        
        // Новая беседа
        document.getElementById('new-session-button').addEventListener('click', createNewSession);
        
        // Отправка
        document.getElementById('send-button').addEventListener('click', sendMessage);
        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // Прикрепление файлов
        document.getElementById('attach-file-button').addEventListener('click', function() {
            document.getElementById('file-input').click();
        });
        
        document.getElementById('file-input').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                attachedFile = e.target.files[0];
                const preview = document.getElementById('file-preview-container');
                document.getElementById('file-preview-name').textContent = attachedFile.name;
                
                // Добавляем отображение размера файла в превью
                const fileSize = formatFileSize(attachedFile.size);
                const sizeSpan = document.getElementById('file-preview-size');
                if (sizeSpan) {
                    sizeSpan.textContent = ` (${fileSize})`;
                }
                
                preview.style.display = 'block';
            }
        });
        
        document.getElementById('remove-file-button').addEventListener('click', function() {
            attachedFile = null;
            document.getElementById('file-input').value = '';
            document.getElementById('file-preview-container').style.display = 'none';
        });
        
        // Очистка контекста
        document.getElementById('clear-context-button').addEventListener('click', function() {
            if (confirm('Очистить всю переписку в этом сеансе?')) {
                clearHistory();
            }
        });
        
        // Сохранение чата
        document.getElementById('save-chat-button').addEventListener('click', saveChatAsHTML);
        
        // Закрытие модального окна по ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeImageModal();
            }
        });
    });

    // -------------------------------
    // Загрузка сообщений сеанса
    // -------------------------------
    function loadMessages(sessionId) {
        return fetch(`/api/sessions/${sessionId}/messages`)
            .then(res => res.json())
            .then(messages => {
                const container = document.getElementById('chat-messages');
                container.innerHTML = '';
                
                // Получаем информацию о сессии для модели по умолчанию
                fetch(`/api/sessions/${sessionId}/model-info`)
                    .then(res => res.json())
                    .then(data => {
                        defaultModelName = data.model_name || 'qwen3-vl:8b-instruct-q4_K_M';
                    })
                    .catch(err => console.error('Error loading model info:', err));
                
                // Группируем сообщения для вычисления времени ответа
                let lastUserMessage = null;
                
                messages.forEach((msg) => {
                    if (msg.role === 'user') {
                        lastUserMessage = msg;
                        displayMessage(
                            msg.role, 
                            msg.content, 
                            msg.file_data, 
                            msg.file_type, 
                            msg.file_name, 
                            msg.timestamp,
                            null,
                            null
                        );
                    } else if (msg.role === 'assistant' && lastUserMessage) {
                        // Вычисляем разницу во времени
                        const userTime = new Date(lastUserMessage.timestamp);
                        const assistantTime = new Date(msg.timestamp);
                        const diffSeconds = (assistantTime - userTime) / 1000;
                        const responseTime = Math.round(diffSeconds * 10) / 10;
                        
                        // Получаем ПОЛНОЕ название модели из сообщения
                        const modelName = msg.model_name || defaultModelName || 'qwen3-vl:8b-instruct-q4_K_M';
                        
                        displayMessage(
                            msg.role, 
                            msg.content,
                            msg.file_data, 
                            msg.file_type, 
                            msg.file_name, 
                            msg.timestamp,
                            responseTime,
                            modelName
                        );
                        lastUserMessage = null;
                    } else {
                        displayMessage(
                            msg.role, 
                            msg.content, 
                            msg.file_data, 
                            msg.file_type, 
                            msg.file_name, 
                            msg.timestamp,
                            null,
                            msg.model_name || defaultModelName
                        );
                    }
                });
                
                updateMessageCount();
                container.scrollTop = container.scrollHeight;
                
                // Очищаем индикатор для этого сеанса
                setNewMessageIndicator(sessionId, false);
            });
    }

    // -------------------------------
    // Отображение одного сообщения
    // -------------------------------
    function displayMessage(role, content, fileData, fileType, fileName, timestamp, responseTime, modelName) {
        const container = document.getElementById('chat-messages');
        const msgDiv = document.createElement('div');
        
        // Устанавливаем правильный класс в зависимости от роли
        if (role === 'user') {
            msgDiv.className = 'user-message';
        } else {
            // Для ассистента используем класс assistant-message
            msgDiv.className = 'assistant-message';
            // Добавляем также bot-message для обратной совместимости со старыми стилями
            msgDiv.classList.add('bot-message');
        }
        
        msgDiv.setAttribute('data-timestamp', timestamp);
        
        // Для сообщений ассистента сохраняем название модели
        if (role === 'assistant' && modelName) {
            msgDiv.dataset.modelName = modelName;
        }
        
        let timeDisplay = formatFullDateTime(timestamp);
        
        // ДЛЯ СООБЩЕНИЙ ПОЛЬЗОВАТЕЛЯ: добавляем информацию о файле, если он есть
        if (role === 'user' && fileName && fileData) {
            // Вычисляем размер файла из base64
            const base64Length = fileData.length;
            const fileSizeBytes = Math.round((base64Length * 3) / 4);
            const fileSize = formatFileSize(fileSizeBytes);
            
            timeDisplay += ` <span class="file-info">[📎 ${fileName}, ${fileSize}]</span>`;
            
            // Добавляем кнопку скачивания для изображений в сообщениях пользователя
            if (fileType && fileType.startsWith('image/')) {
                timeDisplay += ` <a href="data:${fileType};base64,${fileData}" 
                                    download="${fileName || 'image.jpg'}" 
                                    class="download-link-inline" 
                                    title="Скачать изображение"
                                    onclick="event.stopPropagation()">⬇️</a>`;
            }
        }
        
        // ДЛЯ СООБЩЕНИЙ АССИСТЕНТА: добавляем информацию о сгенерированном файле
        if (role === 'assistant' && fileName && fileData) {
            // Вычисляем размер файла из base64
            const base64Length = fileData.length;
            const fileSizeBytes = Math.round((base64Length * 3) / 4);
            const fileSize = formatFileSize(fileSizeBytes);
            
            timeDisplay += ` <span class="file-info">[📎 ${fileName}, ${fileSize}]</span>`;
            
            // Добавляем кнопку скачивания для изображений в сообщениях ассистента
            if (fileType && fileType.startsWith('image/')) {
                timeDisplay += ` <a href="data:${fileType};base64,${fileData}" 
                                    download="${fileName || 'generated_image.jpg'}" 
                                    class="download-link-inline" 
                                    title="Скачать изображение"
                                    onclick="event.stopPropagation()">⬇️</a>`;
            }
        }
        
        // Добавляем время ответа и ПОЛНОЕ название модели для сообщений ассистента
        if (role === 'assistant' && responseTime) {
            let fullModelName = modelName || defaultModelName || 'qwen3-vl:8b-instruct-q4_K_M';
            timeDisplay += ` <span class="model-response-info">(ответ: ${fullModelName} за ${responseTime} сек)</span>`;
        }
        
        let html = `<small>${timeDisplay}</small>`;
        
        // Обработка текста
        if (typeof content === 'string') {
            if (content.startsWith('[')) {
                try {
                    const parts = JSON.parse(content);
                    let textContent = '';
                    parts.forEach(part => {
                        if (part.type === 'text') {
                            textContent += part.text + '\n';
                        }
                    });
                    if (textContent) {
                        // Для пользователя - экранируем HTML
                        const escapedText = escapeHtml(textContent.trim());
                        html += `<div class="message-content">${marked.parse(escapedText)}</div>`;
                    }
                } catch (e) {
                    // Если не JSON
                    if (role === 'assistant') {
                        // ДЛЯ АССИСТЕНТА: Просто декодируем HTML-сущности и НЕ экранируем
                        const decodedText = decodeHtmlEntities(content);
                        html += `<div class="message-content">${marked.parse(decodedText)}</div>`;
                    } else {
                        const escapedText = escapeHtml(content);
                        html += `<div class="message-content">${marked.parse(escapedText)}</div>`;
                    }
                }
            } else {
                // Для всех остальных сообщений
                if (role === 'assistant') {
                    const decodedText = decodeHtmlEntities(content);
                    html += `<div class="message-content">${marked.parse(decodedText)}</div>`;
                } else {
                    const escapedText = escapeHtml(content);
                    html += `<div class="message-content">${marked.parse(escapedText)}</div>`;
                }
            }
        }
        
        // Файл (если есть)
        if (fileData) {
            if (fileType && fileType.startsWith('image/')) {
                html += `
                    <div class="image-container">
                        <img src="data:${fileType};base64,${fileData}" 
                             class="attached-image" 
                             alt="${fileName || 'attached image'}"
                             title="Нажмите для увеличения"
                             onclick="openImageModal(this.src, '${fileName || 'Изображение'}')">
                    </div>
                `;
            } else if (fileType && fileType.startsWith('audio/')) {
                html += `<audio controls src="data:${fileType};base64,${fileData}"></audio>`;
            } else {
                html += `<div class="attached-file">
                            <span class="file-icon">📄</span>
                            <a href="data:${fileType};base64,${fileData}" download="${fileName}">${fileName}</a>
                        </div>`;
            }
        }
        
        msgDiv.innerHTML = html;
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
        
        // После добавления сообщения обновляем счетчик
        updateMessageCount();
    }

    // -------------------------------
    // Переключение сеанса
    // -------------------------------
    function switchSession(sessionId) {
        fetch(`/api/sessions/${sessionId}/switch`, { method: 'POST' })
            .then(res => res.json())
            .then(() => {
                currentSessionId = sessionId;
                loadMessages(sessionId);
                
                document.querySelectorAll('.session-item').forEach(el => {
                    if (el.dataset.sessionId === sessionId) {
                        el.classList.add('active');
                    } else {
                        el.classList.remove('active');
                    }
                });
                
                // Обновляем индикаторы после переключения
                updateIndicatorsInDOM();
            });
    }

    // -------------------------------
    // Создание нового сеанса - ПРОСТОЙ ВАРИАНТ
    // -------------------------------
    function createNewSession() {
        fetch('/api/sessions/new', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                // Добавляем в хранилище данных
                sessionsData[data.id] = {
                    title: data.title,
                    updated_at: new Date().toISOString()
                };
                
                // НЕМЕДЛЕННО убираем выделение со всех сеансов
                document.querySelectorAll('.session-item').forEach(el => {
                    el.classList.remove('active');
                });
                
                // НЕМЕДЛЕННО устанавливаем новый currentSessionId
                currentSessionId = data.id;
                
                // Перезагружаем список сеансов с сервера
                loadSessionsFromServer().then(() => {

    // -------------------------------
    // УЛУЧШЕННАЯ ФУНКЦИЯ updateSessionTitle
    function updateSessionTitle(sessionId, newTitle) {
        // Обновляем в хранилище данных
        if (sessionsData[sessionId]) {
            sessionsData[sessionId].title = newTitle;
            sessionsData[sessionId].updated_at = new Date().toISOString();
        }
        
        // Находим элемент сеанса
        const sessionItem = document.querySelector(`.session-item[data-session-id="${sessionId}"]`);
        if (!sessionItem) return;
        
        const titleElement = sessionItem.querySelector('.session-title');
        if (titleElement) {
            titleElement.innerHTML = escapeHtml(newTitle);
            
            // Сохраняем индикатор, если есть
            if (newMessageIndicators[sessionId] && sessionId !== currentSessionId) {
                const indicator = document.createElement('span');
                indicator.className = 'new-message-indicator';
                indicator.textContent = '●';
                titleElement.appendChild(indicator);
            }
        }
        
        // Обновляем дату
        const now = new Date();
        const formattedDate = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        const dateElement = sessionItem.querySelector('.session-date');
        if (dateElement) {
            dateElement.textContent = formattedDate;
        }
        
        // НЕМЕДЛЕННО перемещаем сеанс вверх списка
        const sessionsList = document.getElementById('sessions-list');
        if (sessionsList.firstChild !== sessionItem) {
            sessionsList.insertBefore(sessionItem, sessionsList.firstChild);
        }
    }

    // -------------------------------
    // Отправка сообщения - ИСПРАВЛЕННАЯ ВЕРСИЯ
    // -------------------------------
    async function sendMessage() {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text && !attachedFile) {
            alert('Введите сообщение или прикрепите файл');
            return;
        }
        
        if (isSending) return;
        isSending = true;
        
        // НЕМЕДЛЕННОЕ ОБНОВЛЕНИЕ ЗАГОЛОВКА ДЛЯ ПЕРВОГО СООБЩЕНИЯ
        const messageCount = document.querySelectorAll('.user-message').length;
        if (messageCount === 0) {
            let newTitle = text ? text.slice(0, 40) + (text.length > 40 ? '...' : '') : '';
            if (!newTitle && attachedFile) {
                newTitle = attachedFile.name.slice(0, 40) + (attachedFile.name.length > 40 ? '...' : '');
            }
            if (newTitle) {
                // Немедленно обновляем UI
                updateSessionTitle(currentSessionId, newTitle);
                
                // Отправляем на сервер для синхронизации
                fetch(`/api/sessions/${currentSessionId}/update-title`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({title: newTitle})
                }).catch(err => console.error('Ошибка обновления заголовка:', err));
            }
        }
        
        // ЗАПОМИНАЕМ ID ТЕКУЩЕГО СЕАНСА ДЛЯ ЭТОГО ЗАПРОСА
        const requestSessionId = currentSessionId;
        
        // Генерируем уникальный ID запроса
        const requestId = Date.now() + '-' + Math.random().toString(36).substr(2, 9);
        
        // Сохраняем запрос в хранилище
        pendingRequests[requestId] = {
            sessionId: requestSessionId,
            timestamp: Date.now(),
            processed: false
        };
        
        const now = new Date();
        const timestamp = now.toISOString();
        
        const userContent = [];
        if (text) {
            userContent.push({"type": "text", "text": text});
        }
        
        let fileData = null;
        let fileType = null;
        let fileName = null;
        let fileSize = null;
        
        // СОХРАНЯЕМ КОПИИ ДЛЯ ОТПРАВКИ
        const tempAttachedFile = attachedFile;
        const tempText = text;
        
        // Функция для отображения сообщения пользователя
        const displayUserMessage = (fileData, fileType, fileName) => {
            if (fileData) {
                userContent.push({
                    "type": "file", 
                    "file_data": fileData, 
                    "file_type": fileType, 
                    "file_name": fileName
                });
            }
            
            displayMessage(
                'user', 
                JSON.stringify(userContent), 
                fileData, 
                fileType, 
                fileName, 
                timestamp
            );
            
            // Очищаем поля после отображения
            input.value = '';
            attachedFile = null;
            document.getElementById('file-preview-container').style.display = 'none';
            document.getElementById('file-input').value = '';
        };
        
        // Сначала отображаем сообщение пользователя
        if (tempAttachedFile) {
            // Для файлов нужно дождаться чтения
            const reader = new FileReader();
            reader.onload = async function(e) {
                fileData = e.target.result.split(',')[1];
                fileType = tempAttachedFile.type;
                fileName = tempAttachedFile.name;
                fileSize = tempAttachedFile.size;
                
                // Отображаем сообщение пользователя
                displayUserMessage(fileData, fileType, fileName);
                
                // Отправляем на сервер
                const formData = new FormData();
                formData.append('message', tempText);
                if (tempAttachedFile) {
                    formData.append('file', tempAttachedFile);
                }
                
                try {
                    const response = await fetch('/send_message', {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    // Находим запрос по ID сеанса (для обратной совместимости)
                    let foundRequest = null;
                    for (let [id, req] of Object.entries(pendingRequests)) {
                        if (req.sessionId === requestSessionId && !req.processed) {
                            foundRequest = {id, ...req};
                            break;
                        }
                    }
                    
                    if (foundRequest) {
                        pendingRequests[foundRequest.id].processed = true;
                    }
                    
                    // Проверяем существование сеанса
                    const sessionStillExists = document.querySelector(`.session-item[data-session-id="${requestSessionId}"]`) !== null;
                    
                    if (sessionStillExists) {
                        // Обновляем данные сеанса в хранилище
                        if (data.session_title) {
                            updateSessionTitle(requestSessionId, data.session_title);
                        }
                        
                        if (currentSessionId === requestSessionId) {
                            // Мы всё ещё в том же сеансе - показываем ответ
                            if (data.response) {
                                const assistantTimestamp = data.assistant_timestamp || new Date().toISOString();
                                const modelName = data.model_used || defaultModelName || 'qwen3-vl:8b-instruct';
                                
                                if (data.generated_image) {
                                    console.log('Получено изображение, размер:', data.generated_image.length);

                                        assistantTimestamp,

                                    );
                                } else {

                                        null,
                                        null,
                                        null,
                                        assistantTimestamp,
                                        data.response_time || 0,
                                        modelName
                                    );
                                }
                            }
                        } else {
                            // Мы переключились на другой сеанс - показываем индикатор
                            console.log(`Ответ для сеанса ${requestSessionId} получен, но текущий сеанс - ${currentSessionId}`);
                            
                            // Устанавливаем индикатор, но НЕ очищаем его
                            setNewMessageIndicator(requestSessionId, true);
                            
                            // Обновляем дату сеанса
                            const sessionElement = document.querySelector(`.session-item[data-session-id="${requestSessionId}"]`);
                            const dateElement = sessionElement?.querySelector('.session-date');
                            if (dateElement) {
                                const now = new Date();
                                dateElement.textContent = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
                            }
                        }
                    } else {
                        console.log(`Сеанс ${requestSessionId} был удалён, ответ проигнорирован`);
                    }
                    
                } catch (err) {
                    // Помечаем запрос как обработанный (с ошибкой)
                    for (let [id, req] of Object.entries(pendingRequests)) {
                        if (req.sessionId === requestSessionId && !req.processed) {
                            pendingRequests[id].processed = true;
                            break;
                        }
                    }
                    
                    // Показываем ошибку только если мы всё ещё в том же сеансе
                    if (currentSessionId === requestSessionId) {
                        alert('Ошибка: ' + err.message);
                        console.error('Send message error:', err);
                        const lastMessage = document.querySelector('.user-message:last-child');
                        if (lastMessage) {
                            lastMessage.style.borderLeft = '3px solid #e74c3c';
                        }
                    } else {
                        console.log(`Ошибка в сеансе ${requestSessionId}, но текущий сеанс - ${currentSessionId}:`, err);
                    }
                } finally {
                    isSending = false;
                }
            };
            reader.readAsDataURL(tempAttachedFile);
        } else {
            // Только текст, без файла
            displayUserMessage(null, null, null);
            
            // Отправляем на сервер
            const formData = new FormData();
            formData.append('message', tempText);
            
            try {
                const response = await fetch('/send_message', {
                    method: 'POST',

                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Находим запрос по ID сеанса (для обратной совместимости)

                if (sessionStillExists) {

                    if (data.session_title) {

                        if (data.response) {

                            const modelName = data.model_used || defaultModelName || 'qwen3-vl:8b-instruct';

    // -------------------------------
    // Удаление сеанса
    // -------------------------------
    function deleteSession(sessionId) {
        // Помечаем все незавершенные запросы для этого сеанса как обработанные
        for (let [id, req] of Object.entries(pendingRequests)) {
            if (req.sessionId === sessionId && !req.processed) {
                pendingRequests[id].processed = true;
            }
        }
        
        // Удаляем индикатор
        delete newMessageIndicators[sessionId];
        
        fetch(`/api/sessions/${sessionId}/delete`, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'ok') {
                    // Удаляем из хранилища данных
                    delete sessionsData[sessionId];
                    
                    // Удаляем элемент из DOM
                    const sessionItem = document.querySelector(`.session-item[data-session-id="${sessionId}"]`);
                    if (sessionItem) {
                        sessionItem.remove();
                    }
                    
                    const sessionsCount = document.querySelectorAll('.session-item').length;
                    document.getElementById('sessions-count').textContent = sessionsCount;
                    
                    // Если это был текущий сеанс
                    if (sessionId === currentSessionId) {
                        const remainingSessions = document.querySelectorAll('.session-item');
                        if (remainingSessions.length > 0) {
                            // Если есть другие сеансы, переключаемся на первый
                            const firstSession = remainingSessions[0];
                            const firstSessionId = firstSession.dataset.sessionId;
                            switchSession(firstSessionId);
                        } else {
                            // Если сеансов не осталось, создаем новый
                            setTimeout(() => {
                                createNewSession();
                            }, 50);
                        }
                    }
                }
            })
            .catch(err => {
                alert('Ошибка при удалении сеанса: ' + err.message);
            });
    }

    <body>
        <header>
            <h1>ИИ Локальный</h1>
        </header>
        
        <main>
            <div class="chat-wrapper">
                <div class="chat-header">
                    <h1>${escapeHtml(title)}</h1>
                    <p>📅 Сохранено: ${now.toLocaleString('ru-RU', { 
                        day: '2-digit', 
                        month: '2-digit', 
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit'
                    })}</p>
                    <p>💬 Всего сообщений: ${messages.length}</p>
                </div>
                
                <div class="chat-messages">
                    ${messages.map(msg => {
                        const roleClass = msg.role === 'user' ? 'user-message' : 'assistant-message';
                        
                        return `
                        <div class="${roleClass}">
                            <div class="message-time">${msg.timeText}</div>
                            <div class="message-content">
                                ${msg.content}
                            </div>
                            ${msg.fileHtml}
                        </div>
                        `;
                    }).join('')}
                </div>
            </div>
        </main>
        
        <footer>
            <div class="footer-content">
                <div class="footer-line1">${escapeHtml(footerLine1)}</div>
                ${footerLine2 ? `<div class="footer-line2">${escapeHtml(footerLine2)}</div>` : ''}
            </div>
        </footer>
    </body>
    </html>`;
        
        // Создаем и скачиваем файл
        const blob = new Blob([html], {type: 'text/html;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `chat_${timestamp}.html`;
        a.click();
        URL.revokeObjectURL(url);
    }

</script>
