{% extends "base.html" %}

{% block content %}
<div class="chat-container">
    <!-- Левая колонка – сеансы -->
    <div class="sessions-sidebar">
        <div class="sessions-header">
            <h2>Сеансы (<span id="sessions-count">{{ sessions|length }}</span>)</h2>
            <button id="new-session-button" class="new-session-button">➕</button>
        </div>
        
        <div class="sessions-list" id="sessions-list">
            {% for s in sessions %}
            <div class="session-item {% if s.id == current_session %}active{% endif %}" data-session-id="{{ s.id }}">
                <div class="session-content">
                    <div class="session-info">
                        <div class="session-title">{{ s.title }}</div>
                        <div class="session-date">{{ s.updated_at[:16].replace('T', ' ') }}</div>
                    </div>
                    <button class="delete-session-button" title="Удалить сеанс">🗑️</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    
    <!-- Правая часть – чат -->
    <div class="chat-main">
        <div class="chat-header">
            <h2>Чат</h2>
            <div class="context-info-container">
                <div id="context-info" class="context-info">Сообщений: 0</div>
                <button id="save-chat-button" class="save-chat-button" title="Сохранить как HTML">💾</button>
                <button id="clear-context-button" class="clear-context-button">🗑️</button>
            </div>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <!-- История загрузится через JS -->
        </div>
        
        <!-- Превью файлов -->
        <div id="file-preview-container" style="display: none;">
            <div>
                <span id="file-preview-name"></span>
                <button id="remove-file-button">✕</button>
            </div>
        </div>
        
        <!-- Поле ввода -->
        <div class="message-input">
            <input type="text" id="message-input" placeholder="Введите сообщение..." autocomplete="off">
            <input type="file" id="file-input" accept="image/*,audio/*,.pdf,.doc,.docx,.txt" style="display: none;">
            <button id="attach-file-button">📎</button>
            <button id="send-button">Отправить</button>
        </div>
    </div>
</div>

<!-- Модальное окно подтверждения удаления сеанса -->
<div id="delete-session-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h3>Удалить сеанс</h3>
        <p id="delete-session-message"></p>
        <div class="modal-buttons">
            <button id="confirm-delete-session" class="modal-button confirm">Удалить</button>
            <button id="cancel-delete-session" class="modal-button cancel">Отмена</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    // Глобальные переменные
    let currentSessionId = "{{ current_session }}";
    let isSending = false;
    let attachedFile = null;
    let sessionToDelete = null;

    // -------------------------------
    // Вспомогательные функции
    // -------------------------------
    function pad(n) { 
        return n.toString().padStart(2, '0'); 
    }

    // -------------------------------
    // Инициализация
    // -------------------------------
    document.addEventListener('DOMContentLoaded', function() {
        // Загружаем сообщения текущего сеанса
        loadMessages(currentSessionId);
        
        // Клик по сеансу (но не по кнопке удаления)
        document.querySelectorAll('.session-item').forEach(el => {
            el.addEventListener('click', function(e) {
                // Если клик по кнопке удаления или её дочерним элементам - не переключаем сеанс
                if (e.target.closest('.delete-session-button')) {
                    return;
                }
                
                const sessionId = this.dataset.sessionId;
                if (sessionId === currentSessionId) return;
                
                // Подсветка
                document.querySelectorAll('.session-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                
                // Переключение
                switchSession(sessionId);
            });
        });
        
        // Кнопки удаления сеансов
        document.querySelectorAll('.delete-session-button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const sessionItem = this.closest('.session-item');
                const sessionId = sessionItem.dataset.sessionId;
                const sessionTitle = sessionItem.querySelector('.session-title').textContent;
                const sessionDate = sessionItem.querySelector('.session-date').textContent;
                
                showDeleteSessionModal(sessionId, sessionTitle, sessionDate);
            });
        });
        
        // Новая беседа
        document.getElementById('new-session-button').addEventListener('click', createNewSession);
        
        // Отправка
        document.getElementById('send-button').addEventListener('click', sendMessage);
        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // Прикрепление файлов
        document.getElementById('attach-file-button').addEventListener('click', function() {
            document.getElementById('file-input').click();
        });
        
        document.getElementById('file-input').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                attachedFile = e.target.files[0];
                const preview = document.getElementById('file-preview-container');
                document.getElementById('file-preview-name').textContent = attachedFile.name;
                preview.style.display = 'block';
            }
        });
        
        document.getElementById('remove-file-button').addEventListener('click', function() {
            attachedFile = null;
            document.getElementById('file-input').value = '';
            document.getElementById('file-preview-container').style.display = 'none';
        });
        
        // Очистка контекста
        document.getElementById('clear-context-button').addEventListener('click', clearHistory);
        
        // Сохранение чата
        document.getElementById('save-chat-button').addEventListener('click', saveChatAsHTML);
        
        // Модальное окно удаления сеанса
        document.getElementById('confirm-delete-session').addEventListener('click', function() {
            if (sessionToDelete) {
                deleteSession(sessionToDelete);
            }
            hideDeleteSessionModal();
        });
        
        document.getElementById('cancel-delete-session').addEventListener('click', function() {
            hideDeleteSessionModal();
        });
        
        // Закрытие модального окна по клику на overlay
        document.getElementById('delete-session-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                hideDeleteSessionModal();
            }
        });
    });

    // -------------------------------
    // Загрузка сообщений сеанса
    // -------------------------------
    function loadMessages(sessionId) {
        return fetch(`/api/sessions/${sessionId}/messages`)
            .then(res => res.json())
            .then(messages => {
                const container = document.getElementById('chat-messages');
                container.innerHTML = '';
                
                messages.forEach(msg => {
                    displayMessage(msg.role, msg.content, msg.file_data, msg.file_type, msg.file_name, msg.timestamp);
                });
                
                updateMessageCount();
                container.scrollTop = container.scrollHeight;
            });
    }

    // -------------------------------
    // Отображение одного сообщения
    // -------------------------------
    function displayMessage(role, content, fileData, fileType, fileName, timestamp) {
        const container = document.getElementById('chat-messages');
        const msgDiv = document.createElement('div');
        msgDiv.className = `${role}-message`;
        
        let html = `<small>${formatTimestamp(timestamp)}</small>`;
        
        // Текст
        if (typeof content === 'string' && content.startsWith('[')) {
            try {
                const parts = JSON.parse(content);
                parts.forEach(part => {
                    if (part.type === 'text') {
                        html += `<div class="message-content">${marked.parse(escapeHtml(part.text))}</div>`;
                    }
                });
            } catch (e) {
                html += `<div class="message-content">${escapeHtml(content).replace(/\n/g, '<br>')}</div>`;
            }
        } else {
            html += `<div class="message-content">${escapeHtml(content).replace(/\n/g, '<br>')}</div>`;
        }
        
        // Файл (если есть)
        if (fileData) {
            if (fileType && fileType.startsWith('image/')) {
                html += `<img src="data:${fileType};base64,${fileData}" class="attached-image" alt="attached image">`;
            } else if (fileType && fileType.startsWith('audio/')) {
                html += `<audio controls src="data:${fileType};base64,${fileData}"></audio>`;
            } else {
                // Документ – показываем иконку и имя
                html += `<div class="attached-file">
                            <span class="file-icon">📄</span>
                            <a href="data:${fileType};base64,${fileData}" download="${fileName}">${fileName}</a>
                         </div>`;
            }
        }
        
        msgDiv.innerHTML = html;
        container.appendChild(msgDiv);
    }

    // -------------------------------
    // Переключение сеанса
    // -------------------------------
    function switchSession(sessionId) {
        fetch(`/api/sessions/${sessionId}/switch`, { method: 'POST' })
            .then(res => res.json())
            .then(() => {
                currentSessionId = sessionId;
                loadMessages(sessionId);
                
                // Обновляем активный класс в списке сеансов
                document.querySelectorAll('.session-item').forEach(el => {
                    if (el.dataset.sessionId === sessionId) {
                        el.classList.add('active');
                    } else {
                        el.classList.remove('active');
                    }
                });
            });
    }

    // -------------------------------
    // Создание нового сеанса
    // -------------------------------
    function createNewSession() {
        fetch('/api/sessions/new', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                // Вместо перезагрузки страницы - динамически добавляем новый сеанс
                const sessionsList = document.getElementById('sessions-list');
                
                // Создаем элемент нового сеанса
                const newSessionDiv = document.createElement('div');
                newSessionDiv.className = 'session-item active';
                newSessionDiv.dataset.sessionId = data.id;
                
                const now = new Date();
                const formattedDate = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
                
                newSessionDiv.innerHTML = `
                    <div class="session-content">
                        <div class="session-info">
                            <div class="session-title">${data.title}</div>
                            <div class="session-date">${formattedDate}</div>
                        </div>
                        <button class="delete-session-button" title="Удалить сеанс">🗑️</button>
                    </div>
                `;
                
                // Убираем active у всех сеансов
                document.querySelectorAll('.session-item').forEach(el => {
                    el.classList.remove('active');
                });
                
                // Добавляем новый сеанс в начало списка
                sessionsList.insertBefore(newSessionDiv, sessionsList.firstChild);
                
                // Добавляем обработчик клика на сеанс
                newSessionDiv.addEventListener('click', function(e) {
                    if (e.target.closest('.delete-session-button')) {
                        return;
                    }
                    
                    const sessionId = this.dataset.sessionId;
                    if (sessionId === currentSessionId) return;
                    
                    document.querySelectorAll('.session-item').forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                    
                    switchSession(sessionId);
                });
                
                // Добавляем обработчик на кнопку удаления
                const deleteBtn = newSessionDiv.querySelector('.delete-session-button');
                deleteBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const sessionItem = this.closest('.session-item');
                    const sessionId = sessionItem.dataset.sessionId;
                    const sessionTitle = sessionItem.querySelector('.session-title').textContent;
                    const sessionDate = sessionItem.querySelector('.session-date').textContent;
                    
                    showDeleteSessionModal(sessionId, sessionTitle, sessionDate);
                });
                
                // Переключаемся на новый сеанс
                currentSessionId = data.id;
                
                // Очищаем сообщения
                document.getElementById('chat-messages').innerHTML = '';
                updateMessageCount();
                
                // Обновляем счетчик сеансов
                const sessionsCount = document.querySelectorAll('.session-item').length;
                document.getElementById('sessions-count').textContent = sessionsCount;
            });
    }

    // -------------------------------
    // Обновление заголовка сеанса
    // -------------------------------
    function updateSessionTitle(sessionId, newTitle) {
        // Обновляем заголовок в списке сеансов
        const sessionItem = document.querySelector(`.session-item[data-session-id="${sessionId}"]`);
        if (sessionItem) {
            const titleElement = sessionItem.querySelector('.session-title');
            if (titleElement) {
                titleElement.textContent = newTitle;
            }
            
            // Также обновляем время
            const now = new Date();
            const formattedDate = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
            const dateElement = sessionItem.querySelector('.session-date');
            if (dateElement) {
                dateElement.textContent = formattedDate;
            }
            
            // Перемещаем обновленный сеанс вверх списка
            const sessionsList = document.getElementById('sessions-list');
            sessionsList.insertBefore(sessionItem, sessionsList.firstChild);
        }
    }

    // -------------------------------
    // Отправка сообщения
    // -------------------------------
    async function sendMessage() {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text && !attachedFile) {
            alert('Введите сообщение или прикрепите файл');
            return;
        }
        
        if (isSending) return;
        isSending = true;
        
        const formData = new FormData();
        formData.append('message', text);
        if (attachedFile) {
            formData.append('file', attachedFile);
        }
        
        try {
            const response = await fetch('/send_message', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            
            // Сохраняем количество сообщений ДО отправки
            const messageCount = document.querySelectorAll('.user-message').length;
            
            input.value = '';
            attachedFile = null;
            document.getElementById('file-preview-container').style.display = 'none';
            
            // Загружаем сообщения
            await loadMessages(currentSessionId);
            
            // Если это было первое сообщение в сеансе (было 0 сообщений)
            if (messageCount === 0 && text) {
                // Формируем заголовок из первого сообщения
                let newTitle = text.length > 30 ? text.substring(0, 30) + '...' : text;
                updateSessionTitle(currentSessionId, newTitle);
                
                // Также обновляем счетчик сеансов в заголовке
                const sessionsCount = document.querySelectorAll('.session-item').length;
                document.getElementById('sessions-count').textContent = sessionsCount;
            }
        } catch (err) {
            alert('Ошибка: ' + err.message);
        } finally {
            isSending = false;
        }
    }

    // -------------------------------
    // Очистка истории сеанса
    // -------------------------------
    function clearHistory() {
        if (!confirm('Очистить всю переписку в этом сеансе?')) return;
        
        fetch('/clear_history', { method: 'POST' })
            .then(res => res.json())
            .then(() => {
                document.getElementById('chat-messages').innerHTML = '';
                updateMessageCount();
                
                // Обновляем заголовок сеанса на "Новый сеанс"
                updateSessionTitle(currentSessionId, 'Новый сеанс');
            });
    }

    // -------------------------------
    // Удаление сеанса
    // -------------------------------
    function deleteSession(sessionId) {
        fetch(`/api/sessions/${sessionId}/delete`, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'ok') {
                    // Удаляем элемент из DOM
                    const sessionItem = document.querySelector(`.session-item[data-session-id="${sessionId}"]`);
                    if (sessionItem) {
                        sessionItem.remove();
                    }
                    
                    // Обновляем счетчик сеансов
                    const sessionsCount = document.querySelectorAll('.session-item').length;
                    document.getElementById('sessions-count').textContent = sessionsCount;
                    
                    // Если удалили текущий сеанс, переключаемся на другой
                    if (sessionId === currentSessionId) {
                        const remainingSessions = document.querySelectorAll('.session-item');
                        if (remainingSessions.length > 0) {
                            // Переключаемся на первый доступный сеанс
                            const firstSession = remainingSessions[0];
                            const firstSessionId = firstSession.dataset.sessionId;
                            switchSession(firstSessionId);
                        } else {
                            // Если сеансов не осталось, создаем новый
                            createNewSession();
                        }
                    }
                }
            })
            .catch(err => {
                alert('Ошибка при удалении сеанса: ' + err.message);
            });
    }

    // -------------------------------
    // Модальное окно для удаления сеанса
    // -------------------------------
    function showDeleteSessionModal(sessionId, sessionTitle, sessionDate) {
        sessionToDelete = sessionId;
        const messageEl = document.getElementById('delete-session-message');
        messageEl.textContent = `Удалить сеанс "${sessionTitle}" от ${sessionDate}?`;
        document.getElementById('delete-session-modal').style.display = 'flex';
    }

    function hideDeleteSessionModal() {
        document.getElementById('delete-session-modal').style.display = 'none';
        sessionToDelete = null;
    }

    // -------------------------------
    // Сохранение чата в HTML
    // -------------------------------
    function saveChatAsHTML() {
        const messages = document.getElementById('chat-messages').innerHTML;
        const title = document.querySelector('.session-item.active .session-title')?.textContent || 'Чат';
        const now = new Date();
        const timestamp = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
        
        const html = `<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>${escapeHtml(title)}</title>
<style>body { font-family: sans-serif; } .user-message { background: #e6f2ff; } .bot-message { background: #f0f0f0; }</style>
</head>
<body>
<h1>${escapeHtml(title)}</h1>
<p>Сохранено: ${now.toLocaleString()}</p>
<div class="messages">${messages}</div>
</body>
</html>`;
        
        const blob = new Blob([html], {type: 'text/html'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `chat_${timestamp}.html`;
        a.click();
        URL.revokeObjectURL(url);
    }

    // -------------------------------
    // Вспомогательные функции
    // -------------------------------
    function updateMessageCount() {
        const count = document.querySelectorAll('.user-message').length;
        document.getElementById('context-info').textContent = `Сообщений: ${count}`;
    }

    function formatTimestamp(ts) {
        if (!ts) return '';
        return ts.replace('T', ' ').slice(0, 16);
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
</script>
{% endblock %}
