<!-- templates/chat.html (полный файл с поддержкой аудио-записи и исправлениями) -->
{% extends "base.html" %}

{% block content %}
<div class="chat-container">
    <!-- Левая колонка – сеансы -->
    <div class="sessions-sidebar">
        <div class="sessions-header">
            <h2>Сеансы (<span id="sessions-count">{{ sessions|length }}</span>)</h2>
            <button id="new-session-button" class="new-session-button">➕</button>
        </div>
        
        <div class="sessions-list" id="sessions-list">
            {% for s in sessions %}
            <div class="session-item {% if s.id == current_session %}active{% endif %}" data-session-id="{{ s.id }}">
                <div class="session-content">
                    <div class="session-info">
                        <div class="session-title">{{ s.title }}</div>
                        <div class="session-date">{{ s.updated_at[:19].replace('T', ' ') }}</div>
                    </div>
                    <button class="delete-session-button" title="Удалить сеанс">🗑️</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    
    <!-- Правая часть – чат -->
    <div class="chat-main">
        <div class="chat-header">
            <h2>Чат</h2>
            <div class="context-info-container">
                <div id="context-info" class="context-info">Сообщений: 0</div>
                <button id="save-chat-button" class="save-chat-button" title="Сохранить как HTML">💾</button>
                <button id="clear-context-button" class="clear-context-button">🗑️</button>
                <!-- Компактный счётчик -->
                <span id="status-counter" class="status-counter" title="Ваши запросы в очереди / Всего в очереди">📊 0/0</span>
            </div>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <!-- История загрузится через JS -->
        </div>
        
        <!-- Превью файлов -->
        <div id="file-preview-container" style="display: none;">
            <div>
                <span id="file-preview-name"></span>
                <span id="file-preview-size"></span>
                <button id="remove-file-button">✕</button>
            </div>
        </div>
        
        <!-- Модальное окно для просмотра изображений в полном размере -->
        <div id="image-modal" class="image-modal" onclick="closeImageModal()">
            <span class="image-modal-close">&times;</span>
            <img class="image-modal-content" id="modal-image">
            <div id="modal-caption"></div>
        </div>
        
        <!-- Поле ввода + кнопки -->
        <div class="message-input">
            <input type="text" id="message-input" placeholder="Введите сообщение..." autocomplete="off">
            <button id="voice-record-button" class="voice-record-button" title="Записать голосовое сообщение">🎤</button>
            <input type="file" id="file-input" accept="image/*,audio/*,.pdf,.doc,.docx,.txt" style="display: none;">
            <button id="attach-file-button">📎</button>
            <button id="send-button">Отправить</button>
            <span id="recording-indicator" style="display:none; margin-left: 10px; color: #e74c3c; font-weight: bold;">🔴 Запись...</span>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/marked.min.js') }}"></script>
<script>
    // Глобальные переменные
    let currentSessionId = "{{ current_session }}";
    let isSending = false;
    let attachedFile = null;
    let pendingRequests = {};
    let defaultModelName = 'qwen3-vl:8b-instruct';
    let sessionsData = {};
    let syncInterval = null;
    let newMessageIndicators = {};
    let sessionRequestStatus = {};
    let lastCompletionTime = {};
    let sessionsUpdateTimeout = null;

    // Переменные для записи голоса
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    // -------------------------------
    // Вспомогательные функции
    // -------------------------------
    function pad(n) { 
        return n.toString().padStart(2, '0'); 
    }

    // -------------------------------
    // Форматирование размера файла
    // -------------------------------
    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Б';
        if (!bytes) return '';
        
        const k = 1024;
        const sizes = ['Б', 'КБ', 'МБ', 'ГБ'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    // -------------------------------
    // Декодирование HTML-сущностей
    // -------------------------------
    function decodeHtmlEntities(text) {
        if (!text) return '';
        const textarea = document.createElement('textarea');
        textarea.innerHTML = text;
        return textarea.value;
    }

    // -------------------------------
    // Экранирование HTML
    // -------------------------------
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // -------------------------------
    // Форматирование даты
    // -------------------------------
    function formatFullDateTime(ts) {
        if (!ts) return '';
        try {
            const date = new Date(ts);
            if (isNaN(date.getTime())) {
                return ts.replace('T', ' ').slice(0, 19);
            }
            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            const seconds = date.getSeconds().toString().padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        } catch (e) {
            return ts.replace('T', ' ').slice(0, 19);
        }
    }

    // -------------------------------
    // Функции для работы с модальным окном изображений
    // -------------------------------
    function openImageModal(imgSrc, imgAlt) {
        const modal = document.getElementById('image-modal');
        const modalImg = document.getElementById('modal-image');
        const captionText = document.getElementById('modal-caption');
        
        modal.style.display = "block";
        modalImg.src = imgSrc;
        captionText.innerHTML = imgAlt;
    }

    function closeImageModal() {
        const modal = document.getElementById('image-modal');
        modal.style.display = "none";
    }

    // -------------------------------
    // Обновление счетчика сообщений
    // -------------------------------
    function updateMessageCount() {
        const count = document.querySelectorAll('.user-message, .assistant-message, .bot-message').length;
        document.getElementById('context-info').textContent = `Сообщений: ${count}`;
    }

    // -------------------------------
    // Управление индикаторами новых сообщений (✉️) 
    // -------------------------------
    function setNewMessageIndicator(sessionId, show) {
        if (show) {
            newMessageIndicators[sessionId] = true;
        } else {
            delete newMessageIndicators[sessionId];
        }
        updateSessionsListFromData();
    }

    // -------------------------------
    // Получение статусов очереди с сервера
    // -------------------------------
    function fetchQueueStatus() {
        fetch('/api/queue/status')
            .then(res => res.json())
            .then(data => {
                const newStatus = {};
                const now = Date.now();
                
                if (data.processing) {
                    const proc = data.processing;
                    newStatus[proc.session_id] = { status: 'processing', ...proc };
                }
                
                data.queued.forEach(item => {
                    if (!newStatus[item.session_id]) {
                        newStatus[item.session_id] = { status: 'queued', ...item };
                    }
                });
                
                const oldStatus = sessionRequestStatus;
                for (let sid in oldStatus) {
                    if (oldStatus[sid].status === 'error' && !newStatus[sid]) {
                        newStatus[sid] = oldStatus[sid];
                    }
                }
                
                Object.keys(newStatus).forEach(sid => {
                    if (lastCompletionTime[sid] && now - lastCompletionTime[sid] < 3000) {
                        const hasActive = (data.processing && data.processing.session_id === sid) ||
                                          data.queued.some(item => item.session_id === sid);
                        if (!hasActive) {
                            delete newStatus[sid];
                        }
                    }
                });
                
                sessionRequestStatus = newStatus;
                updateSessionsListFromData();
            })
            .catch(err => console.error('Ошибка получения статусов очереди:', err));
    }

    // -------------------------------
    // Загрузка списка сеансов с сервера
    // -------------------------------
    function loadSessionsFromServer() {
        return fetch('/api/sessions')
            .then(res => res.json())
            .then(sessions => {
                let updated = false;
                let titlesChanged = false;
                
                sessions.forEach(s => {
                    if (!sessionsData[s.id]) {
                        sessionsData[s.id] = {
                            title: s.title,
                            updated_at: s.updated_at
                        };
                        updated = true;
                    } else {
                        if (sessionsData[s.id].title !== s.title) {
                            sessionsData[s.id].title = s.title;
                            sessionsData[s.id].updated_at = s.updated_at;
                            updated = true;
                            titlesChanged = true;
                        } else if (sessionsData[s.id].updated_at !== s.updated_at) {
                            sessionsData[s.id].updated_at = s.updated_at;
                            updated = true;
                        }
                    }
                    
                    const prevUnread = newMessageIndicators[s.id] ? true : false;
                    const newUnread = s.has_unread ? true : false;
                    if (prevUnread !== newUnread) {
                        updated = true;
                    }
                    
                    if (s.has_unread) {
                        newMessageIndicators[s.id] = true;
                    } else {
                        delete newMessageIndicators[s.id];
                    }
                });
                
                Object.keys(sessionsData).forEach(id => {
                    if (!sessions.find(s => s.id === id)) {
                        delete sessionsData[id];
                        delete newMessageIndicators[id];
                        delete lastCompletionTime[id];
                        updated = true;
                    }
                });
                
                if (updated) {
                    updateSessionsList(sessions, titlesChanged);
                }
                
                return sessions;
            })
            .catch(err => console.error('Ошибка загрузки сеансов:', err));
    }

    function forceRefreshSessions() {
        loadSessionsFromServer().then(() => {
            console.log('Список сеансов обновлен');
        });
    }

    // -------------------------------
    // Обновление списка сеансов в DOM (основная функция) с debounce
    // -------------------------------
    function updateSessionsListFromData() {
        if (sessionsUpdateTimeout) {
            clearTimeout(sessionsUpdateTimeout);
        }
        sessionsUpdateTimeout = setTimeout(() => {
            const sessions = Object.keys(sessionsData).map(id => ({
                id: id,
                title: sessionsData[id].title,
                updated_at: sessionsData[id].updated_at
            }));
            updateSessionsList(sessions, true);
            sessionsUpdateTimeout = null;
        }, 100);
    }

    function updateSessionsList(sessions, preserveIndicators = true) {
        const sessionsList = document.getElementById('sessions-list');
        const currentActiveId = currentSessionId;
        
        sessions.forEach(s => {
            if (sessionsData[s.id]) {
                s.title = sessionsData[s.id].title;
                s.updated_at = sessionsData[s.id].updated_at;
            }
        });
        
        sessions.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
        
        let html = '';
        sessions.forEach(s => {
            const isActive = s.id === currentActiveId ? 'active' : '';
            const dateStr = s.updated_at ? s.updated_at.replace('T', ' ').substring(0, 19) : '';
            
            let statusIcon = '';
            const reqStatus = sessionRequestStatus[s.id];
            if (reqStatus) {
                if (reqStatus.status === 'error') {
                    statusIcon = '<span class="session-status-icon error blink" title="Ошибка">⚠️</span>';
                } else if (reqStatus.status === 'processing') {
                    statusIcon = '<span class="session-status-icon processing blink" title="Обрабатывается">⚡</span>';
                } else if (reqStatus.status === 'queued') {
                    statusIcon = '<span class="session-status-icon queued" title="В очереди">⏳</span>';
                }
            }
            if (!statusIcon && newMessageIndicators[s.id] && s.id !== currentActiveId) {
                statusIcon = '<span class="session-status-icon unread blink" title="Новый ответ">✉️</span>';
            }
            
            html += `
                <div class="session-item ${isActive}" data-session-id="${s.id}" data-session-title="${escapeHtml(s.title)}">
                    <div class="session-content">
                        <div class="session-info">
                            <div class="session-title">
                                ${statusIcon}
                                ${escapeHtml(s.title)}
                            </div>
                            <div class="session-date">${dateStr}</div>
                        </div>
                        <button class="delete-session-button" title="Удалить сеанс">🗑️</button>
                    </div>
                </div>
            `;
        });
        
        sessionsList.innerHTML = html;
        document.getElementById('sessions-count').textContent = sessions.length;
        
        attachSessionEventHandlers();
    }

    // -------------------------------
    // Привязка обработчиков событий к элементам сеансов
    // -------------------------------
    function attachSessionEventHandlers() {
        document.querySelectorAll('.session-item').forEach(el => {
            el.addEventListener('click', function(e) {
                if (e.target.closest('.delete-session-button')) {
                    return;
                }
                
                const sessionId = this.dataset.sessionId;
                if (sessionId === currentSessionId) return;
                
                setNewMessageIndicator(sessionId, false);
                
                document.querySelectorAll('.session-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                
                switchSession(sessionId);
            });
        });
        
        document.querySelectorAll('.delete-session-button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const sessionItem = this.closest('.session-item');
                const sessionId = sessionItem.dataset.sessionId;
                const sessionTitle = sessionItem.dataset.sessionTitle;
                const sessionDate = sessionItem.querySelector('.session-date').textContent;
                
                if (confirm(`Удалить сеанс "${sessionTitle}" от ${sessionDate}?`)) {
                    deleteSession(sessionId);
                }
            });
        });
    }

    // -------------------------------
    // Запуск периодической синхронизации
    // -------------------------------
    function startSyncInterval() {
        if (syncInterval) {
            clearInterval(syncInterval);
        }
        syncInterval = setInterval(() => {
            loadSessionsFromServer();
            fetchQueueStatus();
            window.updateStatusCounter();
        }, 5000);
    }

    // -------------------------------
    // Глобальная функция обновления счётчика очереди
    // -------------------------------
    window.updateStatusCounter = function() {
        fetch('/api/queue/counts')
            .then(response => response.json())
            .then(data => {
                const counter = document.getElementById('status-counter');
                if (counter) {
                    counter.textContent = `📊 ${data.user_queued}/${data.total_queued}`;
                }
            })
            .catch(err => console.error('Ошибка обновления счётчика:', err));
    };

    function updateLastVisit(sessionId) {
        fetch(`/api/sessions/${sessionId}/visit`, { method: 'POST' })
            .catch(err => console.error('Ошибка обновления last_visit:', err));
    }

    // -------------------------------
    // Инициализация
    // -------------------------------
    document.addEventListener('DOMContentLoaded', function() {
        loadSessionsFromServer().then(() => {
            loadMessages(currentSessionId);
            startSyncInterval();
        });
        
        document.getElementById('new-session-button').addEventListener('click', createNewSession);
        document.getElementById('send-button').addEventListener('click', sendMessage);
        document.getElementById('message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // Прикрепление файлов
        document.getElementById('attach-file-button').addEventListener('click', function() {
            document.getElementById('file-input').click();
        });
        
        document.getElementById('file-input').addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                attachedFile = e.target.files[0];
                const preview = document.getElementById('file-preview-container');
                document.getElementById('file-preview-name').textContent = attachedFile.name;
                
                const fileSize = formatFileSize(attachedFile.size);
                const sizeSpan = document.getElementById('file-preview-size');
                if (sizeSpan) {
                    sizeSpan.textContent = ` (${fileSize})`;
                }
                
                preview.style.display = 'block';
            }
        });
        
        document.getElementById('remove-file-button').addEventListener('click', function() {
            attachedFile = null;
            document.getElementById('file-input').value = '';
            document.getElementById('file-preview-container').style.display = 'none';
        });
        
        // Очистка контекста
        document.getElementById('clear-context-button').addEventListener('click', function() {
            if (confirm('Очистить всю переписку в этом сеансе?')) {
                clearHistory();
            }
        });
        
        // Сохранение чата
        document.getElementById('save-chat-button').addEventListener('click', saveChatAsHTML);
        
        // Закрытие модального окна по ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeImageModal();
            }
        });

        window.updateStatusCounter();
        fetchQueueStatus();

        // Кнопка записи голоса
        const voiceButton = document.getElementById('voice-record-button');
        voiceButton.addEventListener('click', toggleVoiceRecording);
    });

    // -------------------------------
    // Загрузка сообщений сеанса
    // -------------------------------
    function loadMessages(sessionId) {
        return fetch(`/api/sessions/${sessionId}/messages`)
            .then(res => res.json())
            .then(messages => {
                const container = document.getElementById('chat-messages');
                container.innerHTML = '';
                
                fetch(`/api/sessions/${sessionId}/model-info`)
                    .then(res => res.json())
                    .then(data => {
                        defaultModelName = data.model_name || 'qwen3-vl:8b-instruct-q4_K_M';
                    })
                    .catch(err => console.error('Error loading model info:', err));
                
                let lastUserMessage = null;
                
                messages.forEach((msg) => {
                    if (msg.role === 'user') {
                        lastUserMessage = msg;
                        displayMessage(
                            msg.role, 
                            msg.content, 
                            msg.file_data, 
                            msg.file_type, 
                            msg.file_name, 
                            msg.timestamp,
                            null, null, null, null, null, null
                        );
                    } else if (msg.role === 'assistant') {
                        let responseTime = null;
                        if (lastUserMessage) {
                            const userTime = new Date(lastUserMessage.timestamp);
                            const assistantTime = new Date(msg.timestamp);
                            const diffSeconds = (assistantTime - userTime) / 1000;
                            responseTime = Math.round(diffSeconds * 10) / 10;
                        }
                        
                        if (msg.response_time) {
                            if (typeof msg.response_time === 'object') {
                                responseTime = msg.response_time;
                            } else if (!isNaN(parseFloat(msg.response_time))) {
                                responseTime = parseFloat(msg.response_time);
                            }
                        }
                        
                        let mmTime = msg.mm_time;
                        let genTime = msg.gen_time;
                        let mmModel = msg.mm_model;
                        let genModel = msg.gen_model;
                        
                        if (mmTime && genTime) {
                            responseTime = {
                                mm_time: parseFloat(mmTime),
                                gen_time: parseFloat(genTime),
                                mm_model: mmModel || 'неизвестно',
                                gen_model: genModel || 'неизвестно'
                            };
                        }
                        
                        displayMessage(
                            msg.role, 
                            msg.content,
                            msg.file_data, 
                            msg.file_type, 
                            msg.file_name, 
                            msg.timestamp,
                            responseTime,
                            msg.model_name || defaultModelName,
                            mmTime,
                            genTime,
                            mmModel,
                            genModel
                        );
                        
                        lastUserMessage = null;
                    }
                });
                
                updateMessageCount();
                container.scrollTop = container.scrollHeight;
                
                setNewMessageIndicator(sessionId, false);
                updateLastVisit(sessionId);
            });
    }

    // -------------------------------
    // Отображение одного сообщения
    // -------------------------------
    function displayMessage(role, content, fileData, fileType, fileName, timestamp, responseTime, modelName, mmTime, genTime, mmModel, genModel) {
        const container = document.getElementById('chat-messages');
        const msgDiv = document.createElement('div');
        
        if (role === 'user') {
            msgDiv.className = 'user-message';
        } else {
            msgDiv.className = 'assistant-message';
            msgDiv.classList.add('bot-message');
        }
        
        if (!timestamp) {
            timestamp = new Date().toISOString();
        }
        
        msgDiv.setAttribute('data-timestamp', timestamp);
        
        if (role === 'assistant') {
            if (modelName) {
                msgDiv.dataset.modelName = modelName;
            }
            if (responseTime && typeof responseTime === 'object') {
                if (responseTime.mm_time) msgDiv.dataset.mmTime = responseTime.mm_time;
                if (responseTime.gen_time) msgDiv.dataset.genTime = responseTime.gen_time;
                if (responseTime.mm_model) msgDiv.dataset.mmModel = responseTime.mm_model;
                if (responseTime.gen_model) msgDiv.dataset.genModel = responseTime.gen_model;
            } else if (mmTime && genTime) {
                msgDiv.dataset.mmTime = mmTime;
                msgDiv.dataset.genTime = genTime;
                msgDiv.dataset.mmModel = mmModel || 'неизвестно';
                msgDiv.dataset.genModel = genModel || 'неизвестно';
            }
        }
        
        let timeDisplay = formatFullDateTime(timestamp);
        
        // Информация о файле для пользователя
        if (role === 'user' && fileName && fileData) {
            const base64Length = fileData.length;
            const fileSizeBytes = Math.round((base64Length * 3) / 4);
            const fileSize = formatFileSize(fileSizeBytes);
            timeDisplay += ` <span class="file-info">[📎 ${fileName}, ${fileSize}]</span>`;
            
            if (fileType && fileType.startsWith('image/')) {
                timeDisplay += ` <a href="data:${fileType};base64,${fileData}" 
                                    download="${fileName || 'image.jpg'}" 
                                    class="download-link-inline" 
                                    title="Скачать изображение"
                                    onclick="event.stopPropagation()">⬇️</a>`;
            }
        }
        
        // Информация о файле для ассистента
        if (role === 'assistant' && fileName && fileData) {
            const base64Length = fileData.length;
            const fileSizeBytes = Math.round((base64Length * 3) / 4);
            const fileSize = formatFileSize(fileSizeBytes);
            timeDisplay += ` <span class="file-info">[📎 ${fileName}, ${fileSize}]</span>`;
            
            if (fileType && fileType.startsWith('image/')) {
                timeDisplay += ` <a href="data:${fileType};base64,${fileData}" 
                                    download="${fileName || 'generated_image.jpg'}" 
                                    class="download-link-inline" 
                                    title="Скачать изображение"
                                    onclick="event.stopPropagation()">⬇️</a>`;
            }
        }
        
        let headerHTML = `<span class="message-header">📅 ${timeDisplay}`;
        
        if (role === 'assistant') {
            if (modelName) {
                const shortModel = modelName.split('/').pop() || modelName;
                headerHTML += ` <span class="text-muted">| ${escapeHtml(shortModel)}</span>`;
            }
            
            let duration = null;
            if (responseTime) {
                if (typeof responseTime === 'object') {
                    if (responseTime.mm_time && responseTime.gen_time) {
                        duration = (parseFloat(responseTime.mm_time) + parseFloat(responseTime.gen_time)).toFixed(1);
                    } else if (responseTime.mm_time) {
                        duration = parseFloat(responseTime.mm_time).toFixed(1);
                    } else if (responseTime.gen_time) {
                        duration = parseFloat(responseTime.gen_time).toFixed(1);
                    }
                } else if (typeof responseTime === 'number' || !isNaN(parseFloat(responseTime))) {
                    duration = parseFloat(responseTime).toFixed(1);
                }
            }
            if (duration) {
                headerHTML += ` <span class="text-muted">⏱️ ${duration}с</span>`;
            }
        }
        
        headerHTML += '</span>';
        
        let contentHTML = `<div class="message-content">`;
        
        if (typeof content === 'string') {
            if (content.startsWith('[')) {
                try {
                    const parts = JSON.parse(content);
                    let textContent = '';
                    parts.forEach(part => {
                        if (part.type === 'text') {
                            textContent += part.text + '\n';
                        }
                    });
                    if (textContent) {
                        const escapedText = escapeHtml(textContent.trim());
                        contentHTML += marked.parse(escapedText);
                    }
                } catch (e) {
                    if (role === 'assistant') {
                        const decodedText = decodeHtmlEntities(content);
                        contentHTML += marked.parse(decodedText);
                    } else {
                        const escapedText = escapeHtml(content);
                        contentHTML += marked.parse(escapedText);
                    }
                }
            } else {
                if (role === 'assistant') {
                    const decodedText = decodeHtmlEntities(content);
                    contentHTML += marked.parse(decodedText);
                } else {
                    const escapedText = escapeHtml(content);
                    contentHTML += marked.parse(escapedText);
                }
            }
        }
        
        contentHTML += '</div>';
        
        msgDiv.innerHTML = headerHTML + contentHTML;
        
        if (fileData) {
            let fileHTML = '';
            if (fileType && fileType.startsWith('image/')) {
                fileHTML = `
                    <div class="image-container">
                        <img src="data:${fileType};base64,${fileData}" 
                            class="attached-image" 
                            alt="${fileName || 'attached image'}"
                            title="Нажмите для увеличения"
                            onclick="openImageModal(this.src, '${fileName || 'Изображение'}')">
                    </div>
                `;
            } else if (fileType && fileType.startsWith('audio/')) {
                fileHTML = `<audio controls src="data:${fileType};base64,${fileData}"></audio>`;
            } else {
                fileHTML = `<div class="attached-file">
                                <span class="file-icon">📄</span>
                                <a href="data:${fileType};base64,${fileData}" download="${fileName}">${fileName}</a>
                            </div>`;
            }
            msgDiv.innerHTML += fileHTML;
        }
        
        container.appendChild(msgDiv);
        container.scrollTop = container.scrollHeight;
        
        updateMessageCount();
        
        setTimeout(() => {
            addCopyButtonsToMessage(msgDiv);
        }, 50);
    }

    // -------------------------------
    // Функции записи голоса
    // -------------------------------
    async function toggleVoiceRecording() {
        if (isRecording) {
            await stopRecording();
        } else {
            await startRecording();
        }
    }

    async function startRecording() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert('Ваш браузер не поддерживает запись audio');
            return;
        }
        // Проверка безопасного контекста для мобильных
        if (!window.isSecureContext) {
            alert('Для записи голоса требуется безопасное соединение (HTTPS).\nПопробуйте открыть сайт по HTTPS или localhost.');
            return;
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }
            };
            
            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                sendVoiceMessage(audioBlob);
                stream.getTracks().forEach(track => track.stop());
            };
            
            mediaRecorder.start();
            isRecording = true;
            
            document.getElementById('voice-record-button').classList.add('recording');
            document.getElementById('recording-indicator').style.display = 'inline';
        } catch (err) {
            console.error('Ошибка доступа к микрофону:', err);
            alert('Не удалось получить доступ к микрофону. Убедитесь, что сайт открыт по HTTPS или localhost, и разрешите использование микрофона.');
        }
    }

    async function stopRecording() {
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            isRecording = false;
            
            document.getElementById('voice-record-button').classList.remove('recording');
            document.getElementById('recording-indicator').style.display = 'none';
        }
    }

    // -------------------------------
    // Отправка голосового сообщения
    // -------------------------------
    async function sendVoiceMessage(blob) {
        // Генерируем имя с датой: voice_YYYYMMDD_HHMMSS.webm
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const filename = `voice_${year}${month}${day}_${hours}${minutes}${seconds}.webm`;  
        
        const file = new File([blob], filename, { type: 'audio/webm' });
        attachedFile = file;
        
        // Показываем превью
        const preview = document.getElementById('file-preview-container');
        document.getElementById('file-preview-name').textContent = file.name;
        const fileSize = formatFileSize(file.size);
        document.getElementById('file-preview-size').textContent = ` (${fileSize})`;
        preview.style.display = 'block';
        
        // Автоматически отправляем
        sendMessage();
    }

    // -------------------------------
    // Отправка сообщения (ИЗМЕНЕНО: обработка ответов сервера)
    // -------------------------------
    async function sendMessage() {
        const input = document.getElementById('message-input');
        const text = input.value.trim();
        if (!text && !attachedFile) {
            alert('Введите сообщение или прикрепите файл');
            return;
        }
        
        if (isSending) return;
        isSending = true;
        
        const sendButton = document.getElementById('send-button');
        sendButton.disabled = true;
        sendButton.innerHTML = '⏳ Отправка...';
        
        const messageCount = document.querySelectorAll('.user-message').length;
        if (messageCount === 0) {
            let newTitle = text ? text.slice(0, 40) + (text.length > 40 ? '...' : '') : '';
            if (!newTitle && attachedFile) {
                newTitle = attachedFile.name.slice(0, 40) + (attachedFile.name.length > 40 ? '...' : '');
            }
            if (newTitle) {
                updateSessionTitle(currentSessionId, newTitle);
                
                fetch(`/api/sessions/${currentSessionId}/update-title`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({title: newTitle})
                }).catch(err => console.error('Ошибка обновления заголовка:', err));
            }
        }
        
        delete lastCompletionTime[currentSessionId];
        
        const now = new Date();
        const timestamp = now.toISOString();
        
        const userContent = [];
        if (text) {
            userContent.push({"type": "text", "text": text});
        }
        
        let fileData = null;
        let fileType = null;
        let fileName = null;
        
        const tempAttachedFile = attachedFile;
        const tempText = text;
        
        const displayUserMessage = (fileData, fileType, fileName) => {
            if (fileData) {
                // Определяем тип вложения
                let type = "file";
                if (fileType && fileType.startsWith('image/')) type = "image";
                else if (fileType && fileType.startsWith('audio/')) type = "audio";
                userContent.push({
                    "type": type, 
                    "file_data": fileData, 
                    "file_type": fileType, 
                    "file_name": fileName
                });
            }
            
            displayMessage(
                'user', 
                JSON.stringify(userContent), 
                fileData, 
                fileType, 
                fileName, 
                timestamp
            );
            
            input.value = '';
            attachedFile = null;
            document.getElementById('file-preview-container').style.display = 'none';
            document.getElementById('file-input').value = '';
        };
        
        const sendToServer = async () => {
            try {
                let response;
                
                if (tempAttachedFile) {
                    const formData = new FormData();
                    formData.append('message', tempText);
                    formData.append('file', tempAttachedFile);
                    
                    response = await fetch('/send_message', {
                        method: 'POST',
                        body: formData
                    });
                } else {
                    response = await fetch('/send_message', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: tempText
                        })
                    });
                }
                
                const data = await response.json();
                console.log('Ответ от сервера:', data);
                
                // Если есть транскрибированный текст (для аудио) – показываем его
                if (data.transcribed_text) {
                    // Уже показано пользовательское сообщение, добавляем транскрипцию
                    displayMessage(
                        'assistant',
                        `🎤 Распознано: ${data.transcribed_text}`,
                        null, null, null,
                        new Date().toISOString(),
                        null,
                        'whisper'
                    );
                    // Для аудио запрос в очередь не ставится, завершаем
                    sendButton.disabled = false;
                    sendButton.innerHTML = 'Отправить';
                    isSending = false;
                    return;
                }
                
                if (data.status === 'queued') {
                    sessionRequestStatus[currentSessionId] = { status: 'queued' };
                    updateSessionsListFromData();

                    pendingRequests[data.request_id] = { sessionId: currentSessionId, processed: false };
                    
                    const waitMinutes = Math.floor(data.estimated_wait / 60);
                    const waitSeconds = Math.round(data.estimated_wait % 60);
                    const waitText = waitMinutes > 0 
                        ? `${waitMinutes} мин ${waitSeconds} сек`
                        : `${waitSeconds} сек`;
                    
                    const notification = document.createElement('div');
                    notification.className = 'queue-notification';
                    notification.innerHTML = `
                        <div class="notification-content">
                            <span>⏳ Запрос в очереди (позиция ${data.position})</span>
                            <span class="wait-time">~${waitText}</span>
                        </div>
                    `;
                    document.querySelector('.chat-header').appendChild(notification);
                    setTimeout(() => notification.remove(), 5000);
                    
                    window.updateStatusCounter();
                    
                    startResultPolling(data.request_id);
                } else if (data.response) {
                    displayMessage(
                        'assistant',
                        data.response,
                        data.generated_image,
                        data.file_type,
                        data.file_name,
                        data.assistant_timestamp,
                        data.response_time,
                        data.model_used
                    );
                }
                
            } catch (err) {
                alert('Ошибка: ' + err.message);
                console.error('Send message error:', err);
                const lastMessage = document.querySelector('.user-message:last-child');
                if (lastMessage) {
                    lastMessage.style.borderLeft = '3px solid #e74c3c';
                }
            } finally {
                sendButton.disabled = false;
                sendButton.innerHTML = 'Отправить';
                isSending = false;
            }
        };

        function startResultPolling(requestId) {
            console.log('Start polling for request:', requestId);
            let pollCount = 0;
            const maxPolls = 120;
            
            const pollInterval = setInterval(async () => {
                pollCount++;
                
                try {
                    const response = await fetch(`/api/queue/result/${requestId}`);
                    const data = await response.json();
                    console.log('Poll result:', data);
                    
                    if (data.status === 'completed') {
                        clearInterval(pollInterval);
                        console.log('Request completed, result:', data.result);
                        
                        if (data.result) {
                            const resultSessionId = data.result.session_id || pendingRequests[requestId]?.sessionId;
                            
                            if (data.result.error) {
                                if (resultSessionId === currentSessionId) {
                                    displayMessage(
                                        'assistant',
                                        `⚠️ ${data.result.error}`,
                                        null, null, null,
                                        data.result.assistant_timestamp || new Date().toISOString(),
                                        data.result.response_time,
                                        'system'
                                    );
                                    delete sessionRequestStatus[resultSessionId];
                                } else if (resultSessionId) {
                                    sessionRequestStatus[resultSessionId] = { status: 'error' };
                                }
                                lastCompletionTime[resultSessionId] = Date.now() + 5000;
                                updateSessionsListFromData();
                            }
                            else if (data.result.response) {
                                let responseTime = data.result.response_time;
                                let modelUsed = data.result.model_used;
                                const isError = data.result.is_error || false;
                                
                                console.log('Processing completed result:', {
                                    responseTime,
                                    modelUsed,
                                    type: typeof responseTime,
                                    value: responseTime
                                });
                                
                                if (data.result.mm_time && data.result.gen_time) {
                                    responseTime = {
                                        mm_time: data.result.mm_time,
                                        gen_time: data.result.gen_time,
                                        mm_model: data.result.mm_model,
                                        gen_model: data.result.gen_model
                                    };
                                    modelUsed = data.result.gen_model;
                                } else if (typeof responseTime === 'string' && responseTime.startsWith('{')) {
                                    try {
                                        responseTime = JSON.parse(responseTime);
                                    } catch (e) {
                                        console.log('Failed to parse responseTime JSON:', e);
                                    }
                                }
                                
                                console.log('Final responseTime before display:', responseTime);
                                
                                if (resultSessionId === currentSessionId) {
                                    displayMessage(
                                        'assistant',
                                        data.result.response,
                                        data.result.generated_image,
                                        data.result.file_type,
                                        data.result.file_name,
                                        data.result.assistant_timestamp || new Date().toISOString(), 
                                        responseTime,
                                        modelUsed
                                    );
                                    delete sessionRequestStatus[resultSessionId];
                                    
                                    updateLastVisit(currentSessionId);
                                } else {
                                    console.log(`Ответ для сеанса ${resultSessionId}, не текущего`);
                                    setNewMessageIndicator(resultSessionId, true);
                                    delete sessionRequestStatus[resultSessionId];
                                }
                                lastCompletionTime[resultSessionId] = Date.now() + 5000;
                            }
                        }
                        
                        delete pendingRequests[requestId];
                        
                        window.updateStatusCounter();
                        fetchQueueStatus();
                        
                        setTimeout(() => {
                            loadSessionsFromServer();
                        }, 500);
                        
                    } else if (data.status === 'error') {
                        clearInterval(pollInterval);
                        console.error('Request error:', data.error);
                        
                        const resultSessionId = data.result?.session_id || pendingRequests[requestId]?.sessionId;
                        
                        if (resultSessionId === currentSessionId) {
                            displayMessage(
                                'assistant',
                                `⚠️ Ошибка: ${data.error || 'Неизвестная ошибка'}`,
                                null, null, null,
                                data.result?.assistant_timestamp || new Date().toISOString(),
                                data.result?.response_time,
                                'system'
                            );
                            delete sessionRequestStatus[resultSessionId];
                        } else if (resultSessionId) {
                            sessionRequestStatus[resultSessionId] = { status: 'error' };
                        }
                        lastCompletionTime[resultSessionId] = Date.now() + 5000;
                        updateSessionsListFromData();
                        
                        delete pendingRequests[requestId];
                        
                        window.updateStatusCounter();
                        fetchQueueStatus();
                        
                    } else if (data.status === 'pending') {
                        console.log('Request still pending...');
                        const reqSessionId = pendingRequests[requestId]?.sessionId;
                        if (reqSessionId) {
                            if (!sessionRequestStatus[reqSessionId] || sessionRequestStatus[reqSessionId].status !== 'processing') {
                                sessionRequestStatus[reqSessionId] = { status: 'processing' };
                                updateSessionsListFromData();
                            }
                        }
                    }
                    
                    if (pollCount >= maxPolls) {
                        clearInterval(pollInterval);
                        console.log('Polling stopped after max attempts');
                        
                        displayMessage(
                            'assistant',
                            '⚠️ Превышено время ожидания ответа. Проверьте статус запроса в панели "Мои запросы".',
                            null, null, null,
                            new Date().toISOString(),
                            null,
                            'system'
                        );
                        delete sessionRequestStatus[currentSessionId];
                        delete pendingRequests[requestId];
                    }
                    
                } catch (error) {
                    console.error('Error polling result:', error);
                    if (pollCount >= maxPolls) {
                        clearInterval(pollInterval);
                    }
                }
            }, 3000);
        }
        
        if (tempAttachedFile) {
            const reader = new FileReader();
            reader.onload = async function(e) {
                fileData = e.target.result.split(',')[1];
                fileType = tempAttachedFile.type;
                fileName = tempAttachedFile.name;
                
                displayUserMessage(fileData, fileType, fileName);
                
                await sendToServer();
            };
            reader.readAsDataURL(tempAttachedFile);
        } else {
            displayUserMessage(null, null, null);
            
            await sendToServer();
        }
    }

    // -------------------------------
    // Удаление сеанса
    // -------------------------------
    function deleteSession(sessionId) {
        for (let [id, req] of Object.entries(pendingRequests)) {
            if (req.sessionId === sessionId && !req.processed) {
                pendingRequests[id].processed = true;
            }
        }
        
        delete newMessageIndicators[sessionId];
        delete sessionRequestStatus[sessionId];
        delete lastCompletionTime[sessionId];
        
        fetch(`/api/sessions/${sessionId}/delete`, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'ok') {
                    delete sessionsData[sessionId];
                    
                    const sessionItem = document.querySelector(`.session-item[data-session-id="${sessionId}"]`);
                    if (sessionItem) {
                        sessionItem.remove();
                    }
                    
                    const sessionsCount = document.querySelectorAll('.session-item').length;
                    document.getElementById('sessions-count').textContent = sessionsCount;
                    
                    if (sessionId === currentSessionId) {
                        const remainingSessions = document.querySelectorAll('.session-item');
                        if (remainingSessions.length > 0) {
                            const firstSession = remainingSessions[0];
                            const firstSessionId = firstSession.dataset.sessionId;
                            switchSession(firstSessionId);
                        } else {
                            setTimeout(() => {
                                createNewSession();
                            }, 50);
                        }
                    }
                }
            })
            .catch(err => {
                alert('Ошибка при удалении сеанса: ' + err.message);
            });
    }

    // Функции для копирования кода
    async function copyToClipboard(text) {
        try {
            await navigator.clipboard.writeText(text);
            return true;
        } catch (err) {
            console.error('Ошибка копирования через clipboard API:', err);
            try {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                const success = document.execCommand('copy');
                document.body.removeChild(textarea);
                return success;
            } catch (fallbackErr) {
                console.error('Ошибка копирования через execCommand:', fallbackErr);
                return false;
            }
        }
    }

    async function handleCopyClick(button, codeElement) {
        const code = codeElement.textContent || codeElement.innerText;
        const originalHTML = button.innerHTML;
        const originalClass = button.className;
        
        button.innerHTML = '⏳';
        button.disabled = true;
        
        const success = await copyToClipboard(code);
        
        if (success) {
            button.innerHTML = '✓';
            button.className = originalClass + ' copied';
            button.title = 'Скопировано!';
            
            setTimeout(() => {
                button.innerHTML = '📋';
                button.className = originalClass.replace(' copied', '');
                button.title = 'Копировать код';
                button.disabled = false;
            }, 2000);
        } else {
            button.innerHTML = '✗';
            button.title = 'Ошибка копирования';
            
            setTimeout(() => {
                button.innerHTML = '📋';
                button.title = 'Копировать код';
                button.disabled = false;
            }, 2000);
        }
    }

    // -------------------------------
    // Добавление кнопок копирования
    // -------------------------------
    function addCopyButtonsToMessage(messageElement) {
        if (!messageElement) return;
        
        // Обработка блоков кода (pre code)
        const codeBlocks = messageElement.querySelectorAll('pre code');
        codeBlocks.forEach((codeBlock) => {
            const parent = codeBlock.parentNode;
            if (parent.classList.contains('code-block-wrapper')) return;
            
            const wrapper = document.createElement('div');
            wrapper.className = 'code-block-wrapper';
            
            const copyButton = document.createElement('button');
            copyButton.className = 'copy-code-button';
            copyButton.innerHTML = '📋';
            copyButton.title = 'Копировать код';
            copyButton.setAttribute('aria-label', 'Копировать код');
            
            copyButton.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                handleCopyClick(copyButton, codeBlock);
            });
            
            parent.parentNode.insertBefore(wrapper, parent);
            wrapper.appendChild(parent);
            wrapper.appendChild(copyButton);
        });
        
        // Кнопка для транскрибированных сообщений
        const contentDiv = messageElement.querySelector('.message-content');
        if (contentDiv && !contentDiv.querySelector('.copy-transcript-button')) {
            const text = contentDiv.innerText || contentDiv.textContent;
            if (text.includes('🎤 Распознано:')) {
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-transcript-button';
                copyBtn.innerHTML = '📋';
                copyBtn.title = 'Копировать текст';
                copyBtn.onclick = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const textToCopy = text.replace('🎤 Распознано:', '').trim();
                    copyToClipboard(textToCopy);
                    copyBtn.innerHTML = '✓';
                    setTimeout(() => copyBtn.innerHTML = '📋', 2000);
                };
                contentDiv.style.position = 'relative';
                contentDiv.appendChild(copyBtn);
            }
        }
    }

    function addCopyButtonsToAllCodeBlocks() {
        document.querySelectorAll('.user-message, .assistant-message, .bot-message').forEach(message => {
            addCopyButtonsToMessage(message);
        });
    }

    function setupCopyButtonsObserver() {
        const chatMessages = document.getElementById('chat-messages');
        if (!chatMessages) return;
        
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                mutation.addedNodes.forEach((node) => {
                    if (node.nodeType === Node.ELEMENT_NODE) {
                        if (node.classList && 
                            (node.classList.contains('user-message') || 
                            node.classList.contains('assistant-message') || 
                            node.classList.contains('bot-message'))) {
                            addCopyButtonsToMessage(node);
                        }
                        
                        const messages = node.querySelectorAll?.('.user-message, .assistant-message, .bot-message');
                        if (messages) {
                            messages.forEach(addCopyButtonsToMessage);
                        }
                    }
                });
            });
        });
        
        observer.observe(chatMessages, {
            childList: true,
            subtree: true
        });
    }

    const originalLoadMessages = window.loadMessages || function(){};

    window.loadMessages = function(sessionId) {
        return originalLoadMessages(sessionId).then(() => {
            setTimeout(addCopyButtonsToAllCodeBlocks, 100);
        });
    };

    const originalDisplayMessage = window.displayMessage || function(){};

    window.displayMessage = function(role, content, fileData, fileType, fileName, timestamp, responseTime, modelName) {
        const result = originalDisplayMessage.call(this, role, content, fileData, fileType, fileName, timestamp, responseTime, modelName);
        
        const messages = document.getElementById('chat-messages');
        if (messages) {
            const lastMessage = messages.lastElementChild;
            if (lastMessage) {
                setTimeout(() => addCopyButtonsToMessage(lastMessage), 50);
            }
        }
        
        return result;
    };

    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(setupCopyButtonsObserver, 500);
        setTimeout(addCopyButtonsToAllCodeBlocks, 1000);
    });

    function formatResponseTime(responseTime) {
        if (!responseTime) return '';
        if (typeof responseTime === 'object') {
            if (responseTime.mm_time && responseTime.gen_time) {
                const total = (parseFloat(responseTime.mm_time) + parseFloat(responseTime.gen_time)).toFixed(1);
                return `⏱️ ${total}с (mm: ${responseTime.mm_time}с, gen: ${responseTime.gen_time}с)`;
            } else if (responseTime.mm_time) {
                return `⏱️ ${parseFloat(responseTime.mm_time).toFixed(1)}с (mm)`;
            } else if (responseTime.gen_time) {
                return `⏱️ ${parseFloat(responseTime.gen_time).toFixed(1)}с (gen)`;
            }
        } else {
            const val = parseFloat(responseTime);
            if (!isNaN(val)) {
                return `⏱️ ${val.toFixed(1)}с`;
            }
        }
        return '';
    }

</script>
