<!-- templates/components/service_status.html -->

<div class="services-status-panel">
    <div class="status-header" onclick="toggleServicesPanel()">
        <div class="header-left">
            <h3>🔌 Состояние сервисов</h3>
            <span class="services-global-indicator" id="services-global-indicator" title="Все сервисы работают">🟢</span>
        </div>
        <div class="header-right">
            <button class="refresh-status-small" onclick="event.stopPropagation(); window.serviceMonitor.updateStatus()" title="Обновить">↻</button>
            <span class="collapse-icon" id="services-collapse-icon">▼</span>
        </div>
    </div>
    
    <div class="services-content" id="services-content" style="display: none;">
        <!-- Ollama статус -->
        <div class="service-card" id="ollama-status">
            <div class="service-header">
                <span class="service-name">🦙 Ollama</span>
                <span class="service-location" id="ollama-location"></span>
                <span class="service-health-indicator" id="ollama-health"></span>
            </div>
        </div>
        
        <!-- Automatic1111 статус -->
        <div class="service-card" id="automatic1111-status">
            <div class="service-header">
                <span class="service-name">🎨 Automatic1111</span>
                <span class="service-location" id="automatic1111-location"></span>
                <span class="service-health-indicator" id="automatic1111-health"></span>
            </div>
        </div>
        
        <!-- Camera API статус -->
        <div class="service-card" id="camera-status">
            <div class="service-header">
                <span class="service-name">📷 Камеры</span>
                <span class="service-location" id="camera-location"></span>
                <span class="service-health-indicator" id="camera-health"></span>
            </div>
        </div>
    </div>
</div>

<script>
function toggleServicesPanel() {
    const content = document.getElementById('services-content');
    const icon = document.getElementById('services-collapse-icon');
    const isCollapsed = content.style.display === 'none';
    
    content.style.display = isCollapsed ? 'block' : 'none';
    icon.textContent = isCollapsed ? '▼' : '▶';
    localStorage.setItem('servicesPanelCollapsed', !isCollapsed);
}

document.addEventListener('DOMContentLoaded', function() {
    const content = document.getElementById('services-content');
    const icon = document.getElementById('services-collapse-icon');
    let shouldCollapse = localStorage.getItem('servicesPanelCollapsed') === 'true';
    
    // Для мобильных устройств (ширина ≤ 768px) по умолчанию сворачиваем панель, если настройка отсутствует
    if (window.innerWidth <= 768 && localStorage.getItem('servicesPanelCollapsed') === null) {
        shouldCollapse = false; // скрыто
    }
    
    if (shouldCollapse) {
        content.style.display = 'block';
        icon.textContent = '▼';
    } else {
        content.style.display = 'none';
        icon.textContent = '▶';
    }
});
</script>
